[package]
name = "comms-outward"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "通信层面 B（中转）：HTTP 中转搬字节那一层 —— 按路径前缀分流、逐块透传、tee；钥匙、端口、期限、上游选择都由后端交进来。"

[lib]
path = "lib.rs"

# 只许这几条：中转不认识任何业务 crate（边界判据按依赖图判）。
[dependencies]
copy-core = { path = "../../common/copy-core" }
relay-route-core = { path = "../../common/relay-route-core" }
# 有上限读（读上限 `Cap` · 同步整读）的唯一一份；零依赖。
cap-core = { path = "../../common/cap-core" }
upstream-url-core = { path = "../../common/upstream-url-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
guard-core = { path = "../../common/guard-core" }

[features]
default = []
# 后端那几条组合判据（真中转 ＋ 上游选择 / tap / 内存探针）要够到的内部件；只由后端的测试档开，发布构建不开。
test-support = []

[lints.clippy]
# 出站 TCP 不在这里开（禁的路径与理由住同目录 `clippy.toml`）：去上游经宿主交进来的那一口（后端交的是出网口）。
disallowed_methods = "deny"
# 放行一律 `expect` 带理由（测试段在 `lib.rs` 根上一行放开）。
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# 丢一个 `Result` 写 `.discard(Why::…)`：理由住调用处，类型挡住拼错。
let_underscore_must_use = "deny"
unused_result_ok = "deny"
# 线上类型的 `match` 列全变体：加一个变体时编译器点名每一处。
wildcard_enum_match_arm = "deny"
