[package]
name = "resident-client"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
publish = false
description = "连远端常驻后端的客户端那一侧（桌面 monitor 与手机嵌的 Rust 核心同一份）：帧客户端（hello 之前不许写 · 期限与撤单）· 握手 · 重连退避 · 版本门 · 在看名单。下面接任何 AsyncRead + AsyncWrite。"

[lib]
path = "lib.rs"

[dependencies]
# 能力事实（`Offer`）· 撤单的词（`Withdraw`）· 问后端失败了的那一套（`CallError` · `MAX_PENDING`）：通信层面 A 那一份。
comms-inward = { path = "../inward" }
copy-core = { path = "../../common/copy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
# 远端落点在 shell 里的写法（`BACKEND_LANDING_SHELL`）：后端往远端拼命令也读它。
relay-route-core = { path = "../../common/relay-route-core" }

[dev-dependencies]
test-home = { path = "../../common/test-home" }
# 等条件的兜底上限（`wall::CEILING`）：全仓同一个数。
guard-core = { path = "../../common/guard-core" }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "time", "macros", "test-util"] }

[features]
default = []
# 只给判据用的几样（停一个本来就分开的写端 · 关写半边 · 数登记）：monitor 的测试档开它；发布构建不开。
test-support = []
