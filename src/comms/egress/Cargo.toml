[package]
name = "egress"
version = "0.1.0"
edition = "2021"
workspace = "../../backend"
description = "出网口：这台所有出站 TCP 只在这里开 —— 按一份出网描述直连，或经代理（HTTP CONNECT · SOCKS5，代理鉴权 · 免代理表）。中转与拨号核心链同一份（手机经拨号核心同一份）。"

# 与 ssh-dial 并列住通信层目录（`src/comms/`），是后端那棵 workspace 的成员（`../../backend/Cargo.toml` 的 `[workspace] members`）。
# 也在后端的源码人群里（那边 `[package.metadata.guard] population`）⇒ 只读 · 零定时器 · 日志白名单这几族扫描型判据照旧管到这里。
# 本 crate 不读环境变量、不碰家目录：描述由宿主照它自己的环境造好、装进来（`install`）。
[lib]
path = "lib.rs"

[dependencies]
# 字节上限的类型（`Cap`：数与超了怎么办写在一处）住契约包；它也零依赖，引它不给本包带进第三方包。
relay-route-core = { path = "../../common/relay-route-core" }
# 回环那一个事实只有 `upstream_is_loopback` 那一个家：直连判定（`describe::stays_on_this_machine`）与测试档不许出网那一句都问它。零依赖。
upstream-url-core = { path = "../../common/upstream-url-core" }
# 代理鉴权那一头的 base64 用全仓那一份（`cmd_wire::b64`）。它带进 serde 一族，后端与拨号核心本就链着。
cmd-wire = { path = "../../common/cmd-wire" }

[features]
# 后端 · 拨号核心的测试档经 dev 依赖开它（resolver 2 ⇒ 不并进发布构建）。
test-support = []

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }

[lints.clippy]
# 禁的路径与理由住上一级的 `clippy.toml`（通信层那一份，含出站 TCP 只在这里开那一组；开 TCP 的那一处就地放行）。
disallowed_methods = "deny"
# 放行一律 `expect` 带理由（测试段在 `lib.rs` 根上一行放开）。
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
