[package]
name = "comms-inward"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "通信层面 A（前端 ↔ 后端）：通道的线上词汇 · 帧 · 客户端 · 路由器 · 拨号 · 交接件的形状 · 问后端的分流 · SSH 链路读应答。monitor（宿主那一侧）与文件窗口进程（外部前端）链同一份。"

[lib]
path = "lib.rs"

# 只许这几条：通信层不认识任何业务 crate（边界判据按依赖图判）。
[dependencies]
copy-core = { path = "../../common/copy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# `Origin` 的 TS 派生：只在测试档（本 crate 自己 · 或 monitor 的 dev 侧开 `ts`）进来，codegen 工具不进产物。
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
# `Origin` 的线上形状生成物（`src/frontend/ui/generated/Origin.ts`）由本 crate 的测试档导出。
ts-rs = "12.0.1"

[features]
default = []
# monitor 的测试档里别的 `ts_rs::TS` 类型嵌着 `Origin` ⇒ 它在 `[dev-dependencies]` 开这一格（发布二进制不开）。
ts = ["dep:ts-rs"]
