[package]
name = "comms-inward"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "通信层面 A（前端 ↔ 后端）：通道的线上词汇 · 帧 · 客户端 · 路由器 · 拨号 · 交接件的形状 · 问后端的分流 · SSH 链路读应答。monitor（宿主那一侧）与文件窗口进程（外部前端）链同一份。"

[lib]
path = "lib.rs"

# 只许这几条：通信层不认识任何业务 crate（边界判据按依赖图判）。
[dependencies]
copy-core = { path = "../../common/copy-core" }
# 机器名（`Origin` ＝ `cmd_wire::Machine`）与 typed 命令的形状指纹表：两端对上的契约，不是业务。
cmd-wire = { path = "../../common/cmd-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 本 crate 自己那几个线上形状（`ssh_link`）的生成物由测试档导出；`Origin` 的派生在 `cmd-wire`，测试档开它的 `ts`。
ts-rs = "12.0.1"
cmd-wire = { path = "../../common/cmd-wire", features = ["ts"] }

[features]
default = []
# monitor 的测试档里别的 `ts_rs::TS` 类型嵌着 `Origin` ⇒ 它在 `[dev-dependencies]` 开这一格（发布二进制不开）。
ts = ["cmd-wire/ts"]
