[package]
name = "comms-inward"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "通信层面 A（前端 ↔ 后端）：通道的线上词汇 · 帧 · 客户端 · 路由器 · 拨号 · 交接件的形状 · 问后端的分流。monitor（宿主那一侧）与文件窗口进程（外部前端）链同一份。"

[lib]
path = "lib.rs"

# 只许这几条：通信层不认识任何业务 crate（边界判据按依赖图判）。
[dependencies]
copy-core = { path = "../../common/copy-core" }
# 机器名（`Origin` ＝ `cmd_wire::Machine`）与 typed 命令的形状指纹表：两端对上的契约，不是业务。
cmd-wire = { path = "../../common/cmd-wire" }
# 读上限的类型（`Cap`：多少字节 · 超了怎么办）：带上限读一行 · 读整份（`line`）收它。零依赖的契约包。
relay-route-core = { path = "../../common/relay-route-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 判据里按墙钟等一件事只许拿兜底的那个数（`guard_core::wall::CEILING` / `rounds()`，判据 `wall_ceiling` 扫测试源）。
guard-core = { path = "../../common/guard-core" }

[features]
default = []
# monitor 的测试档里别的 `ts_rs::TS` 类型嵌着 `Origin` ⇒ 它在 `[dev-dependencies]` 开这一格（发布二进制不开）。
ts = ["cmd-wire/ts"]

[lints.clippy]
# 读盘 · 读环境 · 起进程 · 绑端口 · 期限字面量 · 静默丢 · 定时器那几组住 `src/comms/clippy.toml`；真要用的那一处就地 `expect` 写理由。
disallowed_methods = "deny"
# 放行一律 `expect` 带理由（测试段在 `lib.rs` 根上一行放开）。
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# 线上类型的 `match` 列全变体：加一个变体时编译器点名每一处。
wildcard_enum_match_arm = "deny"
