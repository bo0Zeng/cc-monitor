[package]
name = "cc-monitor-filewin"
version = "0.1.0"
edition = "2021"
workspace = "../shell"
description = "cc-monitor 的文件管理窗口（又一个前端：egui 原生窗口，一窗一进程，只经通道说 call / subscribe）。"
license = "MIT"

# 〔文件窗口成独立包 `src/frontend/filewin/`〕
#   库面 ＋ 一个 `[[bin]] cc-monitor-filewin`（一行转调 [`run`]）。二进制只经 monitor 内嵌那一份出货：发版先单编它、
#   铺进 `src/frontend/shell/native-backend/`，monitor 的 `build.rs` 嵌进去，开窗时放到 `~/.cc-monitor/bin/` 再起。
#   ⚠ size2（10-11）以前它是 monitor 包的第二个 `[[bin]]`，而 tauri-cli 按「monitor 包里每个 [[bin]]」都装进安装包
#   ⇒ 安装包里多一份与内嵌逐字节相同的 10 MB。住本包名下就不进安装包（`tests/evidence/K-R124-ruler.py` ⑭a 钉 monitor 包只剩主二进制）。
#   依赖只许契约类 ＋ 前端宿主原语 ＋ 自己的界面库；不链 monitor、不链判定类 crate（`contract_crate_guard_tests.rs` 钉）。

[lib]
name = "cc_monitor_filewin"
path = "src/lib.rs"

[[bin]]
name = "cc-monitor-filewin"
path = "src/main.rs"

[dependencies]
cmd-wire = { path = "../../common/cmd-wire" }
batch-core = { path = "../../common/batch-core" }
chunk-core = { path = "../../common/chunk-core" }
pick-core = { path = "../../common/pick-core" }
comms-inward = { path = "../../comms/inward" }
copy-core = { path = "../../common/copy-core" }
creds-core = { path = "../../common/creds-core" }
filewin-contract = { path = "../../common/filewin-contract" }
host-core = { path = "../../common/host-core" }
relay-route-core = { path = "../../common/relay-route-core" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# 上传块形（SFTP 起始目录不是后端 home 时窗口经后端链路分块写）要窗口自己算整份摘要交给提交当 `expect`。
# 已在 lockfile（`0.10.9`，别的依赖带进来的），此处提升为直接依赖、零新包。
sha2 = "0.10"

# 〔「原生选文件框」〕文件窗口（独立 egui 进程）的上传 / 存到哪儿那两问用操作系统自己的选择框。
# 与 `tauri-plugin-dialog` 同一个版本、同一组 feature（它的缺省 `gtk3` ＋ `common-controls-v6`）⇒ 锁文件不多一个 crate。
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }

# 🔴**原生文件管理窗口**（第三段）。
# 框架定案 egui 的读数住；许可 `MIT OR Apache-2.0`，与「不要 GPL」不冲突。
#
# ⚠ **为什么这两条依赖挂在 `monitor` 上，而不是一个新 crate** —— 两条独立的理由，
#    都不是省事（详细论证与现打依据住 `src/filewin/mod.rs` 的头注）：
#  ① **进程形态定的是「同进程」**：窗口要直接调 `sftp_pool` 的那些函数，
#     而那个池是 `sftp_pool.rs:539` 的**进程级 `OnceLock`** ⇒ 换进程 = 换一份池
#     = 同一台远端第二条 SSH 连接，秤 F4 钉的「6 通道 − 4 车道 = 2」会被悄悄变成两份预算。
#  ② 〔当时〕门禁 `cargo` 那一格把 workspace 包数恒等钉成一个手抄的数，新增成员要改 `gate.sh`，
#     而那不在当时的改动范围 ⇒ 当时落成 `monitor` 自己的一个模块。今天那一格的成员集合从 `cargo metadata`
#     现取，这条理由已不成立（文件窗口后来也独立成了这个包）。
#
# ⚠ **代价如实记**：这两条把依赖树从 679 个包推到约 1080 个（winit / wgpu / naga / accesskit
#    一大片）。现打核过它编得过的三档（`cargo check`）：
#      · 宿主 `x86_64-unknown-linux-gnu`     ✅
#      · `x86_64-pc-windows-gnu`（门禁 winchk 那一格用的 target）✅ 31.97 秒
#      · `x86_64-unknown-linux-musl`          ✅（只是 `check`，不是静态链接）
#    ⚠ `muslbuild` 那一格的射程是 `src/backend`（`gate.sh:1117` 逐字 `cd src/backend`）
#      ⇒ 本条依赖**碰不到它**；「GUI crate 能不能 musl 静态链接」这个设计题**这里没回答**。
egui = "0.36"
# 🔴 **渲染后端按平台分（fwgpu 10-11）：Linux 用 `glow`（OpenGL），Windows 用 `wgpu`（DX12 ＋ OpenGL）。**
#    公共这一份不点渲染后端；各平台那一份在下面 `[target.…]` 两段。eframe 的 `Renderer::default()`
#    按编进来的那一个自己选，开窗那一处（`shell.rs`）不分平台；Windows 上挑哪块显卡住 `render.rs::choose`。
#
# ## 为什么 Windows 换掉 glow
# 没装显卡驱动的 Windows（虚拟机、多数远程桌面会话）只有系统自带的 OpenGL 1.1，glow 开不出窗
# （`egui_glow requires opengl 2.0+`）。wgpu 的 DX12 在那里落到系统自带的 WARP 软件光栅器：开得了、滚动慢
# （Win11 虚拟机现打约 7 帧/秒）。带 Mesa 的软件 OpenGL 能顺，但安装包压后要多约 15 MiB，不带。
# OpenGL 那一支也编进来：没有 DX12 的老核显用它自己的 OpenGL 驱动，不掉到 WARP 变慢。
#
# ## ⚠ 锁文件里 `gpu-allocator` 的 `windows` 必须是 0.62（手钉的，别 `cargo update` 回去）
# `gpu-allocator 0.28` 的 spec 是 `windows = ">=0.53, <=0.62"`，cargo 自己解会拿本仓现成的 **0.56**（项目自用那一份），
# 而 `wgpu-hal 30` 用 **0.62** ⇒ 同一段 D3D12 代码里的 `ID3D12Device` 来自两个 crate ⇒ E0308/E0277，Windows 编不过
# （从前 Windows 也用 glow，就是因为这一条）。锁文件里那一行指到 `windows 0.62.2` 就过。
# 解回 0.56 不用另写判据：Windows 交叉检查（`winchk`）当场编不过。
#
# ## 为什么 Linux 不换
# 私有 Xvfb 里四种软件渲染比过：首帧差不多，每帧 CPU glow 最省，换了还涨约 2.5 MiB；Linux 上 OpenGL 2.0 也没缺过。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "wayland",
    "x11",
] }
# `winit` 是 `eframe` 的传递依赖，这里**提升为直接依赖**，只为一件事：
# `EventLoopBuilderExtX11` / `ExtWayland` / `ExtWindows` 这三个**平台扩展 trait**
# —— `eframe` 只 re-export 了 `EventLoopBuilder` 本体（`epi.rs:26`），没 re-export 它们，
# 而「egui 窗口跑在次线程」全靠它们的 `with_any_thread(true)`（见 `src/filewin/mod.rs` 头注）。
# ★ **版本漂了会怎样：编译器当场报错，不需要额外判据。**
#   若本条与 `eframe` 解析到两个不同的 winit 大版本，那三个 trait 就不再实现在
#   `eframe::EventLoopBuilder` 上 ⇒ `filewin::shell` 的 hook 编不过。
winit = "0.30"

# 窗口的图标（工具条 · 文件种类）：Phosphor 图标字（`MIT OR Apache-2.0`），只占私用区码位。
egui-phosphor = "0.14"
# 预览的代码高亮：egui 官方扩展包里的 syntect 那一支（`MIT OR Apache-2.0`；syntect 本身 MIT）。
egui_extras = { version = "0.36", default-features = false, features = ["syntect"] }
# 预览的图片：窗口自己解码（后端只按上限给字节）。已在锁文件里（别的依赖带进来的），这里多开几种格式。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 修改时间按本机本地时间画（`MIT OR Apache-2.0`）。已在锁文件里（别的依赖带进来的，`clock` 一支已开），零新包。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 主界面字族里的名字 → 这台机器上的那份字体文件（MIT）。
fontdb = { version = "0.23", default-features = false, features = ["std", "fs"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features"] }
# 只开 DX12 与 OpenGL 两支（不要 Vulkan / Metal / WebGPU）；着色器是 WGSL（egui-wgpu 自带的那份）。
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "gles", "wgsl"] }

[build-dependencies]
# Windows 进程清单编成资源、交给本包每一个链接产物（程序 · lib 的测试程序）：与 monitor 同一份清单、同一处编法。
#   rfd 的 `common-controls-v6` 按名字引入 comctl32 的 `TaskDialogIndirect`，没清单的程序在 Windows 上 0xc0000139 起不来。
win-manifest = { path = "../../common/win-manifest" }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
guard-core = { path = "../../common/guard-core" }
# 测试程序在 Windows 上读回自己的进程清单（`tests/frontend/filewin/app_manifest_tests.rs`）。
win-manifest = { path = "../../common/win-manifest" }
