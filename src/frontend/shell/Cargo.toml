# G2（Phase G 代码工程审计）：**这六个 crate 此前不是真 workspace member。**
# 实测 `cargo metadata` 的 `workspace_members` 只有 `monitor` 一项 —— `cargo test -p branch-core`
# 之所以能跑，靠的是 cargo 允许 `-p` 选中**依赖图里的非 member 包**，不是 workspace 机制。
# 代价：门禁得在八个地方分别跑（~17 条 `--manifest-path`/`-p`），且每个 crate 单独 test 时
# 会各落一个游离 `Cargo.lock`（`.gitignore` 为此打过补丁）。
#
# ⚠ `src/backend` **不在这里** —— 它有自己独立的 `Cargo.lock`，
# 那条隔离是真架构约束（Linux/Windows CI runner），见它自己的 `Cargo.toml` 头注。
[workspace]
members = [
    ".",
    "../../common/acct-core",
    # 帧命令两端对上的那几样：机器名 · typed 命令的形状指纹表（后端 · monitor 同一份）。
    "../../common/cmd-wire",
    # 分块传的循环（上传进暂存区 ＋ 整份摘要 · 下载逐块读回）：文件窗口与手机嵌的核心同一份。
    "../../common/chunk-core",
    # 一组一条命令的全过程与它的字（标题 · 结局句 · 断开那一行）：后端 · 文件窗口 · 手机嵌的核心同一份。
    "../../common/batch-core",
    # 选中这几项 ⇒ 能做什么（种类 · 每个出口那张表 · 做不了的为什么）：文件窗口与手机嵌的核心同一份。
    "../../common/pick-core",
    "../../common/creds-core",
    "../../common/guard-core",
    "../../common/relay-route-core",
    # 本人通道（Unix 套接字 ＋ 对端 uid）：后端 · monitor 同一份，不发钥匙。
    "../../common/own-chan",
    "../../common/shell-quote-core",
    "../../common/copy-core",
    # `agent-tools-core` 出列：界面不再按工具名判卡型（卡型随记录成品带出），它只剩后端用，收进后端适配层。
    # 上游 base URL 能不能用 —— 后端中转 · 上游选择 · 写口与界面生成物共用的唯一一份。
    "../../common/upstream-url-core",
    # 部署那一族的契约（表 A 的键与行 · 戳格式 · 答话形状 · 路径）；判定那一半（原 `deploy-core`）进了后端 `control/deploy_plan.rs`。
    "../../common/deploy-contract",
    # 通信层面 A（通道的线上词汇 · 客户端 · 路由器 · 拨号 · 交接件的形状 · 分流 · SSH 链路读应答）：monitor 与文件窗口进程链同一份。
    "../../comms/inward",
    # 通信层面 B（中转，搬字节那一层）：后端链它；它自己的单测由这个 workspace 跑。
    "../../comms/outward",
    # 连远端常驻后端的客户端那一侧：monitor 与手机嵌的 Rust 核心同一份（手机那一份经后端那棵 workspace 的 `mobcore` 链它）。
    "../../comms/resident-client",
    # 前端宿主原语（两个前端共用、后端不链）：自有状态文件的原子写 · 窗口夹进工作区。
    "../../common/host-core",
    # 交给 Win32 的路径（长路径前缀）：后端 · monitor · 文件窗口 · creds-core 共用那一份。
    "../../common/win-path-core",
    # Windows 进程清单（两个前端包每一个链接产物都带、只一份）：清单 · 构建脚本里的编法 · 测试程序读回。
    "../../common/win-manifest",
    # monitor 与文件窗口进程之间的契约（开窗种子 · 就绪那一行 · 「在此打开终端」那一问）。
    "../../common/filewin-contract",
    # 测试档的家一开始就是沙箱：每个有判据的 crate 都把它当 dev 依赖（判据 `test_home_guard` 钉）。
    "../../common/test-home",
    # 文件窗口（又一个前端）：独立成包，二进制 `[[bin]] cc-monitor-filewin` 也住那一包。
    "../filewin",
    # `gate-core` 出列：收成后端模块 `control/gate_rules.rs`（monitor 那一侧的门删了）。
]

[package]
name = "monitor"
version = "5.0.2"
description = "cc-monitor — Claude Code 的开发工作台：会话显示与答批准 + 本机/远端会话管理 + 多账号与轮换 + skill 接入面（Tauri 2 + TypeScript，Windows / Linux）"
authors = ["cc-monitor contributors"]
edition = "2021"
license = "MIT"
readme = "../../../README.md"
repository = "https://github.com/local/cc-monitor"
homepage = "https://github.com/local/cc-monitor"
keywords = ["claude", "claude-code", "monitor", "tauri", "viewer"]
categories = ["development-tools", "visualization"]
# 主二进制是 `cc-monitor`（与包名不同）⇒ 用 `default-run` 点名它：`cargo run` 起它，打包器（tauri-cli）也按它认主二进制。
default-run = "cc-monitor"

# 「monitor 源码树」的判据人群：本包 `src/` ＋ 下面这几包 —— monitor 的代码搬进去的、只有前端链的兄弟包
#   （通道 · 前端宿主原语 · 开窗契约 · 分块传那一圈 · 文件窗口）。`guard_core::walk_tree` / `module_address` 按它收 / 认，按人群扫的判据搬家前后逐条同一群；
#   两向对着「monitor 生产闭包 − 后端生产闭包」由 `contract_crate_guard_tests.rs` ⑤ 钉住。
[package.metadata.guard]
population = [
    "../../comms/inward",
    "../../comms/resident-client",
    "../../common/host-core",
    "../../common/filewin-contract",
    "../../common/win-manifest",
    "../../common/chunk-core",
    "../../common/pick-core",
    "../filewin",
]

[lib]
name = "monitor_lib"
crate-type = ["rlib"]

# 主二进制 `cc-monitor`：下载的 `cc-monitor.exe`（Linux 上是 `cc-monitor`）或装上的就是这个项目本身，包含前端和后端，
# 后端会被它释放到不同机器上。🔴 **明写出来**：本包只有这一个 `[[bin]]`（文件窗口程序住它自己的包，见下），写死谁都不用猜。
# 包名仍是 `monitor`（`-p monitor` · 库名 `monitor_lib` 不动），可执行文件的名字只住这一行。
[[bin]]
name = "cc-monitor"
path = "src/main.rs"

# ── 文件窗口程序**不在本包**（size2 10-11）────────────────────────────────────
# `tauri-cli::get_binaries` 把本包**每一个** `[[bin]]` 都交给打包器，nsis/msi/deb 都把非主 bin 装在主程序旁；
# 而开窗只用 monitor 内嵌的那一份（`build.rs::embed_native_filewin`，放到 `~/.cc-monitor/bin/` 再起）
# ⇒ 它从前住这里时安装包里多一份逐字节相同的 10 MB。现在它是文件窗口包自己的 `[[bin]]`（`src/frontend/filewin/Cargo.toml`）。
# 🔴 判据：`tests/evidence/K-R124-ruler.py` 的 ⑭ —— 本包每个 `[[bin]]` ↔ 入包路线登记（两向集合相等，今天只有主二进制）·
#   主二进制恰好一个 · `required-features` 零命中 · `externalBin` 零命中 · 以及那把工具的版本。

# 截图台架的无头壳（`src/shots_shell.rs`）：只在这个特性下编，发版构建（`tauri build` · `cargo build --release`）不开它。
# 台架那一处（`tests/shots/real/pool.mjs`）按 `cargo build --features shots --example ccm-shots-shell` 编；判据 `shots_feature_guard_tests.rs` 钉着。
[features]
shots = []

# 不是 `[[bin]]`：打包器会把每个 bin 都装进安装包（见上）。例子不进包。
[[example]]
name = "ccm-shots-shell"
path = "../../../tests/shots/real/shell_main.rs"
required-features = ["shots"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 内嵌字节自报的身份：界标与扫法用契约 crate 那一份（后端拼戳 · 运行期扫字节同一份）。
deploy-contract = { path = "../../common/deploy-contract" }
# Windows 进程清单编成资源、交给本包**每一个**链接产物（测试程序也要）：清单与编法只住这一处，文件窗口包同一份。
win-manifest = { path = "../../common/win-manifest" }

[dependencies]
# tray-icon feature 实际没用（前端不调系统托盘 API），移除以减小依赖体积。
# 未来若加托盘菜单，重新启用 features = ["tray-icon"] 即可
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 单实例：第二次启动把第一个的主窗拉到前台、自己退出。Windows 用 user 级互斥量，Linux 用会话总线上的名字（zbus）。
tauri-plugin-single-instance = "2"
# 写系统剪贴板（`clipboard.rs`）：回真成败。锁里本就有（egui-winit 带进来的）；Linux 多开 Wayland data-control 那一档。
arboard = { version = "3.6", default-features = false }

serde = { version = "1", features = ["derive"] }
# 传输台开单那两条（`transfer-upload` / `-download`）的线上类型：窗口那一份按它解、补上拨号按后端那一份发（`sftp_pool.rs`）。
cmd-wire = { path = "../../common/cmd-wire" }
# `raw_value`：会话行的成品（后端给的记录）原样转交、monitor 不解析它（`ui_contract::JsonlLinePayload::message`）。
serde_json = { version = "1", features = ["raw_value"] }
# F62：从历史某轮创建分支（写 <new-sid>.jsonl）时生成新 sessionId。
# uuid 1.x 已在 Cargo.lock（tauri 传递依赖）+ 本地 registry 缓存，加 v4 feature 离线可编。
uuid = { version = "1", features = ["v4"] }

# `branch-core` 删了：monitor 零引用（本机分叉也问本机后端），它收进后端适配层 `agents/claudecode/branch.rs`。
# `codex-token-core` 删了：monitor 零引用，它搬进后端 `agents/codex/token.rs`。
# `agent-tools-core` 删了：画像表里那几张判卡型的词表进了后端适配层（`agents/claudecode/cards.rs`），monitor 零引用。
# `acct-core` 挪到 dev 侧（见下）：monitor 生产段零引用，只有生成器（`AUTH_KINDS` → `judgment-rules.ts`）用它。
# 对外文案表的 Rust 取文口（唯一一份实现；`copy_table.rs` 转发它）。常驻后端与 creds-core 也链它。
copy-core = { path = "../../common/copy-core" }
# K-H2a：第三方 API key 的唯一住址（类型 / 落盘格式 / 权限判断），与远端后端共用。
# **不开 `harden`**：monitor 既不写（GP1 起本机那一份的写者是本机常驻后端）也不读（本机那份的状态
#   由本机常驻后端并进账号清单）这份文件，只用 `store::FILE_NAME` 算「本 monitor 认的那一份在哪」（`creds_store::resolve_path`）。
#   「monitor 写不了这份文件」从判据兜换回**编译器兜**：写半边（`perm::create_private`）只在 `harden` 下存在。
creds-core = { path = "../../common/creds-core" }

# P4c：**POSIX 单引号 quote 的唯一 Rust 实现**（P4b 之前叫 `launch-core`，那时它还持有
# 载荷编译器与 ccm 调用行的决策内核 —— 那两样 P4b 已归位 `src/backend/control/`）。
# ⚠ 原注释说「backend 侧刻意还没加这条依赖」已经过期两轮：U8c-2b-0 起后端的
# `control/tmux_hook.rs::sq` 就在调它，那也是它今天唯一的后端用量。
shell-quote-core = { path = "../../common/shell-quote-core" }
# 后端的门牌与家的契约（端口 · 钥匙 · 路由语法 · `~/.cc-monitor/` 下每一样的相对路径），与后端同一份（目标）。
relay-route-core = { path = "../../common/relay-route-core" }
# 本人通道：连本机常驻后端（Unix 套接字 ＋ 对端 uid，不发钥匙）；后端那一侧链同一份。
own-chan = { path = "../../common/own-chan" }
# 部署那一族的契约（契约类）：取字节口的键与行 · 解计划答话 · 读字节里的身份戳；判定都问后端（自举那一刻问手上那份字节自己，`place-verdict`）。
deploy-contract = { path = "../../common/deploy-contract" }
# 通信层面 A（crate 住 `src/comms/inward/`；壳里 `chan/` 再导出，模块路径不变）。
comms-inward = { path = "../../comms/inward" }
# 连远端常驻后端的客户端那一侧（帧客户端 · 握手零件 · 重连退避 · 版本门 · 在看名单）：手机嵌的 Rust 核心同一份（`src/comms/resident-client/`）。
resident-client = { path = "../../comms/resident-client" }
# 前端宿主原语（原子写 `atomic_write_json` · `WorkArea` / `fit_into_work_area`）：monitor 与文件窗口共用那一份（`src/common/host-core`）。
host-core = { path = "../../common/host-core" }
# monitor 与文件窗口进程两边对上的形状（种子 · 就绪行 · 开终端那一问）。
filewin-contract = { path = "../../common/filewin-contract" }
# `gate-core` 删了：monitor 侧的 Gate 1 前检与转调壳（只剩跨轨对拍锚点在用）删掉之后它只剩后端用，收成后端模块 `control/gate_rules.rs`。

# `search-core` 删了：monitor 零引用（搜索与记录解释都在后端；`messages.rs` 那一处随记录解释进了后端，MOD）。
# workspace 成员也出列、crate 删了：通用口径进后端 `observe/search_rules.rs`（今住 `history/search_rules.rs`），Claude 记录文本那一半进 `agents/claudecode/text.rs`。

notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"

# **`russh` / `russh-sftp` / `primefield` 三行出了本清单：界面进程零 SSH**（用户
# 「SFTP 进本机常驻后端」；SR1a 已把其余拨号搬进本机常驻后端）。那三行的来历（ring 后端 · 3.0.0 选型 ·
# primefield rc.9 的解析杠杆）逐字搬进了 `../backend/Cargo.toml` 那两行的注释旁边 —— 那一侧今天是唯一的 SSH 客户端。
# 终点判据：`dial_home_registry` 的二值旗（`russh` 不在界面 manifest 里）翻面、`the_monitor_manifest_names_no_ssh_crate` 零命中。

tokio = { version = "1", features = ["full"] }
# 远端 fan-out 并发（R9）：join_all 同时查所有已配置远端，借用不需 'static/Send。
# 已在 lockfile（russh 传递依赖），此处提升为直接依赖。
futures = "0.3"
parking_lot = "0.12"

dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# v2.0.0 issue #4：滚动 log 文件 + non_blocking writer，给 GUI app（无 stderr）一个用户可见的诊断通道
tracing-appender = "0.2"


[dev-dependencies]
# 测试程序在 Windows 上读回自己的进程清单（`tests/frontend/shell/lib_app_manifest_tests.rs`）。
win-manifest = { path = "../../common/win-manifest" }
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }

# 文件窗口包（`src/frontend/filewin/`）：monitor 生产段一行都不引它（`contract_crate_guard` 的「前端包」那一类钉住），
#   只有跨两半对拍的判据（`tests/frontend/shell/filewin/cross_half_tests.rs`）读它的常量 ⇒ dev 侧。
#   从前它挂在正式依赖上，只为本包第二个 `[[bin]] cc-monitor-filewin`；那个 bin 搬进了文件窗口包自己名下（size2 10-11）。
cc-monitor-filewin = { path = "../filewin" }
# C01（rust-ts-boundary）：**故意只在 dev 侧**。`ts-rs` 是 codegen 工具，
# 导出本来就走 `cargo test`（`#[ts(export)]` 生成的是一个测试），
# 所以它没有理由进发布二进制。派生用 `#[cfg_attr(test, ...)]` 挂在 test cfg 上。
#
# **这是个会被复制 127 次的策略决定**（Phase D 审计 I4 点出），所以现在定比 C04 再定便宜。
# 供应链增量本来就小（`ts-rs` + `ts-rs-macros` + `termcolor`，后两者是 proc-macro/构建期），
# 但「codegen 工具不进产物」是正确的依赖方向。
ts-rs = "12.0.1"
# 上游 base URL 能不能用：monitor 生产树零引用，只有生成器（`export_bindings_judgment_rules`）与金样那条判据用它 ⇒ dev 侧。
upstream-url-core = { path = "../../common/upstream-url-core" }
# 账号种类取值集 `AUTH_KINDS`（J16）：monitor 生产树零引用，只有生成器（`export_bindings_judgment_rules`）用它 ⇒ dev 侧，
#   发布二进制里不再链它（连同它那张对拍夹具 —— 夹具另在 `fixtures` feature 后面，这里也不开）。
acct-core = { path = "../../common/acct-core" }
# U8a-2a：源码扫描型守卫的「只留生产段」剥法，与远端后端共用同一份。
# **必须是 dev-dependency** —— 守卫全在 `cfg(test)` 里，它没有理由进发布二进制。
# 起因：monitor 侧的守卫此前各写便宜近似（`split("\n#[cfg(test)]").next()`），
# 那个近似在 `stream_source/` 上会把扫描面砍掉三分之二（详见 guard-core 头注）。
guard-core = { path = "../../common/guard-core" }
# `Origin` 编进 `comms-inward` 之后，本包测试档里别的生成类型（会话流那几帧）嵌着它 ⇒ dev 侧开它的 TS 派生（发布二进制不开）。
comms-inward = { path = "../../comms/inward", features = ["ts"] }
# 会话流那一帧（`ui_contract::SessionLivePayload`）嵌着 `cmd_wire::session::Hidden` ⇒ dev 侧开它的 TS 派生（发布二进制不开）。
cmd-wire = { path = "../../common/cmd-wire", features = ["ts"] }
# 判据要的那几样（停一个本来就分开的写端 · 关写半边 · 数登记）：只在测试档开。
resident-client = { path = "../../comms/resident-client", features = ["test-support"] }
# 暂停时钟（`#[tokio::test(start_paused = true)]`）：拿「截止时刻」说事的测试用虚拟时钟，机器负载多高读数都一样。
# 只在 dev 侧开 —— resolver 2 下 dev 依赖的特性不并进产品构建，发布二进制里的 tokio 照旧是上面那份 `full`。
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 单实例（`platform/single_instance.rs`）：占会话总线上的名字、转交激活令牌。
zbus = "5"
# 第二次启动把主窗口拉前那一下要带激活令牌（`set_startup_id` ＋ `present`）：tauri 在 Linux 上本来就链着它，这里直接用。
gtk = "0.18"
# ↗ 在 X11 上找 / 拉前终端窗口（EWMH，`platform/ewmh.rs`）：文件窗口那边（arboard · winit）早已链着它，这里直接用。
x11rb = "0.13"
# 剪贴板（`clipboard.rs`）：Wayland 合成器支持 data-control 那一档时经它写，回真成败；不支持就回落 X11 / XWayland。
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
# v1.7.0：cc 注入式绑定恢复 ToolHelp（从 claude.exe 往上的进程链反查 PS） +
# UI_WindowsAndMessaging（EnumWindows 找 title marker、SetForegroundWindow 拉前）。
# ProcessStatus 仍不需要（v1.6 拉前算法时也没真用）。
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # ccbus-win 09-10 第七拍：`cc_bus::reap_whole_tree_on_drop` 要 Job Object
    # （`CreateJobObjectW` / `SetInformationJobObject` / `AssignProcessToJobObject`）。
    # 起因是一条有云端读数的真缺陷：Windows 上 `Git\bin\bash.exe` 是外壳，起完真 bash
    # 自己就退，`kill_on_drop` 的 `TerminateProcess` 打在一个已经死了的 pid 上 ⇒
    # 每次本机读超时（以及「读够了就掐断」那条常规路径）都漏下一个真 shell 进程。
    # ⚠ **不新增 crate**，只是把这个已在依赖里的 crate 的一个模块打开 ——
    #   本机现打确认（`cargo check -p monitor --target x86_64-pc-windows-gnu`）：
    #   不加这一行时 `windows::Win32::System::JobObjects` 是 `E0432 unresolved import`，
    #   编译器自己指出「the item is gated behind the `Win32_System_JobObjects` feature」。
    "Win32_System_JobObjects",
    # `CreateJobObjectW` 的签名收 `Option<*const SECURITY_ATTRIBUTES>` ⇒ 要 `Win32_Security`。
    #   先前它是从 `creds-core` 的 `harden` 那边 feature 合并**顺带**开的（下面那段 `KS5` 注释说的「事实上是开的」）；
    #   monitor 不开 `harden` 之后那条顺带没了，`cargo check -p monitor --target x86_64-pc-windows-gnu` 现打
    #   `E0432 unresolved import …CreateJobObjectW` ⇒ 在真用它的这一侧显式声明。
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    # v2.4.2 issue #2: keybd_event 模拟 Alt 按键让 OS 视当前进程为
    # "刚有用户输入"，配合 AttachThreadInput 突破 Win10/11 前台抢焦限制。
    "Win32_UI_Input_KeyboardAndMouse",
    # ↗ 切到 Windows Terminal 里的那个标签页（`platform/wt_tabs.rs`）：UI Automation 读标签页名字、选中一个。
    #   不新增 crate，只开这个已在依赖里的 crate 的两个模块。
    "Win32_UI_Accessibility",
    "Win32_System_Com",
] }
# K-H2a `KS5`：`Win32_Security_Authorization` **不加在这里** —— 设 / 读凭据文件 DACL 的 Win32 调用住 `crates/creds-core`
# （「一个安全性质只许有一个实现」）。monitor 今天既不读也不写那份文件、不开 `harden`；`Win32_Security` 上面那一条是
# Job Object 的签名要的，与凭据文件无关。
# F12 nudge 加固：resize 稳定后直接调 WebView2 controller COM 接口
# （SetBounds / NotifyParentWindowPositionChanged / SetIsVisible）修合成层错位。
# RECT/BOOL 参数类型必须来自 wry 依赖树里 webview2-com 0.38 配对的 windows 0.61
# ——与上面项目自用的 windows 0.56 **类型不互通**，故 package rename 引入；
# 版本收敛到 lock 里已有的 0.61.3，不新增依赖树条目。
windows-wv2 = { package = "windows", version = "0.61", features = ["Win32_Foundation"] }

# 测试档（dev 与继承它的 test）里给 egui 那一族开优化：文件窗口的 hover 扫读与滚动区那几条测试跑在它上面，
#   依赖不开优化时文件窗口测试二进制的墙钟就是它们（10-15 量过：40–42 s → 28–31 s；冷编多不到一成）。只给这几样，
#   工作区自己的 crate 照旧不开。判据：后端 `build_features_tests.rs` 的
#   `the_test_build_optimizes_the_dependencies_the_slowest_tests_run_on`（与表两向相等、每项都在 Cargo.lock 里）。
[profile.dev.package.egui]
opt-level = 3

[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.emath]
opt-level = 3

[profile.dev.package.ecolor]
opt-level = 3

[profile.dev.package.ab_glyph]
opt-level = 3

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3

[profile.dev.package.egui_extras]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
