[package]
name = "host-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "前端宿主原语：两个前端（monitor 主界面 · 文件窗口进程）共用、后端不链的那几件 —— 自有状态文件的原子写 · 窗口夹进工作区。"

# 「前端宿主原语」这一类只许 monitor 与文件窗口（`src/frontend/filewin`）链，后端不许
#   （`tests/frontend/shell/contract_crate_guard_tests.rs` 钉）。它不是契约：是两个前端都要、只该有一份的宿主那几件。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 读上限只收它的 `Cap`（字节数与超了怎么办写在一处）；仓内 crate、零依赖。
cap-core = { path = "../cap-core" }
# 原子写与只给本人的目录只经它（后端同一份）；仓内 crate。
platform-core = { path = "../platform-core" }
# 工作区那个形状（`WorkArea`）住开窗契约：它随种子过线，两个前端对上同一份；本包的几何判定收它。
filewin-contract = { path = "../filewin-contract" }

[target.'cfg(windows)'.dependencies]
# 与 `src/frontend/shell/Cargo.toml` 那条 `windows` 同版本（0.56）：
# 一点所在那块屏的工作区（`MonitorFromPoint` · `GetMonitorInfoW`）住 `Win32_Graphics_Gdi`。
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
