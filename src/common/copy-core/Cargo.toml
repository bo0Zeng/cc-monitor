[package]
name = "copy-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "对外文案表（src/shared/copy/table.json）的 Rust 取文口 —— 唯一一份实现。monitor、常驻后端、creds-core 三方链接它。"

# **无平台依赖**：
# 后端是静态 musl 二进制、刻意不在 monitor 的 workspace 里，共享 crate 一引平台相关的东西，共享就破了。
# `serde_json` 在两份 lock 里本来就各有 1 条 ⇒ 加本 crate 不引新的第三方包。
[dependencies]
serde_json = "1"
# 失败投成应答时补的兜底码是线上那一格的值，住两端的契约（`cmd_wire::failed::FALLBACK_CODE`）；cmd-wire 不反过来依赖本 crate。
cmd-wire = { path = "../cmd-wire" }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
