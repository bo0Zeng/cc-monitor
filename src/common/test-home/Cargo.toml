[package]
name = "test-home"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "测试档的家一开始就是沙箱：每个有判据的 Rust crate 都把它当 dev 依赖引进来（只做这一件事、只有这一份实现）。测试二进制起来时 HOME 若是本账号真家，就换成这个进程自己的临时目录。"

[dependencies]
