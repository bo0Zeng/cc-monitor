[package]
name = "platform-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "后端与壳都要、只该有一份的平台原语：目录的跨进程锁 · 只给本人的目录 · 自家状态文件的原子写 · /proc/<pid>/stat 一行怎么切 · Windows 进程表 · CREATE_NO_WINDOW。只回 io::Error 与结构化结局，那一句由各家照自己的文案取。"

[dependencies]
# 互斥量名里路径的摘要（`fnv1a64`）：全仓那一份。仓内 crate，两份 lock 里本来就有。
cmd-wire = { path = "../cmd-wire" }
# 丢一个结果只经它的 `Discard`（理由 `Why` 住在调用处）；仓内 crate，两份 lock 里本来就有。
copy-core = { path = "../copy-core" }

[target.'cfg(unix)'.dependencies]
# 目录锁 `flock(LOCK_EX)`。两份 lock 里本来就有。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 交给 `ReplaceFileW` 的路径（长路径前缀）只从它来；仓内 crate、零依赖。
win-path-core = { path = "../win-path-core" }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
# 「这几样只在本包有定义」那张扫描判据：剥注释与测试段只经它。
guard-core = { path = "../guard-core" }

[lints.clippy]
# 丢一个 `Result` 写 `.discard(Why::…)`：理由住调用处，类型挡住拼错。
let_underscore_must_use = "deny"
unused_result_ok = "deny"
