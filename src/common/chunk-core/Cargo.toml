[package]
name = "chunk-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "分块传的循环（上传：逐块进那台的暂存区 ＋ 整份摘要；下载：逐块读回）：桌面文件窗口与手机嵌的核心同一份。"

[dependencies]
cmd-wire = { path = "../cmd-wire" }
# 两棵 workspace 里同一份源码要拿到同一版依赖（两份 lock 的真冲突判据）：钉壳那棵那一版；后端那棵另有 0.11 给 SSH 那一树。
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
test-home = { path = "../test-home" }
