[package]
name = "deploy-contract"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "部署那一族的契约（两侧对上的形状）：表 A 的键与行 · 拒绝的形状与话 · 身份戳格式 · 计划答话的形状 · 落点路径。判定（承诺 · 换不换 · 认不认）住后端 control/deploy_plan.rs。无 IO、无平台依赖。"

# **只依赖同族共享 crate**（同 branch-core / relay-route-core 的约束）：backend 是 Linux-only 的静态 musl 二进制、
# 且刻意不在 monitor 的 workspace 里；一旦引入平台相关的东西，共享就破了。
# 从 `deploy-core` 拆出来的契约那一半：monitor 取字节 · 解计划 · 读字节里的戳要同一份形状；判定那一半进了后端。
[dependencies]
copy-core = { path = "../copy-core" }
shell-quote-core = { path = "../shell-quote-core" }
