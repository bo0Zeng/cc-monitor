[package]
name = "own-chan"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "本人通道：两头都是我们、又不是父子的那几条连接，只走只有本账号连得上的系统通道（Unix 套接字 ＋ 对端 uid；Windows 命名管道），不发钥匙。后端 · monitor · 文件窗口同一份。"

[dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
# 在听的那一个抢门用的目录锁只住 `platform_core::dir`（与自家状态那一把同一把）；仓内 crate，两份 lock 里本来就有。
platform-core = { path = "../platform-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 那一臂：管道全忙时稍等再连（异步那一形）。只加 feature，不加依赖条目 ⇒ 两份锁不动。
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "time"] }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread"] }
