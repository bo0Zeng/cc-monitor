[package]
name = "md-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "助手正文的 Markdown 解析 ＋ 代码高亮 ＋ 长正文分段：纯函数、不碰盘，出 cmd-wire 的 `Doc`。两端只照树排版。"

# 判定类（正文怎么解析、高亮成哪一类是裁决）：只后端链。同 cmd-wire 的约束：后端是静态 musl ⇒ 这里不许长出平台相关的东西。
[dependencies]
# 块树的线上形（`cmd_wire::md`）：形状只住那一份，这里只出值。
cmd-wire = { path = "../cmd-wire" }
# 解析：GFM 表格 · 删除线 · 自动链接 · 任务列表 · 脚注 · 提示块 · `$` 与 `\(` `\[` 公式 · 中文旁的强调都现成（BSD-2-Clause）。
#   不开缺省特性：命令行那一套与 onig 正则（C 库）都不要。
comrak = { version = "=0.59.0", default-features = false }
# 高亮：与文件窗口那份同一个 syntect、同一个纯 Rust 正则后端（fancy-regex；后端是静态 musl，不引 onig）。
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
# bat 那一套语法表（补上 TypeScript · TOML · Kotlin 等；MIT OR Apache-2.0）。
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
# 公式排版：KaTeX 语法的纯 Rust 排版器（MIT），出一串定位好的字形 · 线 · 矩形 · 路径，两端照着画。
#   只用解析与排版两层（字体文件不经 crate 进来，两端各带 `src/shared/fonts/katex/`）。0.1.15 的解析层不分特性：
#   化学式 `\ce` 那一套连同 regex · regex-lite · fancy-regex · unicode-normalization 照带（都 MIT / Apache-2.0）。
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
serde_json = "1"

# 量具：`cargo bench --bench md_core_parse` 出读数；`cargo test` 只跑一遍小样证明量具能跑。
[[bench]]
name = "md_core_parse"
path = "../../../tests/benches/md_core_parse.rs"
harness = false
test = true
