[package]
name = "md-core"
version = "0.1.0"
edition = "2021"
description = "助手正文的 Markdown 解析 ＋ 代码高亮 ＋ 长正文分段：纯函数、不碰盘，出 cmd-wire 的 `Doc`。两端只照树排版。"

# 暂时自成一棵 workspace，经 `cargo test --manifest-path src/common/md-core/Cargo.toml` 编；生出来的锁文件不进仓。
[workspace]

[dependencies]
# 解析：GFM 表格 · 删除线 · 自动链接 · 任务列表 · 脚注 · 提示块 · `$` 与 `\(` `\[` 公式 · 中文旁的强调都现成（BSD-2-Clause）。
#   不开缺省特性：命令行那一套与 onig 正则（C 库）都不要。
comrak = { version = "=0.59.0", default-features = false }
# 高亮：与文件窗口那份同一个 syntect、同一个纯 Rust 正则后端（fancy-regex；后端是静态 musl，不引 onig）。
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
# bat 那一套语法表（补上 TypeScript · TOML · Kotlin 等；MIT OR Apache-2.0）。
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
serde = { version = "1", features = ["derive"] }
# 线上类型的 TS 派生：只在测试档或别的 crate 开 `ts` 时进来，不进产物。
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
serde_json = "1"
ts-rs = "12.0.1"

[features]
default = []
ts = ["dep:ts-rs"]

# 量具：`cargo bench --bench md_core_parse` 出读数；`cargo test` 只跑一遍小样证明量具能跑。
[[bench]]
name = "md_core_parse"
path = "../../../tests/benches/md_core_parse.rs"
harness = false
test = true
