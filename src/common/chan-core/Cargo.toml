[package]
name = "chan-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "通道（通信层面 A，前端 ↔ 后端）的线上词汇 · 帧 · 客户端 · 路由器 · 拨号与交接件：monitor（宿主那一侧）与文件窗口进程（外部前端）链接同一份。"

# 〔「先把通道客户端 … 抽成共享 crate」〕成员文件（`origin` · `wire` · `client` · `router`）原地住
#   `src/comms/inward/`（成员资格由登记表认，目录只是住址）；本 crate 用 `#[path]` 编它们，另带两份非成员（`dial` · `handoff`：拨号与绑口）。
[dependencies]
copy-core = { path = "../copy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# `Origin` 的 TS 派生：只在测试档（本 crate 自己 · 或 monitor 的 dev 侧开 `ts`）进来，codegen 工具不进产物。
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
# `Origin` 的线上形状生成物（`src/frontend/ui/generated/Origin.ts`）由本 crate 的测试档导出。
ts-rs = "12.0.1"

[features]
default = []
# monitor 的测试档里别的 `ts_rs::TS` 类型嵌着 `Origin` ⇒ 它在 `[dev-dependencies]` 开这一格（发布二进制不开）。
ts = ["dep:ts-rs"]
