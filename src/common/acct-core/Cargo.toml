[package]
name = "acct-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "账号库契约的唯一定义（清单常量 · 账号库命令的线上形状）+ 平台无关的名字安全判据——monitor 与后端共用。"

# 只依赖 `serde`（账号库命令的线上形状由这里定义、两侧同一份）。同 branch-core / usage-core 的约束：
# backend 是静态 musl 二进制、且刻意不在 monitor 的 workspace 里；一旦引入平台相关的东西，共享就破了。
[dependencies]
serde = { version = "1", features = ["derive"] }

# 线上形状导出到界面（`src/frontend/ui/generated/`）只在本 crate 的测试档里跑：codegen 工具不进产物。
[dev-dependencies]
ts-rs = "12.0.1"
serde_json = "1"

# 〔THIN〕跨生产者对拍夹具（`AUTH_KIND_PARITY_CASES` · `auth_kind_parity_manifest`）只在测试构建里：本 crate 自己的测试照带（`cfg(test)`），
#   别的 crate 的测试要它就在 `[dev-dependencies]` 里开这个 feature（后端 `accounts_query_tests.rs` 用）。契约 crate 不带夹具进发布二进制。
[features]
fixtures = []
