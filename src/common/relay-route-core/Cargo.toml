[package]
name = "relay-route-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "中转门牌的唯一住址：端口 · 钥匙文件相对路径 · 路由路径的语法（两个前缀 · 段闸 · 拼 · 拆）。monitor 与后端共用（设计/20 §5 目标）。"

# **零依赖**。同 acct-core / shell-quote-core 的约束：backend 是 Linux-only 的静态 musl 二进制、
# 且刻意不在 monitor 的 workspace 里；一旦引入平台相关的东西，共享就破了。
# ⚠ 它**不是业务 crate**（不在 `comm_boundary_registry_tests::BUSINESS_CRATES` 里）：里面没有账号 / 凭据 / 上游，
# 只有「这台机器的中转门在哪、路由路径长什么样」—— 通信层成员 `relay/route.rs` 因此可以 use 它（`C2`）。
