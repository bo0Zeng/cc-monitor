[package]
name = "cap-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "有上限读的唯一一份：读上限（字节数 · 超了怎么办）与同步整读（读到流尽 · 读一个窗口 · 读一份本机文件）。后端 · 壳 · 文件窗口 · comms · 手机核心同一份。"

# **零依赖**：relay-route-core（声明表每行带 `Cap`）与 copy-core（`RAW_CAP`）都依赖它，它不能反过来依赖谁；
# backend 是 Linux-only 的静态 musl 二进制、且刻意不在 monitor 的 workspace 里，引入平台相关的东西共享就破了。
[dependencies]

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
