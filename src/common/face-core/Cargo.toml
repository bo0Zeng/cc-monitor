[package]
name = "face-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "契约类型的写字一侧：cmd-wire 只放线上类型，照这些类型写成给人看的成品字、折成两端照画的整份（会话簿 · 活卡板 · 清单副本 · 几台并一列）的住这里。壳 · 后端 · 手机核心链同一份。"

# 同 cmd-wire 的约束：后端是静态 musl 二进制、刻意不在 monitor 的 workspace 里 ⇒ 这里不许长出平台相关的东西。
[dependencies]
cmd-wire = { path = "../cmd-wire" }
copy-core = { path = "../copy-core" }
serde = { version = "1", features = ["derive"] }
# 认不出那一条的判法吃一团 JSON 值（`record::OrUnread::of` · `record::mend_records`）；清单副本落盘那一形是 JSON。
serde_json = "1"

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
# 会话簿 · 活卡 · 手机会话屏那一列的整份导给界面与手机（`src/frontend/ui/generated/` ⇒ Kotlin 照它生成）：codegen 只在测试档。
ts-rs = "12.0.1"
# 整份里嵌着会话帧与活卡那几样 ⇒ 测试档开它们的 TS 派生（发布二进制不开）。
cmd-wire = { path = "../cmd-wire", features = ["ts"] }
