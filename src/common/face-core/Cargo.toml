[package]
name = "face-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "契约类型的写字一侧：cmd-wire 只放线上类型，照这些类型写成给人看的成品字的住这里。壳 · 后端 · 手机核心链同一份。"

# 同 cmd-wire 的约束：后端是静态 musl 二进制、刻意不在 monitor 的 workspace 里 ⇒ 这里不许长出平台相关的东西。
[dependencies]
cmd-wire = { path = "../cmd-wire" }
copy-core = { path = "../copy-core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
