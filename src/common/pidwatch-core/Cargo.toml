[package]
name = "pidwatch-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "等一个进程退出：进程一退内核就叫醒（Linux pidfd ＋ 不带期限的 poll · Windows 进程句柄 ＋ 一直等），零轮询。后端（会话的 claude 退了）与 monitor（登记着窗口的 shell 退了）同一份；「开到的还是不是那个进程」由调用方判。"

[dependencies]
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# 只用 SYS_pidfd_open / poll / pollfd 三样，不引入任何 feature。
libc = "0.2"

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
# 「poll 真错误不判死」与两个平台逐形对拍，只能把源码当数据读。
guard-core = { path = "../guard-core" }

[lints.clippy]
# 零定时器：会自己醒来的等待用一处在那一处放行（禁的路径与理由住 `clippy.toml`）。
disallowed_methods = "deny"
