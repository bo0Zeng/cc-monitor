[package]
name = "cmd-wire"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "帧命令两端必须对上的那几样：机器名（`Machine`）· 每条 typed 命令的形状指纹表（后端 hello 带出去、客户端拿来比）。后端 · monitor · 以后的 mobcore 链同一份。"

# 同 acct-core 的约束：后端是静态 musl 二进制、刻意不在 monitor 的 workspace 里 ⇒ 这里不许长出平台相关的东西。
[dependencies]
copy-core = { path = "../copy-core" }
serde = { version = "1", features = ["derive"] }
# 客户端那一侧按类型解回包（`session::decode_reply`：进来的是一份 JSON 值）。
serde_json = "1"
# `Machine` 的 TS 派生：只在测试档（本 crate 自己 · 或别的 crate 的 dev 侧开 `ts`）进来，codegen 工具不进产物。
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../test-home" }
ts-rs = "12.0.1"

[features]
default = []
# 别的 crate 的测试档里有 `ts_rs::TS` 类型嵌着 `Machine` ⇒ 它们在 `[dev-dependencies]` 开这一格（发布二进制不开）。
ts = ["dep:ts-rs"]
