[package]
name = "plain-path-core"
version = "0.1.0"
edition = "2021"
workspace = "../../frontend/shell"
description = "一段相对路径拆成普通段的唯一一道词法判定：本机写面 · 远端写围栏（拨号核心）· 解压条目都调它。零依赖、无 IO。"

