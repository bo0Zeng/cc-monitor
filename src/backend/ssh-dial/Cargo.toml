[package]
name = "ssh-dial"
version = "0.1.0"
edition = "2021"
workspace = ".."
description = "拨号核心：竞速 · 跳板（多跳）· host key 判定 · 鉴权（钥匙 · agent · 外部签名器 · 密码）· 保活 · 按身份复用 · 开 channel 之后的几种用法（含 PTY）· SFTP 客户端。后端与手机同一份。"

# 住后端那棵 workspace（`../Cargo.toml` 的 `[workspace] members`）：同一份 lock、同一个 russh（crates.io 上游那一份）。
# 也在后端的源码人群里（那边 `[package.metadata.guard] population`）⇒ 只读 · 零定时器 · 日志白名单这几族扫描型判据照旧管到这里。
# 平台的事从三个口进（`env.rs`：钥匙从哪来 · 认下的 host key 记到哪 · ssh-agent）；本 crate 不碰家目录、不读环境变量。
[lib]
path = "lib.rs"

[dependencies]
copy-core = { path = "../../common/copy-core" }
# 没拨成的原因码（`Why`）：接这台的宿主按它定那一态与修法，类型两头同一份。
cmd-wire = { path = "../../common/cmd-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "net", "sync", "time"] }
tracing = "0.1"
# 出网口：拨 SSH 那一跳的 TCP 经它开（直连或经代理）；这台的描述由宿主装（`egress::install`），手机没装 ⇒ 直连。
egress = { path = "../egress" }
libc = "0.2"
# 版本与 feature 集同后端那一行（两边握出来的必须是同一套算法集）；签字与来历在 `../Cargo.toml` 那一段。
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
# 后端的测试档经 dev 依赖打开 `test-support`（resolver 2 ⇒ dev 依赖的 feature 不并进发布构建）：
# 测试档不许出网（那一句断言住出网口真开 TCP 的那一处，随 `egress/test-support` 开）· 拨了必被拒的本机口 · 合成 SFTP 服务端（`sftp::rig`）。
# 机器那一形（`machine::Host`）的 TS 派生：后端的测试档有生成类型嵌着它（`MachinesReply` 等）⇒ 经 `ts` 拿到同一个派生；发布构建不开。
ts-rs = { version = "12.0.1", optional = true }

[features]
# 后端的测试档经 dev 依赖开它，`ts` 随它一起开（那边要导出嵌着 `Host` 的生成类型）。
test-support = ["ts", "egress/test-support"]
ts = ["dep:ts-rs"]

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
guard-core = { path = "../../common/guard-core" }
upstream-url-core = { path = "../../common/upstream-url-core" }
# 测试档不许出网：出网口真开 TCP 那一处的断言在本 crate 自己的判据里也开着。
egress = { path = "../egress", features = ["test-support"] }
# 保活那几条判据走虚拟钟（`start_paused`）：200 ms 一轮的保活，墙钟上忙机里回话一晚就误判死。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "fs", "test-util"] }
sha2 = "0.11"
# 判据里的外部签名器（Keystore 那一形）现生成一把 P-256、回 DER；版本同后端 lock 里那一棵（0.17.14），不新增包。
ring = "0.17"
# 判据现生成一把 ECDSA 的 host key（版本同 russh 那一棵用的 0.10，不新增包）。
rand = { version = "0.10", features = ["thread_rng"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ts-rs = "12.0.1"

[lints.clippy]
# 禁的路径与理由住上一级的 `clippy.toml`（后端零定时器那一组）。
disallowed_methods = "deny"
# 丢一个 `Result` 写 `.discard(Why::…)`：理由住调用处，类型挡住拼错。
let_underscore_must_use = "deny"
unused_result_ok = "deny"
