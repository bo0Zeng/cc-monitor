[package]
name = "egress"
version = "0.1.0"
edition = "2021"
workspace = ".."
description = "出网口：这台所有出站 TCP 只在这里开 —— 按一份出网描述直连，或经代理（HTTP CONNECT · SOCKS5，代理鉴权 · 免代理表）。中转与拨号核心链同一份（手机经拨号核心同一份）。"

# 与 ssh-dial · deploy 并列，住后端那棵 workspace（`../Cargo.toml` 的 `[workspace] members`）。
# 在后端源码树里（`src/backend/`）⇒ 只读 · 零定时器 · 日志白名单这几族扫描型判据照旧管到这里。
# 本 crate 不读环境变量、不碰家目录：描述由宿主照它自己的环境造好、装进来（`install`）。
[lib]
path = "lib.rs"

[dependencies]
# 测试档不许出网：真开 TCP 的那个目的地不是回环 ⇒ panic（回环判定只有 `upstream_is_loopback` 那一个家）。只在测试档进来。
upstream-url-core = { path = "../../common/upstream-url-core", optional = true }

[features]
# 后端 · 拨号核心的测试档经 dev 依赖开它（resolver 2 ⇒ 不并进发布构建）。
test-support = ["dep:upstream-url-core"]

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
upstream-url-core = { path = "../../common/upstream-url-core" }

[lints.clippy]
# 禁的路径与理由住上一级的 `clippy.toml`（零定时器 · 出站 TCP 只在这里开那两组；开 TCP 的那一处就地放行）。
disallowed_methods = "deny"
