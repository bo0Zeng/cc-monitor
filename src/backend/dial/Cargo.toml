# SSH 拨号的后端那一侧：钥匙 · known_hosts · 端口转发的账 · 测试连接 · 问远端后端 · 开终端。只引帧面零件 · 纯工具 · 平台三层。
[package]
name = "backend-dial"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 只给上层测试用的那几样：上层的 `[dev-dependencies]` 开它。
test-support = ["ts", "ssh-dial/test-support"]
# 线上类型的 TS 派生（上层测试档开它，生成物落 `src/frontend/ui/generated/`）。
ts = ["dep:ts-rs", "ssh-dial/ts", "cmd-wire/ts", "backend-common/ts"]

[dependencies]
backend-wire = { path = "../wire" }
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }
# 拨号核心（多地址竞速 · 跳板 · host key · 鉴权 · 池 · SFTP；手机同一份）：本包是后端那一侧的宿主。
ssh-dial = { path = "../ssh-dial" }
# 帧的线上形（客户端按同一份解）。
cmd-wire = { path = "../../common/cmd-wire" }
copy-core = { path = "../../common/copy-core" }
relay-route-core = { path = "../../common/relay-route-core" }
# 开终端那一行的引号（POSIX · PowerShell）。
shell-quote-core = { path = "../../common/shell-quote-core" }
# 问远端后端那一跳：握手行的读法与客户端同一份。
resident-client = { path = "../../comms/resident-client" }
# 端口转发那一侧读一行带上限。
comms-inward = { path = "../../comms/inward" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 源码扫描型守卫的「只留生产段」剥法 · 仓根住址（只在测试档）。
guard-core = { path = "../../common/guard-core" }
ts-rs.workspace = true
ssh-dial = { path = "../ssh-dial", features = ["test-support"] }
cmd-wire = { path = "../../common/cmd-wire", features = ["ts"] }
russh.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# 判据造写句柄（`Own::issue_at` · `issue_data_at`）用平台那一层的 `test-support`。
backend-platform = { path = "../platform", features = ["test-support"] }
