# agent 适配层：每个 agent 一份，装它专属的知识（codex · claudecode）。只引纯工具与平台两层。
[package]
name = "backend-agents"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 只给上层测试用的那几样（假 agent 夹具 · 主线的夹具）：上层的 `[dev-dependencies]` 开它。
test-support = []
# 记录与漂移那几样线上类型的 TS 派生（上层测试档开它，生成物落 `src/frontend/ui/generated/`）。
ts = ["dep:ts-rs", "cmd-wire/ts"]

[dependencies]
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }
acct-core = { path = "../../common/acct-core" }
cmd-wire = { path = "../../common/cmd-wire" }
# 认不出那一行的句子（`face_core::record::unread_body`）：手机核心解不开的那一条同一份。
face-core = { path = "../../common/face-core" }
copy-core = { path = "../../common/copy-core" }
md-core = { path = "../../common/md-core" }
relay-route-core = { path = "../../common/relay-route-core" }
# 有上限读（读上限 `Cap` · 同步整读）的唯一一份；零依赖。
cap-core = { path = "../../common/cap-core" }
shell-quote-core = { path = "../../common/shell-quote-core" }
comms-outward = { path = "../../comms/outward" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
walkdir.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 源码扫描型守卫的「只留生产段」剥法（只在测试档）。
guard-core = { path = "../../common/guard-core" }
# 量具（分配探针 · 金样）：不引任何 crate 内部。
test-meters = { path = "../test-meters" }
ts-rs.workspace = true
cmd-wire = { path = "../../common/cmd-wire", features = ["ts"] }
# 上游流的夹具（拆帧判据造字节流用）。
comms-outward = { path = "../../comms/outward", features = ["test-support"] }
