# 中转的宿主：绑口 · 钥匙 · 起中转（中转本身是通信层的 `comms-outward`）。只引纯工具与平台两层。
[package]
name = "backend-relay"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 只给上层测试用的那几样（账号域那一侧的中转判据够到的内部件）：上层的 `[dev-dependencies]` 开它。
test-support = []

[dependencies]
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }
# 中转本身（搬字节那一层）· 出网口（直连或经代理开上游 TCP）。
comms-outward = { path = "../../comms/outward" }
egress = { path = "../egress" }
copy-core = { path = "../../common/copy-core" }
# 钥匙文件的住址与形状（中转与 `ccm` 共用的那一份）。
relay-route-core = { path = "../../common/relay-route-core" }
# 钥匙文件的权限判读（只给本人）。
creds-core = { path = "../../common/creds-core", features = ["harden"] }
# 只许直通那一把的派生（HMAC）· 铸钥匙取随机数的那一个提供者。
ring.workspace = true
rustls.workspace = true

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 源码扫描型守卫的「只留生产段」剥法（只在测试档）。
guard-core = { path = "../../common/guard-core" }
# 夹具家目录的写句柄（`Own::issue_at` · `issue_data_at`）。
backend-platform = { path = "../platform", features = ["test-support"] }
