# 中转的宿主：绑口 · 钥匙 · 起中转（中转本身是通信层的 `comms-outward`）。只引纯工具与平台两层。
[package]
name = "backend-relay"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 只给上层测试用的那几样（账号域那一侧的中转判据够到的内部件）：上层的 `[dev-dependencies]` 开它。
test-support = []

[dependencies]
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
