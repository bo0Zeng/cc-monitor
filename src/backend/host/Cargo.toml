# 宿主口（终端住在哪种宿主里：tmux · 托管）。只引帧面零件（含 ccm 这一行的词）· 纯工具 · 平台三层。
[package]
name = "backend-host"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 只给上层测试用的那几样（托管终端的沙箱夹具）：上层的 `[dev-dependencies]` 开它。
# 托管终端的夹具把数据目录建在测试进程的沙箱根底下 ⇒ 随它带上 `test-home`。
test-support = ["dep:test-home"]

[dependencies]
backend-wire = { path = "../wire" }
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }
# 终端名单那一行的线上形（宿主 · 输入归谁）。
cmd-wire = { path = "../../common/cmd-wire" }
copy-core = { path = "../../common/copy-core" }
# 托管终端与瘦客户端之间那条本机通道（Unix 套接字 · Windows 命名管道）。
own-chan = { path = "../../common/own-chan" }
relay-route-core = { path = "../../common/relay-route-core" }
# 有上限读（读上限 `Cap` · 同步整读）的唯一一份；零依赖。
cap-core = { path = "../../common/cap-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# 托管终端自己持的那一屏（重放 · 抓屏 · 回滚）。
vt100.workspace = true
test-home = { path = "../../common/test-home", optional = true }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 源码扫描型守卫的「只留生产段」剥法 · 仓根住址（只在测试档）。
guard-core = { path = "../../common/guard-core" }
# 宿主名单那条判据起私有 tmux server（平台层的 `test-support`）。
backend-platform = { path = "../platform", features = ["test-support"] }
