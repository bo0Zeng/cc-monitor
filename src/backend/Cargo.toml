[package]
name = "cc-monitor-backend"
# 🔴 K-R70（09-12）：本 crate 刻意不用 Cargo.toml 的版本 —— 真身份住 lib.rs 的 BUILD_ID
#
# 这一行**不是忘了填**，也**不许**顺手换成一个「像样」的数字。
#
# · 它不参加 `release.yml` 那道「四处版本号与 tag 一致」的检查（那四处是
#   `package.json` / `src/bridge/tauri.conf.json` / `src/bridge/Cargo.toml` /
#   `src/bridge/Cargo.lock` 的 `monitor` 包）—— 后端**不随 app 的 tag 走**：
#   `K25`/`K36` 裁的是「一份代码、每平台一份原生二进制」，而它换不换由**行为变没变**决定
#   （`BUILD_ID` 的 bump 纪律），不由发版节奏决定。给它一个跟 tag 走的版本号 = 给后端
#   造**第二个身份**，那正是 `K33`「后端只有一个」在身份这一维要避开的事。
# · 那条「不参加」不是靠这段散文守着：`build_id_guard` 的
#   `the_crate_version_is_deliberately_zero_and_the_real_identity_has_a_home`
#   **在数它** —— 这一行一动、或真身份那一处住址坏掉，当场红。
# · 真身份的住址（判据逐条核）：`lib.rs` 的 `pub const BUILD_ID`（〔步 9 · 09-19〕从 `main.rs` 搬进库面）
#   ＋ 由它编译期拼出来、扫得进二进制字节的 `CC_MONITOR_BUILD_STAMP`
#   ＋ `--ccm-probe` 吐的 `build=` 那一行。
version = "0.0.0"
edition = "2021"

# Standalone crate, intentionally NOT part of a workspace. There is no root
# Cargo.toml: a workspace would couple this crate to the monitor's build and
# `cargo test --all`, while the backend is built and shipped on its own (one
# native binary per target platform, identity = `BUILD_ID`). Build this
# natively on the target.
#
# F20（2026-08-04）：「standalone」到底 standalone 到什么程度 —— 实测答案，别再猜：
#   · `cargo build`  **真的独立**。把两条 backend→monitor 的 `include_str!` 路径打断，
#     `cargo build` 仍然 exit=0 / 0 error ⇒ 目标机原生构建**不需要**旁边那棵 `src/bridge/`。
#   · `cargo test`   **不独立**。它需要 `../src/bridge/` 在 —— 两条判据要跨轨对拍
#     （`control/gate.rs` 读 Gate 2 的黄金夹具 · `control/launch.rs` 读 monitor 的
#     `tmux.rs` 断言 `format!("={target}:")` 两侧同形）。打断后 `cargo test --no-run`
#     exit=101，两条都被逐字点名。
# 这两条边**刻意保留**：跨轨对拍是「两侧不许偷偷漂开」的唯一保障，而它只在判据里，
# 不影响部署。由 monitor 侧 `cross_half_edge_registry` 逐条登记 + 钉住
# 「一条都不许长到生产段」（真长过去，上面那句 standalone 就变假了）。

# 🔴 〔步 9 · 09-19〕库面。`设计/00 §1.5.4` 前置 1：目标是「`backend-core` 一份，
#    两个宿主 link 同一份」——本机 GUI 进程内跑它，远端走下面那个薄 `main` 壳。
#    在这之前本 crate 只有 `[[bin]]`，模块全是 bin 私有的 ⇒ **没有任何东西能 link 它**。
# ⚠ crate 名用下划线（Rust 标识符），产物名保持连字符 —— 两者不是一回事。
[lib]
name = "cc_monitor_backend"
path = "lib.rs"

[[bin]]
name = "cc-monitor-backend"
path = "main.rs"

# ── 秤 7（`调研/设计/17 §6` 表第 7 行）：`benches/` 从零立的第一条 ───────────────
#
# 〔TQ1 2026-09-24〕源码从 `tests/evidence/` 搬进 `tests/benches/`（bench 源码的唯一住址；
# 量具与历史读数那棵树的规矩是「不许改」，而这一份真的在编译）。
# `test = true`：`cargo test` 也编它、跑它 —— 不带 `--bench` 时它走**冒烟档**（小语料、每格一次、
# 出字节与期望逐字节相等，**不计时**），于是门禁 `backend` 那一格顺带证明「这把秤跑得起来」；
# 读数照旧只由 `cargo bench --bench s7_history_read` 出，墙钟不进任何判据。
#
# `harness = false`：不写 `[[bench]]` 的话 cargo 会套 libtest 的 bench harness，
# 那个要 `#![feature(test)]`（nightly）。本仓是 stable + **断网**（`~/.cargo` 里没有
# criterion 的 `.crate`，`--offline` 解析不动）⇒ 自带 `fn main()` + `std::time::Instant`。
# **不为了好看去联网。**
#
# 🔴 **为什么源码不住 `src/backend/benches/`** —— 现打，不是偏好：
# 本 crate 有 **17 个扫描型守卫**按 `guard_support::src_root()`（= 本 manifest 所在目录）
# **递归走全树收 `.rs`**。其中 `no_timer_guard::periodic_wake_patterns()` 的禁用表里
# 逐字有一条 `format!("{}::now", "Instant")` —— 而一把计时的秤**必须**调它。
# ⇒ 只要这个文件落在 `src/backend/` 下面任何一层，`backend_production_code_has_no_periodic_wakeups`
# 当场红，而那条守卫住 `tests/backend/`、不在本件的写区里。
# 同理还有 `readonly_guard::every_fs_call_in_backend_production_is_read_only` 那张只读白名单。
# ⇒ 源码放 `tests/benches/`（它**不在** `code_roots()` 的两棵树里 —— 那两棵是
#   `src/backend/` 与 `tests/backend/`），住址由本节的 `path` 指过去。
#   这与 `.cargo/config.toml` 把 `target-dir` 挪出源码树是**同一条理由的第二例**：
#   「源码树上多一个 `.rs`」对这个仓来说从来不是中性的。
[[bench]]
name = "s7_history_read"
path = "../../tests/benches/s7_history_read.rs"
harness = false
test = true

[dependencies]
# Versions pinned to whatever ../bridge/Cargo.lock already resolved so the
# local cargo cache serves these offline (serde 1.0.228 / serde_json 1.0.x,
# tokio 1.52.x, notify 6.1.x, notify-debouncer-mini 0.4.x, walkdir 2.5.x,
# tracing 0.1.x). Keep this list minimal.
#
# ⚠ 订正〔回修轮 08-25，承接 D1 `重要-4` / `漂-2`〕：**上面这句话只管它点名的那几条。**
# `rustls` / `webpki-roots`（K-H1 加的，见本表末尾）**不在** `../bridge/Cargo.lock` 里 ——
# 同一把尺子 `grep -c '^name = "rustls"$' ../bridge/Cargo.lock` ⇒ **0**，`webpki-roots` ⇒ **0**
# （而上面点名的 serde / serde_json / tokio / notify / notify-debouncer-mini / walkdir /
#  tracing / tracing-subscriber / libc 逐个量都是 1）。
# ⇒ 这两条**没有**被 pin 到 monitor 那份 lock，**也不能**靠「monitor 早就下过」变成离线可用。
# 准确说法：**一台从没下过 `rustls` 的机器，backend 第一次构建必须联网**；下过之后本机缓存才服务得了它。
# 这正是 `裁-1` 代价② 认下的那条 —— 代价认了，而这段块头注先前一个字没跟着改，于是它自己变成了假话。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# G1：分叉的记录变换与 monitor 共用同一份（单向 path 依赖；不会把本 crate 拖进 monitor 的 workspace）。
branch-core = { path = "../bridge/crates/branch-core" }
codex-token-core = { path = "../bridge/crates/codex-token-core" }
# 〔DUP2 · J19〕agent 工具词表的唯一一份（会话事实的 agent 列表按它认工具名；monitor 渲染 agent 卡用同一份）。
agent-tools-core = { path = "../bridge/crates/agent-tools-core" }
# 〔DUP3 · J9〕上游 base URL 能不能用的唯一一份（中转解析 · 上游选择装表 · 写口）；非业务 crate ⇒ 通信层成员可以用它（C2）。
upstream-url-core = { path = "../bridge/crates/upstream-url-core" }
acct-core = { path = "../bridge/crates/acct-core" }
# K-H2a：第三方 API key 的唯一住址（装它的类型 / 落盘格式 / 权限判断）。
# 🔴 〔RM1a · 第四波〕**开了 `harden`** —— `K-H2a` 裁四「backend 只许读」收窄成
# 「backend 里只有账号域那一份（`accounts/upstream/file_face.rs`）写这份文件，只从帧面 `apikey-key-set` 进来」。
# 理由：远端那台机器上的 key 只能由那台的后端写（`调研/第四波记录/RM1a.md §1`：那份文件是上游选择
# 自己的状态，不是用户文件，走 `readonly_guard` 第四层）。「出生即只给本人」只有一份实现
# （`creds_core::perm::create_private`），不在本 crate 另写一个 ⇒ 要它就得开这个 feature。
# ⚠ 买掉的那一格如实记：「backend 写不了这份文件」先前是**编译器**兜的，今天换成判据兜 ——
#   写半边（`perm::create_private` / `perm::make_private`）在本 crate 生产段的引用处 == 第四层登记的那一份
#   （`readonly_guard::g6_dependency_signoff` 那条边界判据 ＋ `relay::creds_guard` 那条 feature 判据）。
# 顺带：开了之后 Windows 上 `perm::probe` 也读得了 DACL（先前那条「查不出来」的代价没了）。
creds-core = { path = "../bridge/crates/creds-core", features = ["harden"] }
# U8c-2b-0：POSIX 单引号 quote 的唯一实现（账本 S5 收口）。
# 本 crate 只用它一处（`control/tmux_hook::sq`）；U8c-2c 起载荷渲染也走它。
shell-quote-core = { path = "../bridge/crates/shell-quote-core" }
# 〔US1 · 4D〕中转门牌的唯一住址（端口 · 钥匙文件路径 · 路由语法），与 monitor 同一份（`设计/20 §5` 目标）。
relay-route-core = { path = "../bridge/crates/relay-route-core" }
# K-R100：历史全文搜索口径的唯一实现（本 crate 的 `observe/search_query.rs` 全靠它）。
# 与 monitor 同一份 —— 两侧的 snippet 预算顺序、截断口径、文本抽取从此不可能各走各的。
search-core = { path = "../bridge/crates/search-core" }
# F03：§34 Gate 2 的唯一实现。**生产依赖**——这道门要在 `control/` 的生产段真的执行，
# 不是只在测试里比对（那样就成了「门在测试里、路在生产里」）。
gate-core = { path = "../bridge/crates/gate-core" }
# 〔CP2c · 第四波 4C〕对外文案表的 Rust 取文口（`设计/01 §6.9`：所有对外文案与报错都从一张表来）。
# 后端自己出句子、读的是与前端 / monitor 同一份 `src/shared/copy/table.json`（选 A 的理由：
# `调研/第四波记录/CP2c.md §2.1`）。依赖只有 `serde_json`（本 crate 早就有）⇒ 不引新的第三方包。
copy-core = { path = "../bridge/crates/copy-core" }
# 〔MIG-3b〕部署决策的唯一一份（表 A / 表 B · 身份戳 · 只升不降），与 monitor 同一份：本机常驻后端出计划（`control/deploy_plan.rs`），monitor 只放字节。
deploy-core = { path = "../bridge/crates/deploy-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    # io-std gates tokio::io::stdout(); io-util alone is not enough.
    "io-std",
    # K-P1：常驻监听口（回环 TCP）。**只加 feature，不加依赖条目** ——
    # `net` 带进来的 `socket2` **是纯 Rust**（本 crate 的 lock 现打 `socket2 0.6.3`，
    # 它的 `dependencies` 只有 `libc` 与 `windows-sys` ⇒ 纯 FFI 绑定，没有 `cc` 构建脚本，
    # **不新增一棵 C 构建树**），`mio` 本 crate 的 lock 里早就有（`signal`/`io-std` 都在用它）。
    # ⚠ **这句话先前撑在一条已经作废的框架上，别再照抄**〔`K-R34` 09-06 换掉〕：
    #   原文逐字「`net` 带进来的 `socket2` 是纯 Rust（`C18`「依赖树零 C」**不受影响**）」——
    #   **事实那一半是真的、留着**；换掉的是括号里那条框架：
    #   盘上逐字「~~**C18** backend 不引 C 生态链~~ **已被推翻（08-29）**」
    #   （住址 backend-consolidation 的 `MASTERPLAN.md:58`；现行版本是 `K30`
    #    ——「装到任意 agent 机器就能跑」＝静态 musl · 两个架构都出得来 · 体积在预算内，
    #    **不是**「零 C」）。
    #   ⇒ 今天这一格要说的是「**多这一个 feature 不新增 C 构建树**」，
    #     **不是**「零 C 没被破坏」—— 本 crate 的「零 C」本来就早不成立，
    #     逐字同结论写在本表末尾 `russh` 那段的 `①`，两处说的是同一件事。
    # ⚠ 为什么不沿用 `relay/` 那份 `std::net::TcpListener`（blocking）：
    # 常驻这条路要把 socket 的读写两半**原样喂给今天 stdin/stdout 的位置**
    # （`inbound::spawn<R: AsyncRead>` · `writer_task<W: AsyncWrite>` 本来就是泛型），
    # 而 `std` 的 socket 变不成 `AsyncRead`/`AsyncWrite`。
    "net",
    "sync",
    "signal",
    "fs",
    "time",
    # 〔RM1f〕`plugin::invoke::run_abortable`：异步等插件子进程 —— 那个 future 被丢 = 子进程被杀，
    # 后端 `cancel` 才打得断建索引（`Run::Blocking` 那一档 `abort()` 是空操作）。只加 feature：
    # 它要的 `signal-hook-registry` / `mio` 本 crate 的 lock 里早就有（`signal` 那一格在用）。
    "process",
] }
# P2（zero-poll-liveness）：pidfd_open + poll。**已是 tokio 在 unix 上的传递依赖**
# （本 crate Cargo.lock 里 libc 0.2.186 早已解析）⇒ 声明它不动 lock、离线可用。
# 只用 SYS_pidfd_open / poll / pollfd 三样，不引入任何 feature。
libc = "0.2"
# K-H1〔裁-1，08-25〕：**backend 侧第一条加密依赖**，也是**本仓第一条 TLS（X.509 + 根证书链）依赖**。
#
# ⚠ 口径订正〔回修轮 08-25，承接 D1 `重要-4`〕：先前这里逐字写的是「**本仓**第一条加密依赖」，
# 而下面两行同时写着「`ring` 已经在」—— **同一段注释自相矛盾**，且前半句是假的。
# 根子是两个词混着用了，分清楚：
#   · **依赖图**（谁的 Cargo.lock / cargo tree 里有它）：`ring 0.17.14` 在本件**之前**就已在
#     monitor 的依赖图里 —— `git show c3cf193:src/bridge/Cargo.lock | grep -c '^name = "ring"$'` ⇒ **1**，
#     `cargo tree -i ring --manifest-path ../bridge/Cargo.toml` ⇒ `ring └── russh └── monitor`。
#     同一把尺子量 **backend 自己**那份 lock 的同一个尖 ⇒ **0** —— 所以「**backend 侧**第一条」是真话。
#   · **本机 cargo 缓存**（`~/.cargo/registry/cache/` 里有没有那个 `.crate` 文件）：**只说这台机器**，
#     与依赖图是两件事。缓存里有不等于依赖图里有，反过来也一样。
#   ⇒ 下面「少下一棵 C 构建树」这条好处**两个口径都成立**，但它买到的是**构建时间**，不是「本仓第一条」。
#
# **只准 TLS**，`K8` 那条「不引 HTTP 框架」的白名单一个字没松 —— HTTP/1.1 的请求解析与
# chunked 写出仍是手写的（见 src/relay/）。
# 选 `rustls` 而不是 `ureq`/`hyper`：后两者是 HTTP 客户端/框架，会把「一个块」变成一层框架。
# crypto provider 钉 `ring`（不是默认的 aws-lc-rs）：`ring` 是 monitor 侧 `russh` 已经在用的那一棵，
# 复用它省掉 aws-lc-rs 那棵**另外**要现下载现编的 C 构建树。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# 〔FW1 · 第四波 4D〕CAS 的摘要形 `expect: {"sha256": …}`（编辑器存盘 · 上传提交，`files/mod.rs::content_sha256`）。
# **零新包**：`ring 0.17.14` 本来就在本 crate 的 lock 里、发出去的二进制已经链接它（上面 `rustls` 的 provider · `russh`），
# 这一行只是把它从间接依赖提成直接依赖（版本跟 lock 里那一份）。
ring = "0.17"
webpki-roots = "1"
# ── `K-P6b`（候选 E）：`--dial` 那条代理臂的 SSH 客户端 ──────────────────────
#
# 🔴 **它只服务 `src/dial/`那一份**（`dial_locality` 那条判据把「谁许 `use russh`」钉在文件维上）。
# 版本与 feature 集**逐字照抄**当年 `../bridge/Cargo.toml` 那一行（`0.61.1` · `default-features = false`
# · `["ring", "flate2", "rsa"]`）—— 理由不是省事：**两侧握出来的必须是同一套算法集**，
# 一侧多开一个 feature 就意味着「界面拨得通、代理拨不通」这种只在某台远端上才现形的分叉。
# 〔SR1b · 2026-09-24〕**界面那一侧的 `russh` / `russh-sftp` / `primefield` 三行已经删了**（界面进程零 SSH，V89）
# ⇒ 「两侧同一套」这句话今天没有第二侧了；本 crate 是唯一的 SSH 客户端。
# `primefield` 那条钉（搬自 `../bridge/Cargo.toml`，那一行随三行一起删了）：russh 的 ECDSA 走 p256/p521 0.14.0-rc.9，
# 它们要 primefield 0.14.0-rc.9；cargo 默认会在 0.14.0-rc.* 里取最新的 rc.10（改了 ff trait 拆分，与 rc.9 的
# p256/p521 不兼容 ⇒ `E0277 FieldElement: elliptic_curve::Field`）。本 crate **没有**声明它，靠的是 lock 里锁着的
# `0.14.0-rc.9`（`K-P6b-r3-lock-prime.py` 播的种）—— 与下面 `crypto-bigint` 那段同一个处境：**重解析就会撞上**。
#
# ⚠⚠ **两条如实登记的代价，别读成「没问题」**：
#   ① **`C18`「依赖树零 C」这条本 crate 早就不成立**（`rustls`/`ring` 08-25 就进来了，
#      `KG1` 成功标准② 已因此重写成「静态 musl 二进制」）。russh 走的是**同一棵 `ring`**
#      ⇒ 它**不新增**一棵 C 构建树；但这句话是「不新增」，**不是**「零 C」。
#      ⚠ 补一句〔`K-R34` 09-06〕：**那条框架本身后来也没了** —— 盘上逐字
#      「~~**C18** backend 不引 C 生态链~~ **已被推翻（08-29）**」（住址 backend-consolidation 的
#      `MASTERPLAN.md:58`；现行版本是 `K30`）⇒ 今天**不是**「本 crate 破了一条还活着的规矩」，
#      是**那条规矩已经不在了**。上面 tokio 那条 `net` feature 的注释同源同结论，
#      **这份文件里关于 `C18` 的两处话从此不再打架**。
#   ② 🔴 **musl 交叉编译本轮没验**。CI（`.github/workflows/release.yml` 的 `build-backends`）
#      要把本 crate `cargo zigbuild` 到 `x86_64-unknown-linux-musl` 与 `aarch64-unknown-linux-musl`，
#      **而沙箱门禁只做本机 gnu 构建、不做交叉编译** ⇒ **门禁全绿也证不出这两个 target 编得过**。
#      `ring` 在 musl 上要 `cc` 编汇编，zig 作 linker 这条路本 crate 已经走通过（`rustls` 那次），
#      但**那次的依赖树里没有 russh**。**这一格是「没验」，不是「验过没事」。**
#
# ⚠⚠ **第三条如实登记：这一条今天离线解析不动，靠的是 lock 已经先播过种。**
# `russh 0.61.1` 无条件依赖 `crypto-bigint ^0.7.1`，而现打：`crypto-bigint` 的
# `0.7.0 … 0.7.4` **在 crates.io 上全部 yanked**（只有 `0.7.5` 没被 yank），
# 而门禁那个断网沙箱的 crate 缓存里**只有** `crypto-bigint-0.7.3.crate` 一份
# ⇒ `--offline` 把候选集限成「已下载的那几份」⇒ 唯一候选是 yanked 的那份
# ⇒ **`cargo` 在解析这一步拒绝选它**（`=0.7.3` 硬钉也照拒），实打退 101。
# `cargo` 只在**解析**时拒 yanked，不在「lock 里已经写着」时拒 ——
# `../bridge/Cargo.lock` 今天就锁着 `crypto-bigint 0.7.3`（在 yank 之前锁进去的），
# monitor 侧因此断网构建得动。⇒ 本 crate 的 lock 由 `tests/evidence/K-P6b-r3-lock-prime.py`
# 把 monitor 那份里 `russh` 可达的包块搬过来，处境与 monitor 侧对齐。
# 🔴 **代价写明**：本 crate 从此也钉在一个 **yanked** 的 `crypto-bigint 0.7.3` 上
# （与 monitor 侧同一份）。哪天 `russh` 升到能用 `0.7.5` 的版本，两侧一起挪。
#
# ── 🔴 **今天的状态与后果**〔`K-R34` 09-06 补〕 ───────────────────────────────
# 上面「**第三条如实登记**」与「**代价写明**」那两段讲的是 `K-P6b` **当时怎么绕过去的**
# （拿 monitor 那份 lock 播种）。这一段讲**今天**。
#
# ① **今天钉着哪个版本 —— 本轮现打**（09-06，量于 `97a4714`，两份 lock 各一把同样的尺子
#    `grep -c '^name = "crypto-bigint"$' <lock>`）：`src/backend/Cargo.lock` ⇒ **1** 处、
#    版本 **`0.7.3`**；`../bridge/Cargo.lock` ⇒ **1** 处、版本也是 **`0.7.3`**。**两侧同一份。**
#
# ② 🔴 **后果一句话：「今天编得过」不等于「明天还编得过」。**
#    今天编得过，**是因为 lock 里已经写着** —— `cargo` 只在**解析**那一步挡 yanked。
#    凡是让 cargo **重走解析**的事：`cargo update` · 删掉 / 换掉 lock · 换一台没有这份 crate
#    缓存的机器 · 加或改任何一条依赖 —— **都会撞上同一堵墙**。
#    ⇒ 这**不是**「今天编不过」，是「**哪天要重解析就编不过**」。别把绿门禁读成这件事没了。
#
# ③ ⚠ **「那几个版本到底有没有被 yank」—— `K-R34` 本轮没核，判不了。**
#    上面「`0.7.0 … 0.7.4` 全部 yanked」那句是 `K-P6b` 那一轮写下的，当时的依据是
#    **解析期报错**（住址就在上面同一段）—— 那是**转述，不是本轮的读数**。
#    要核它得**联网**查 crates.io，而门禁沙箱一律断网（`DEVBOX_NET=none`）
#    ⇒ 本文件里关于 yank 的每一句（含上面「代价写明」那两行），读的时候都要带上这个口径。
#
# ④ 🔴 **两条出路 —— 这里只写「谁来决定」，不写「怎么做」；`K-R34` 不做决定**：
#    · **升到 `crypto-bigint 0.7.5`**：它是跟着 `russh` 走的，而两侧的版本与 feature 集
#      **必须同版同 feature**（理由见上面那段：一侧多开一个 feature 就是「界面拨得通、
#      代理拨不通」）⇒ **本 crate 单方面决定不了**，是**一件同时动 monitor 与后端两侧的活**。
#      **谁来决定：PM 立件、用户拍板。**
#    · **砍掉 `rsa` feature**（`crypto-bigint` 就是它拉进来的）：要**先量**
#      「有没有只认 RSA host key 的远端」—— 那是一次对**真实远端**的摸底，**今天没人量过**。
#      **谁来决定：用户**（只有他知道要连哪些机器）。
#    ⚠ 这两条都压着 ③ 那一问（**要联网**）。
#
# ⑤ ⚠ **别把这一段读成「已知问题、可接受」—— 没有人裁过那句话。**
#    它今天的状态是「**登记在案、等着谁来决定**」，不是「批过了」。
# ─────────────────────────────────────────────────────────────────────────
russh = { version = "0.61.1", default-features = false, features = ["ring", "flate2", "rsa"] }
# ── 〔SR1b · 2026-09-24〕SFTP 客户端：**SFTP 进本机常驻后端**（用户 V89「进本机常驻后端，只写暂存区」）──
#
# 🔴 **它只服务 `src/dial/sftp.rs` 那一份**：`readonly_guard::remote_write_layer` 把「持 SFTP 会话 /
# 开子系统 / 协议改动动词」钉在那**一份文件**上，而那份文件的写根 == `{~/.cc-monitor/staging, ~/.cc-monitor/bin}`
# （`INVARIANTS §41.6` 的 V89 订正）。签字行住 `readonly_guard::g6_dependency_signoff`。
# 版本照抄当年 `../bridge/Cargo.toml` 那一行（`3`，lock 里 `3.0.0`，Apache-2.0；`设计/60 §6.5.3` 现打核过 5 个候选、
# 用户「不要 GPL」核过）。monitor 那一行同拍删了（界面进程零 SFTP）⇒ 本 crate 是唯一一份。
# ⚠ 3.0.0 **仍然无** posix-rename@openssh 扩展 ⇒ `dial/sftp.rs::put_atomic` 的近似原子写照旧成立，不许当成已解决。
# 它是**传输泛型**的（吃 `AsyncRead + AsyncWrite`，自己的 `tokio` 没开 `net`）⇒ 结构上开不了 socket，
# 字节只能走 `dial/` 那条已鉴权的 SSH 连接。
russh-sftp = "3"
notify = "6.1"
notify-debouncer-mini = "0.4"
walkdir = "2.5"
# ── 〔FILES2 · 第四波 · 2026-09-27〕解压（`control/files_extract.rs`，`设计/60 §6.2` · `§7` 第 9 条 Q3）──
# 主会话按通行做法裁：「由那台后端用 Rust 库（`tar` · `flate2` · `zip`，不调外部命令）解」。三条都纯 Rust、MIT / Apache-2.0：
# `flate2` 锁里早就有（russh 那棵，`miniz_oxide` 后端）⇒ 这里只把它从间接变直接；`tar` 关掉缺省的 `xattr`（不还原扩展属性）；
# `zip` 关掉全部缺省（aes / bzip2 / lzma / xz / zstd / zopfli 那几支会拖 C 或大依赖），只开读 deflate 那一支（`deflate-flate2` ＋ 它要的 `flate2`）。
# 签字行住 `readonly_guard::g6_dependency_signoff`。只读包、写盘一个字节都不经它们（逐条目自己过路径解析再落）。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

