[package]
name = "cc-monitor-backend"
# 🔴 本 crate 刻意不用 Cargo.toml 的版本 —— 真身份住 lib.rs 的 BUILD_ID
#
# 这一行**不是忘了填**，也**不许**顺手换成一个「像样」的数字。
#
# · 它不参加 `release.yml` 那道「四处版本号与 tag 一致」的检查（那四处是
#   `package.json` / `src/frontend/shell/tauri.conf.json` / `src/frontend/shell/Cargo.toml` /
#   `src/frontend/shell/Cargo.lock` 的 `monitor` 包）—— 后端**不随 app 的 tag 走**：
#   后端是「一份代码、每平台一份原生二进制」，它换不换由**行为变没变**决定
#   （`BUILD_ID` 的 bump 纪律），不由发版节奏决定。给它一个跟 tag 走的版本号 = 给后端
#   造**第二个身份**，那正是「后端只有一个」在身份这一维要避开的事。
# · 那条「不参加」不是靠这段散文守着：`build_id_guard` 的
#   `the_crate_version_is_deliberately_zero_and_the_real_identity_has_a_home`
#   **在数它** —— 这一行一动、或真身份那一处住址坏掉，当场红。
# · 真身份的住址（判据逐条核）：`lib.rs` 的 `pub const BUILD_ID`（从 `main.rs` 搬进库面）
#   ＋ 由它编译期拼出来、扫得进二进制字节的 `CC_MONITOR_BUILD_STAMP`
#   ＋ `--ccm-probe` 吐的 `build=` 那一行。
version = "0.0.0"
edition = "2021"

# Standalone crate, intentionally NOT part of the monitor's workspace. There is no
# repo-root Cargo.toml: that would couple this crate to the monitor's build and
# `cargo test --all`, while the backend is built and shipped on its own (one
# native binary per target platform, identity = `BUILD_ID`). Build this
# natively on the target.
# It is the root of its own small workspace (see `[workspace]` at the end): the
# dial core `ssh-dial/` (shared with the phone) is a member, so both share this
# lock and the same russh, and `cargo test --workspace` runs its tests too.
#
# 「standalone」到底 standalone 到什么程度 —— 实测答案，别再猜：
#   · `cargo build`  **真的独立**。把两条 backend→monitor 的 `include_str!` 路径打断，
#     `cargo build` 仍然 exit=0 / 0 error ⇒ 目标机原生构建**不需要**旁边那棵 `src/frontend/shell/`。
#   · `cargo test`   **不独立**。它需要 `../src/frontend/shell/` 在 —— 两条判据要跨轨对拍
#     （`control/gate.rs` 读 Gate 2 的黄金夹具 · `control/launch.rs` 读 monitor 的
#     `tmux.rs` 断言 `format!("={target}:")` 两侧同形）。打断后 `cargo test --no-run`
#     exit=101，两条都被逐字点名。
# 这两条边**刻意保留**：跨轨对拍是「两侧不许偷偷漂开」的唯一保障，而它只在判据里，
# 不影响部署。由 monitor 侧 `cross_half_edge_registry` 逐条登记 + 钉住
# 「一条都不许长到生产段」（真长过去，上面那句 standalone 就变假了）。

# 「后端源码树」的判据人群：本包 ＋ 只有后端链的兄弟包（中转 `comms-outward`）。拨号核心 `ssh-dial` 住本目录底下（`ssh-dial/`），按目录就在人群里。按人群扫的判据（只读 · 零定时器 · 日志白名单 …）
#   照旧管到中转那几份；`guard_core::walk_tree` / `module_address` 按它收 / 认（中转的文件认作 `comms-outward/<文件>`）。
[package.metadata.guard]
population = ["../comms/outward"]

# 🔴 库面。前置 1：目标是「`backend-core` 一份，
#    两个宿主 link 同一份」——本机 GUI 进程内跑它，远端走下面那个薄 `main` 壳。
#    在这之前本 crate 只有 `[[bin]]`，模块全是 bin 私有的 ⇒ **没有任何东西能 link 它**。
# ⚠ crate 名用下划线（Rust 标识符），产物名保持连字符 —— 两者不是一回事。
[lib]
name = "cc_monitor_backend"
path = "lib.rs"

[[bin]]
name = "cc-monitor-backend"
path = "main.rs"

# ── 秤 7（表第 7 行）：`benches/` 从零立的第一条 ───────────────
#
# 源码从 `tests/evidence/` 搬进 `tests/benches/`（bench 源码的唯一住址；
# 量具与历史读数那棵树的规矩是「不许改」，而这一份真的在编译）。
# `test = true`：`cargo test` 也编它、跑它 —— 不带 `--bench` 时它走**冒烟档**（小语料、每格一次、
# 出字节与期望逐字节相等，**不计时**），于是门禁 `backend` 那一格顺带证明「这把秤跑得起来」；
# 读数照旧只由 `cargo bench --bench s7_history_read` 出，墙钟不进任何判据。
#
# `harness = false`：不写 `[[bench]]` 的话 cargo 会套 libtest 的 bench harness，
# 那个要 `#![feature(test)]`（nightly）。本仓是 stable + **断网**（`~/.cargo` 里没有
# criterion 的 `.crate`，`--offline` 解析不动）⇒ 自带 `fn main()` + `std::time::Instant`。
# **不为了好看去联网。**
#
# 🔴 **为什么源码不住 `src/backend/benches/`** —— 现打，不是偏好：
# 本 crate 有 **17 个扫描型守卫**按 `guard_core::addr::backend_src_root()`（= 本 manifest 所在目录）
# **递归走全树收 `.rs`**。比如 `readonly_guard` 那张只读白名单。
# ⇒ 源码放 `tests/benches/`（它**不在** `code_roots()` 的两棵树里 —— 那两棵是
#   `src/backend/` 与 `tests/backend/`），住址由本节的 `path` 指过去。
#   这与 `.cargo/config.toml` 把 `target-dir` 挪出源码树是**同一条理由的第二例**：
#   「源码树上多一个 `.rs`」对这个仓来说从来不是中性的。
[[bench]]
name = "s7_history_read"
path = "../../tests/benches/s7_history_read.rs"
harness = false
test = true

[lints.clippy]
# 「现在」只有一处（禁的路径与理由住 `clippy.toml`）：别处直接问系统钟 ⇒ clippy 红。
disallowed_methods = "deny"

[lints.rust]
# 一个函数上叠两个 `#[test]`，另一个函数就悄悄不是测试了：编译期挡。
duplicate_macro_attributes = "deny"

[features]
# 截图台架那一档（`tests/shots/real/pool.mjs` 编）：「现在」从台架交的时刻接着走（`common::time::shots_clock`）。
# 发版 / CI / 门禁里不许开（判据 `one_clock_guard` · 壳那一侧 `shots_feature_guard_tests::s3`）。
shots = []

[dependencies]
# Versions pinned to whatever ../frontend/shell/Cargo.lock already resolved so the
# local cargo cache serves these offline (serde 1.0.228 / serde_json 1.0.x,
# tokio 1.52.x, notify 8.2.x, walkdir 2.5.x,
# tracing 0.1.x). Keep this list minimal.
#
# `rustls` / `webpki-roots` 也在 `../frontend/shell/Cargo.lock` 里：中转 crate `comms-outward` 是那个 workspace 的成员，
# 两份锁解出同一个版本（`cargo tree -d` 两边都只有一份）。一台从没下过它们的机器，第一次构建仍要联网。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 中转（通信层面 B，搬字节那一层）：本 crate 是它的宿主 —— 绑口、钥匙、期限、上游选择都由这里交进去。
comms-outward = { path = "../comms/outward" }
# 上游 base URL 能不能用的唯一一份（中转解析 · 上游选择装表 · 写口）；非业务 crate ⇒ 通信层成员可以用它（C2）。
upstream-url-core = { path = "../common/upstream-url-core" }
acct-core = { path = "../common/acct-core" }
# typed 命令两端对上的那几样：机器名 · 形状指纹表（hello 带出去）。
cmd-wire = { path = "../common/cmd-wire" }
# 照契约类型写成品字的那一侧（↗ 浮层那一张）：壳链同一份。
face-core = { path = "../common/face-core" }
# 第三方 API key 的唯一住址（装它的类型 / 落盘格式 / 权限判断）。
# 🔴 **开了 `harden`** —— 「backend 只许读」收窄成
# 「backend 里只有账号域那一份（`accounts/upstream_select/file_face.rs`）写这份文件，只从帧面 `apikey-key-set` 进来」。
# 理由：远端那台机器上的 key 只能由那台的后端写（那份文件是上游选择
# 自己的状态，不是用户文件，走 `readonly_guard` 第四层）。「出生即只给本人」只有一份实现
# （`creds_core::perm::create_private`），不在本 crate 另写一个 ⇒ 要它就得开这个 feature。
# ⚠ 买掉的那一格如实记：「backend 写不了这份文件」不由**编译器**兜，由判据兜 ——
#   写半边（`perm::create_private`）在本 crate 生产段的引用处 == 第四层登记的那一份
#   （`readonly_guard::g6_dependency_signoff` 那条边界判据 ＋ `relay::creds_guard` 那条 feature 判据）。
# 顺带：开了之后读凭据文件与中转钥匙时按句柄量权限（`perm::open_checked`，Windows 上读属主与 DACL）。
creds-core = { path = "../common/creds-core", features = ["harden"] }
# 交给 Win32 的路径（长路径前缀）只从它来：不覆盖改名那一处用；仓内 crate、零依赖。
win-path-core = { path = "../common/win-path-core" }
# POSIX 单引号 quote 的唯一实现。
# 本 crate 只用它一处（`control/tmux_hook::sq`）；载荷渲染也走它。
shell-quote-core = { path = "../common/shell-quote-core" }
# 后端的门牌与家的契约（端口 · 钥匙 · 路由语法 · `~/.cc-monitor/` 下每一样的相对路径），与 monitor 同一份（目标）。
relay-route-core = { path = "../common/relay-route-core" }
# 本人通道（常驻后端听的那个 Unix 套接字 · 目录独占锁 · 核对端 uid · 一次性子命令连它）：monitor 链同一份。
own-chan = { path = "../common/own-chan" }
# 等一个进程退出（会话的 claude · tmux server · 写记录的进程：Linux pidfd · Windows 进程句柄，零轮询）；Windows 开进程句柄也从它来。monitor 链同一份。
pidwatch-core = { path = "../common/pidwatch-core" }
# 对外文案表的 Rust 取文口（所有对外文案与报错都从一张表来）。
# 后端自己出句子、读的是与前端 / monitor 同一份 `src/shared/copy/table.json`。
# 依赖只有 `serde_json`（本 crate 早就有）⇒ 不引新的第三方包。
copy-core = { path = "../common/copy-core" }
# 一组一条命令的结局那一句（`said_of`）：与文件窗口 · 手机嵌的核心同一份。
batch-core = { path = "../common/batch-core" }
# 助手正文的 Markdown 解析成块树（`md_core::parse`，出 `cmd_wire::md` 的 `Doc`）：两家适配层翻译助手正文时调它，两端只照树排版。
md-core = { path = "../common/md-core" }
# 轮换的策略文件（`accounts/quota/strategy/`）跑在它的沙箱里：纯 Rust、零 C 依赖、按操作数掐、表有序。
# `sync` ⇒ 编好的策略能放进进程里的缓存跨线程用；`serde` ⇒ 上下文与回值经 serde 进出；`no_time` ⇒ 脚本里没有取时间的函数。
rhai = { version = "1.26.1", default-features = false, features = ["std", "sync", "serde", "no_time"] }
# 部署那一族的契约（表 A 的键与行 · 戳格式 · 答话形状 · 路径），与 monitor 同一份；判定（承诺 · 换不换 · 认不认）住 `deploy` crate。
deploy-contract = { path = "../common/deploy-contract" }
# 拨号核心（竞速 · 跳板 · 鉴权 · 复用 · 用法 · SFTP 客户端）：手机同一份；本后端经 `dial/mod.rs::host` 装上自己那一套。
ssh-dial = { path = "ssh-dial" }
# 装 / 升级远端后端的判定与编排（与 ssh-dial 并列；手机 mobcore 链同一份）。
deploy = { path = "deploy" }
# 出网口（这台所有出站 TCP 只在那里开：直连或经代理）：中转去上游 · 拨 SSH 都经它；本后端起来时照自己的环境装这台的描述（`main.rs`）。
egress = { path = "egress" }
# 连远端常驻后端的客户端那一侧（桌面 · 手机同一份）：测试连接拿表单那份配置跑一趟它的常驻流（`dial/probe.rs`），与真连接同一串。
# 它的期限与退避属客户端那一侧，不进本 crate 的零定时器判据人群。
resident-client = { path = "../comms/resident-client" }
# 通道那一句（离线那一句只由连接层写：`chan::said::offline`）。
comms-inward = { path = "../comms/inward" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    # io-std gates tokio::io::stdout(); io-util alone is not enough.
    "io-std",
    # 常驻监听口（回环 TCP）。**只加 feature，不加依赖条目** ——
    # `net` 带进来的 `socket2` **是纯 Rust**（本 crate 的 lock 现打 `socket2 0.6.3`，
    # 它的 `dependencies` 只有 `libc` 与 `windows-sys` ⇒ 纯 FFI 绑定，没有 `cc` 构建脚本，
    # **不新增一棵 C 构建树**），`mio` 本 crate 的 lock 里早就有（`signal`/`io-std` 都在用它）。
    # ⚠ 这一格说的是「**多这一个 feature 不新增 C 构建树**」，**不是**「依赖树零 C」：
    #   后端要的是「装到任意 agent 机器就能跑」＝静态 musl · 两个架构都出得来 · 体积在预算内，
    #   本 crate 的依赖树本来就有 C（`ring`），同结论写在本表末尾 `russh` 那段的 `①`。
    # ⚠ 为什么不沿用 `relay/` 那份 `std::net::TcpListener`（blocking）：
    # 常驻这条路要把 socket 的读写两半**原样喂给今天 stdin/stdout 的位置**
    # （`inbound::spawn<R: AsyncRead>` · `writer_task<W: AsyncWrite>` 本来就是泛型），
    # 而 `std` 的 socket 变不成 `AsyncRead`/`AsyncWrite`。
    "net",
    "sync",
    "signal",
    "fs",
    "time",
] }
# 本 crate 直接用 libc 的那几处（flock · 信号 · malloc_trim …）。**已是 tokio 在 unix 上的传递依赖**
# （本 crate Cargo.lock 里 libc 0.2.186 早已解析）⇒ 声明它不动 lock、离线可用。
# 不引入任何 feature。
libc = "0.2"
# 伪终端（`platform/child.rs::converse_in_terminal`：要终端才肯问的官方子命令，如 `claude mcp login`）。三个系统一套。
portable-pty = "0.9"
# 托管终端的屏（`host/managed/screen.rs`）：伪终端输出照它算成一屏 ＋ 回滚，整屏字节 · 抓屏 · 瘦客户端本地画都从它出。MIT。
vt100 = "=0.16.2"
# **backend 侧第一条加密依赖**，也是**本仓第一条 TLS（X.509 + 根证书链）依赖**。
#
# ⚠ 「backend 侧」不是「本仓」：`ring` 在 monitor 的依赖图里也有。两个词分清楚：
#   · **依赖图**（谁的 Cargo.lock / cargo tree 里有它）：`ring 0.17.14` 在这条依赖加进来**之前**就已在
#     monitor 的依赖图里 —— `git show c3cf193:src/frontend/shell/Cargo.lock | grep -c '^name = "ring"$'` ⇒ **1**，
#     `cargo tree -i ring --manifest-path ../frontend/shell/Cargo.toml` ⇒ `ring └── russh └── monitor`。
#     同一把尺子量 **backend 自己**那份 lock 的同一个尖 ⇒ **0** —— 所以「**backend 侧**第一条」是真话。
#   · **本机 cargo 缓存**（`~/.cargo/registry/cache/` 里有没有那个 `.crate` 文件）：**只说这台机器**，
#     与依赖图是两件事。缓存里有不等于依赖图里有，反过来也一样。
#   ⇒ 下面「少下一棵 C 构建树」这条好处**两个口径都成立**，但它买到的是**构建时间**，不是「本仓第一条」。
#
# **只准 TLS**，「不引 HTTP 框架」的白名单一个字没松 —— HTTP/1.1 的请求解析与
# chunked 写出仍是手写的（见 src/relay/）。
# 选 `rustls` 而不是 `ureq`/`hyper`：后两者是 HTTP 客户端/框架，会把「一个块」变成一层框架。
# crypto provider 钉 `ring`（不是默认的 aws-lc-rs）：`ring` 是 monitor 侧 `russh` 已经在用的那一棵，
# 复用它省掉 aws-lc-rs 那棵**另外**要现下载现编的 C 构建树。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# CAS 的摘要形 `expect: {"sha256": …}`（编辑器存盘 · 上传提交，`files/mod.rs::content_sha256`）。
# **零新包**：`ring 0.17.14` 本来就在本 crate 的 lock 里、发出去的二进制已经链接它（上面 `rustls` 的 provider · `russh`），
# 这一行只是把它从间接依赖提成直接依赖（版本跟 lock 里那一份）。
ring = "0.17"
# ── `--dial` 那条代理臂的 SSH 客户端 ──────────────────────
#
# 🔴 **它只服务 `src/dial/`那一份**（`dial_locality` 那条判据把「谁许 `use russh`」钉在文件维上）。
# 版本与 feature 集（`0.65` · `default-features = false` · `["ring", "flate2", "rsa"]`）与 `ssh-dial/Cargo.toml` ·
# `../mobile/core-rs/rust/Cargo.toml` 那两行逐字相同：同一棵 workspace 里 russh 只许解析出一份
# （`dial_compress_tests::russh_comes_from_crates_io_at_a_version_with_the_zlib_fix` 钉 lock 里恰好一块、来自 crates.io）。
# 界面进程零 SSH（界面那一侧的 `russh` / `russh-sftp` / `primefield` 三行早删了）⇒ 本 workspace 是唯一的 SSH 客户端。
# 0.61 那时靠 lock 播种绕过的两件（`primefield 0.14.0-rc.9` 钉 · yanked 的 `crypto-bigint 0.7.3`）随升级没了：
# 0.65 重解析出的是 `primefield 0.14.0` 正式版与 `crypto-bigint 0.7.10`（未 yank，10-28 crates.io 实查）。
# 0.62 → 0.65 跟着改的 API：`check_server_key` 收 `PublicKeyOrCertificate`（`ssh-dial/connect.rs`：证书不认）。
#
# ⚠ **如实登记**：
#   ① **本 crate 的依赖树不是零 C**（`rustls`/`ring` 带进来的），后端要的是「静态 musl 二进制」。
#      russh 走的是**同一棵 `ring`** ⇒ 它**不新增**一棵 C 构建树；但这句话是「不新增」，**不是**「零 C」。
#      上面 tokio 那条 `net` feature 的注释同结论。
#   ② musl 交叉编译：沙箱门禁只做本机 gnu 构建、不做交叉编译（门禁全绿证不出 musl 编得过）；
#      0.65 这一版本机 `cargo zigbuild --target x86_64-unknown-linux-musl` 现打编过。
# ─────────────────────────────────────────────────────────────────────────
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
# ── SFTP 客户端：**SFTP 进本机常驻后端**（用户「进本机常驻后端，只写暂存区」）──
#
# 🔴 **它只服务 `src/backend/ssh-dial/sftp.rs` 那一份**：`readonly_guard::remote_write_layer` 把「持 SFTP 会话 /
# 开子系统 / 协议改动动词」钉在那**一份文件**上，而那份文件的写根 == `{~/.cc-monitor/staging, ~/.cc-monitor/bin}`
# （`INVARIANTS §41.6`）。签字行住 `readonly_guard::g6_dependency_signoff`。
# 版本照抄当年 `../frontend/shell/Cargo.toml` 那一行（`3`，lock 里 `3.0.0`，Apache-2.0；现打核过 5 个候选、
# 用户「不要 GPL」核过）。monitor 那一行同拍删了（界面进程零 SFTP）⇒ 本 crate 是唯一一份。
# ⚠ 3.0.0 **仍然无** posix-rename@openssh 扩展 ⇒ `ssh-dial/sftp.rs::put_atomic` 的近似原子写照旧成立，不许当成已解决。
# 它是**传输泛型**的（吃 `AsyncRead + AsyncWrite`，自己的 `tokio` 没开 `net`）⇒ 结构上开不了 socket，
# 字节只能走 `dial/` 那条已鉴权的 SSH 连接。
russh-sftp = "3"
notify = "8.2"
walkdir = "2.5"
# ── 解压（`control/files_extract.rs`）──
# 由那台后端用 Rust 库（`tar` · `flate2` · `zip`，不调外部命令）解。三条都纯 Rust、MIT / Apache-2.0：
# `flate2` 锁里早就有（russh 那棵，`miniz_oxide` 后端）⇒ 这里只把它从间接变直接；`tar` 关掉缺省的 `xattr`（不还原扩展属性）；
# `zip` 关掉全部缺省（aes / bzip2 / lzma / xz / zstd / zopfli 那几支会拖 C 或大依赖），只开读 deflate 那一支（`deflate-flate2` ＋ 它要的 `flate2`）。
# 签字行住 `readonly_guard::g6_dependency_signoff`。只读包、写盘一个字节都不经它们（逐条目自己过路径解析再落）。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 配置文件（`~/.cc-monitor/profiles.toml`）的读与按条目改：保留用户手写的注释与排版（`assets/profiles`）。
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# 时刻按看的人那一台的时区写（请求信封 `tz` 是 IANA 名）：时区库随二进制带（`tzdb-bundle-always`），
# 不读这台的 `/usr/share/zoneinfo`、Windows 上也是同一份 ⇒ 远端后端按看的那一台的钟写字、夏令时按那一刻算。纯 Rust、无构建脚本。
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

# ── 远端 musl 版的全局分配器：mimalloc（`main.rs` 那一处 `#[global_allocator]`，判据 `allocator_guard`）──
# musl 自带的分配器放掉的内存不还给系统：680 MB 合成世界里热完全文搜索索引就常驻 350–490 MB（glibc 同一世界 117 MB），
# 问过一次含工具的搜索再涨两三百 MB、不回落。远端那台跑的就是这一版 ⇒ 只在 musl 目标上换；
# 本机 glibc 版（它会 `malloc_trim`，见 `platform/proc.rs::return_freed_memory`）与 Windows 版照旧用系统分配器，不多编这一棵 C。
# 许可 MIT（crate 与它带的 C 源都是）；C 源由 `cc` 编，交叉编译走 `cargo zigbuild` 的 zig cc（`cc` 本 lock 里早就有，`ring` 用它）。
# 缺省 feature 为空（v3、不开 secure / override）。签字行住 `readonly_guard::g6_dependency_signoff`。
# 只开 `no_thp`：不给 arena 打 `MADV_HUGEPAGE`。透明大页是 `madvise` 档的机器上，用得半满的 2 MB 区段会被并成大页，
# 空闲常驻每次多出 18–44 MB、每次不一样。设选项来不及（arena 在 `main` 之前第一次分配时就 mmap 了）⇒ 编进去。
# 判据 `freed_memory_tests::the_heap_takes_no_huge_pages`。
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../common/test-home" }
# typed 命令的线上类型住 `cmd-wire`（账号库 · 文件管理那几条）：测试档要它们的 TS 派生（形状指纹 · 生成类型），发布构建不开。
cmd-wire = { path = "../common/cmd-wire", features = ["ts"] }
# 测试档不许出网：拨号核心那一句断言（`test-support`）在后端的测试档里也开着（resolver 2 ⇒ 不并进发布构建）。
ssh-dial = { path = "ssh-dial", features = ["test-support"] }
# 测试档不许出网：那一句断言住出网口真开 TCP 的那一处（`test-support`）。
egress = { path = "egress", features = ["test-support"] }
# 组合判据（真中转 ＋ 上游选择 / tap / 内存探针）要够到中转的内部件：只在测试档开，不进发布二进制。
comms-outward = { path = "../comms/outward", features = ["test-support"] }
# 源码扫描型守卫的「只留生产段」剥法，与 monitor 共用同一份（守卫全在 cfg(test)，
# 故是 dev-dependency —— 不进发布二进制）。
guard-core = { path = "../common/guard-core" }
# `acct-core` 的跨生产者对拍夹具只在测试构建里（`accounts_query_tests.rs` 用）：同一个依赖，测试构建多开 `fixtures`。
acct-core = { path = "../common/acct-core", features = ["fixtures"] }
# 判据里异源算 sha256（夹具的摘要 · 传输与写盘的整份摘要对拍）。**只在测试期链接**；版本就是 lock 里 russh 那棵树
# 早已解析的 `sha2 0.11`（不新增包）。
sha2 = "0.11"
# 〔C01 同一条理由〕记录解释进了后端（`agents/claudecode/schema.rs`）⇒ 界面收到的记录的线上形状从这里导出
# `src/frontend/ui/generated/`（`npm run gen:types` 早就跑后端这一半）。**只在 dev 侧**：codegen 工具，不进发布二进制；
# 版本就是 monitor 那份 lock 里早已解析的 12.0.1（离线可用、本机缓存里有）。
ts-rs = "12.0.1"
# 假时钟（停着的钟，`advance` 才走）：测「挂着的提问自己带的期限」· 保活几轮判死不按墙钟等。只在测试档开。
tokio = { version = "1", features = ["test-util"] }

# 发布档按速度编：后端在 monitor 里内嵌三份（本机一份 · 远端两份）。
# · opt-level 3 而不是 "s"：一份 587 MB 记录，冷开 CPU 4.2 s → 3.2 s（−25%），会话内查找头一问（含工具）0.99 s → 0.65 s（−34%）；
#   微基准上数行 · 预筛 · 搜索匹配这类字节循环在 "s" 下不向量化。代价：二进制 24 MB → 34 MB（+40%）、编一趟 CPU +46%。"z" 更慢。
# · lto · 一个编译单元 · 去符号：速度不变，体积小一截。
# · panic 刻意留 unwind（不写 = 默认）：常驻后端里一个任务 panic 靠监督接住；abort 会把整个进程带走。
# 判据：`build_features_tests.rs` 的 `the_backend_release_profile_is_optimized_for_speed_and_keeps_unwinding`。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# ── 后端这一棵 workspace：本包 ＋ 拨号核心（`ssh-dial/`）＋ 手机嵌的 Rust 核心（`../mobile/core-rs/rust`，crate `mobcore`，只是拨号核心的 FFI 外壳）──
# 同一份 lock、同一个 russh（crates.io 上游那一份，各成员的版本声明对齐 ⇒ lock 里只一块）；两份的判据由 `cargo test --workspace` 跑。
# 缺省成员只有本包（`cargo build` / `cargo test` 不带 `-p` 时照旧只管后端）。
[workspace]
members = [".", "ssh-dial", "deploy", "egress", "../mobile/core-rs/rust"]
default-members = ["."]

# ── 测试档（dev 与继承它的 test）里给沙箱的策略引擎开优化：轮换一致性的推演（s22 · s26 · s36）跑在 Rhai 上，
#    依赖不开优化时后端那个测试二进制的墙钟就是它们（10-15 量过：89–93 s → 30–36 s；冷编多一成）。只给这几样，
#    工作区自己的 crate 照旧不开（内循环的增量编译不受影响）。判据：`build_features_tests.rs` 的
#    `the_test_build_optimizes_the_dependencies_the_slowest_tests_run_on`（与表两向相等、每项都在 Cargo.lock 里）。──
[profile.dev.package.rhai]
opt-level = 3

[profile.dev.package.smartstring]
opt-level = 3

[profile.dev.package.ahash]
opt-level = 3

# ── 测试档的调试信息只留行号表：缺省的全量 DWARF 让 lib 测试二进制一份近 1 GB，每次改一行都要重链这么大。
#    panic 回溯照旧有文件与行号；发布档（release · perf · mobile）不继承 dev，不受影响；mobile-dev 自己写了 debug = false。
#    判据：`build_features_tests.rs` 的 `the_test_build_keeps_only_line_tables_for_debug_info`。──
[profile.dev]
debug = "line-tables-only"

# ── 手机那份 `.so` 的两份 profile（Gradle 的 `:core-rs` 按构建类型挑一份；后端自己的 `release` 一格不动）──
# release 那一份：体积优先（opt-level z · 胖 LTO · 一个编译单元 · 去符号）；`panic = "unwind"` 是承重的 ——
#   嵌在 App 进程里，panic 要在 JNI 边界上接住（`catch_unwind`），abort 会带走整个 App。
# 大样本判据那一档（门禁 `rotation-500` 格：轮换一致性 500 组，沙箱里的 Rhai 在测试档慢几十倍）：发布档的优化，
# 不做 LTO、多开几路代码生成 —— 只为跑得快，不发货；编一趟比 `--release`（LTO ＋ 单路）快得多。
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.mobile]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# debug 那一份（模拟器 · androidTest · 冒烟）：增量快；去掉调试信息，包不至于几十 MB。
[profile.mobile-dev]
inherits = "dev"
debug = false
strip = "debuginfo"
