# 计划（planned-build）的读面：找 pb、跑 `pb dump`、加工成界面排版的成品、盯计划仓推 `changed {plan}`。只读，计划仓一个字节都不写。
# 只引足迹 · 观测面 · 历史清单 · agents · 插件 · 帧面零件 · 纯工具 · 平台八层。
[package]
name = "backend-plan"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 判据共用的夹具（合成 dump · 假 pb 插件）给上层判据（帧面那几份）。
test-support = []

[dependencies]
backend-footprint = { path = "../footprint" }
backend-observe = { path = "../observe" }
backend-history = { path = "../history" }
backend-agents = { path = "../agents" }
backend-plugin = { path = "../plugin" }
backend-wire = { path = "../wire" }
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }
# 帧的线上形（计划的线上类型住 `cmd_wire::plan`）。
cmd-wire = { path = "../../common/cmd-wire" }
copy-core = { path = "../../common/copy-core" }
# 推不出家那一句里点名的环境量（`DATA_DIR_ENV`）。
creds-core = { path = "../../common/creds-core" }
face-core = { path = "../../common/face-core" }
md-core = { path = "../../common/md-core" }
# 后端的门牌与家的契约（`~/.cc-monitor/` 下每一样的相对路径）。
relay-route-core = { path = "../../common/relay-route-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 源码扫描型守卫的「只留生产段」剥法 · 仓根住址（只在测试档）。
guard-core = { path = "../../common/guard-core" }
# 判据给认可与退回的记录发一张写证（`Own::issue_at`）。
backend-platform = { path = "../platform", features = ["test-support"] }
