  { path = "tokio::time::timeout", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
  { path = "tokio::time::timeout_at", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
  { path = "tokio::time::Instant::now", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
  { path = "libc::poll", reason = "后端零定时器：poll 的第三个参数是期限；-1 以外的值就是一次会自己醒来的等待，用一处在那一处放行并写理由" },
  { path = "std::time::Duration::from_secs", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
  { path = "std::time::Duration::from_millis", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
