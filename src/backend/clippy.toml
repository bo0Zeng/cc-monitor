  { path = "std::time::Duration::from_nanos", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
  { path = "std::time::Duration::from_secs_f32", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
  { path = "std::time::Duration::from_secs_f64", reason = "后端零定时器：会让线程 / 任务自己醒来的构件与它们要的期限，用一处就在那一处放行并写理由" },
