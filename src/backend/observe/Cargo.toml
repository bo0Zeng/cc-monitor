# 观测面：读，不改变世界（读行 · 认行 · 扫描图 · 查询 · 跟读）。只引资产 · 账号域 · agents · 历史清单 · 宿主口 · 帧面零件 · 纯工具 · 平台八层；不引控制面。
[package]
name = "backend-observe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[features]
# 只给上层测试用的那几样：上层的 `[dev-dependencies]` 开它。
test-support = []

[dependencies]
backend-assets = { path = "../assets" }
backend-accounts = { path = "../accounts" }
backend-agents = { path = "../agents" }
backend-history = { path = "../history" }
backend-host = { path = "../host" }
backend-wire = { path = "../wire" }
backend-common = { path = "../common" }
backend-platform = { path = "../platform" }

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
