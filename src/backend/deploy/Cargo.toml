[package]
name = "deploy"
version = "0.1.0"
edition = "2021"
workspace = ".."
description = "装 / 升级远端后端的判定与编排：计划（那台要哪一格 · 落点那一份是谁 · 只升不降 · 残件）· 常驻那一份旧不旧 · 手机那一趟装（取字节自检 · 放 ＋ 读回 · 收拾）。桌面（后端答 deploy-plan）与手机（mobcore）同一份。"

# 与 ssh-dial 并列，住后端那棵 workspace（`../Cargo.toml` 的 `[workspace] members`）：同一份 lock、同一个打补丁版 russh。
# 在后端源码树里（`src/backend/`）⇒ 只读 · 远端写只许 ssh-dial/sftp.rs · 零定时器这几族扫描型判据照旧管到这里。
# 只依赖两份契约（deploy-contract · relay-route-core）与拨号核心；monitor 不链它（判定类，monitor 生产段只许契约类）。
[lib]
path = "lib.rs"

[dependencies]
ssh-dial = { path = "../ssh-dial" }
deploy-contract = { path = "../../common/deploy-contract" }
relay-route-core = { path = "../../common/relay-route-core" }
copy-core = { path = "../../common/copy-core" }
cmd-wire = { path = "../../common/cmd-wire" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
# 合成 SFTP 服务端（`ssh_dial::sftp::rig`）：手机那一趟装的判据在它上面跑。
ssh-dial = { path = "../ssh-dial", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
