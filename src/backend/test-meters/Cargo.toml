# 测试档的量具（只在各包的 `[dev-dependencies]`）：线程级内存量具 · 金样比对 · 听 `tracing` 说了什么。不引后端里任何一层。
[package]
name = "test-meters"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
# 金样落在仓根下（`repo_root()`）。
guard-core = { path = "../../common/guard-core" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# 测试档的家一开始就是沙箱（判据碰不到这台用户的真家）。
test-home = { path = "../../common/test-home" }
