[versions]
# --- 构建工具链（几项须互相兼容）---
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.12"
# --- AndroidX / Compose ---
# composeBom / coreKtx / material 与 termlib 0.1.2 的传递依赖对齐：termlib 经 core-terminal 的 api(...)
# 带进这几个版本，Gradle 取高版本，所以这里写的就是实际解析值。
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
material = "1.14.0"
coroutines = "1.11.0"
# --- DI（Koin：纯 Kotlin 运行时 DI，无 codegen，不与 Kotlin/KSP 版本耦合）---
koin = "4.2.2"
# --- 测试 ---
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
# --- 功能库 ---
room = "2.8.5"
moshi = "1.15.2"   # 运行时与 KSP 生成器同一版（core-claude 的线上类走生成的解码器）
jlatexmath = "0.2.0"   # 正文公式画成图（ru.noties 的 Android 版 JLaTeXMath）
tink = "1.24.0"
# termlib 0.1.2：带捏合缩放持久化、竖滑照桌面终端处理滚轮的规矩走（鼠标上报 → 滚轮 · 备用屏 → 方向键 · 否则回滚区）的改动版，从仓内 maven 仓 libs/m2 解析
# （见 settings.gradle.kts），不在 Maven Central。
termlib = "0.1.2"
# --- 风格与静态分析 ---
ktlint = "12.1.1"     # jlleitschuh gradle 插件版本
ktlintTool = "1.3.1"  # ktlint 引擎版本（插件实际运行的 ktlint；根 build 从这里读）
detekt = "2.0.0-alpha.5"   # K2 类型解析（dev.detekt 命名空间）；1.x 的 K1 前端在 Kotlin 2.3 上会崩

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Compose UI 测试。版本走 compose BOM（不写 version.ref），与同族的 androidx-ui-* 一致。
# ui-test-manifest 要 debugImplementation（它提供测试用的空 Activity manifest 条目）。
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# GrantPermissionRule：预授权 POST_NOTIFICATIONS。否则 API 33+ 上系统权限弹窗抢前台，Compose UI 测试拿不到 compose 树。
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
connectbot-termlib = { group = "org.connectbot", name = "termlib", version.ref = "termlib" }
jlatexmath-android = { group = "ru.noties", name = "jlatexmath-android", version.ref = "jlatexmath" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" } # 纯 JVM 模块（core-claude · core-wire · core-copy · detekt-rules）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
