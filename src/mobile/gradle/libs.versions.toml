[versions]
# --- 构建工具链（几项须互相兼容）---
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.9"
# --- AndroidX / Compose ---
# composeBom / coreKtx / material 与 termlib 0.1.1 的传递依赖对齐：termlib 经 core-terminal 的 api(...)
# 带进这几个版本，Gradle 取高版本，所以这里写的就是实际解析值。
coreKtx = "1.18.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.05.01"
navigationCompose = "2.8.5"
material = "1.14.0"
coroutines = "1.9.0"
# --- DI（Koin：纯 Kotlin 运行时 DI，无 codegen，不与 Kotlin/KSP 版本耦合）---
koin = "4.2.2"
# --- 测试 ---
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
# --- 功能库 ---
room = "2.8.4"
moshi = "1.15.1"
markwon = "4.6.2"
prism4j = "2.0.0"   # 语法高亮：Prism4j（io.noties）；bundler 是 Java 注解处理器
tink = "1.17.0"
sshj = "0.39.0"     # 已含 Terrapin 修复
bouncycastle = "1.84"   # SSH 认证与密钥解析用的 crypto provider
# termlib 0.1.1：带捏合缩放持久化与 alt-screen 滚轮上报的改动版，从仓内 maven 仓 libs/m2 解析
# （见 settings.gradle.kts），不在 Maven Central。
termlib = "0.1.1"
# --- 风格与静态分析 ---
ktlint = "12.1.1"     # jlleitschuh gradle 插件版本
ktlintTool = "1.3.1"  # ktlint 引擎版本（插件实际运行的 ktlint；根 build 从这里读）
detekt = "2.0.0-alpha.5"   # K2 类型解析（dev.detekt 命名空间）；1.x 的 K1 前端在 Kotlin 2.3 上会崩

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Compose UI 测试。版本走 compose BOM（不写 version.ref），与同族的 androidx-ui-* 一致。
# ui-test-manifest 要 debugImplementation（它提供测试用的空 Activity manifest 条目）。
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# GrantPermissionRule：预授权 POST_NOTIFICATIONS。否则 API 33+ 上系统权限弹窗抢前台，Compose UI 测试拿不到 compose 树。
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
bouncycastle-prov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
connectbot-termlib = { group = "org.connectbot", name = "termlib", version.ref = "termlib" }
# Markwon —— Markdown 渲染（View 系，经 AndroidView 进 Compose）。代码块语法高亮见下方 Prism4j。
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-ext-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-ext-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }
# 代码块语法高亮：syntax-highlight(Markwon) + Prism4j；bundler 用 annotationProcessor(Java APT)，不引 kapt。
markwon-syntax-highlight = { group = "io.noties.markwon", name = "syntax-highlight", version.ref = "markwon" }
markwon-ext-latex = { group = "io.noties.markwon", name = "ext-latex", version.ref = "markwon" } # LaTeX 数学（传递 JLaTeXMath）
prism4j = { group = "io.noties", name = "prism4j", version.ref = "prism4j" }
prism4j-bundler = { group = "io.noties", name = "prism4j-bundler", version.ref = "prism4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" } # 纯 JVM 模块（core-claude、core-remote）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
