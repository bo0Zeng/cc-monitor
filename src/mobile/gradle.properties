# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Non-transitive R classes (smaller, faster)
android.nonTransitiveRClass=true
# 工程路径可能含非 ASCII。本仓没有 NDK/CMake 构建（termlib 是预编译 AAR），非 ASCII 路径的主要风险不在，
# 所以用官方 override 关掉路径检查。遇到路径相关的怪构建失败，把工程移到纯 ASCII 路径。
android.overridePathCheck=true
# Parallel + caching
org.gradle.parallel=true
org.gradle.caching=true
# JAVA_HOME for Gradle is provided by the activated shell (scripts/env.sh / env.ps1) or local.properties;
# do NOT hardcode here so the isolated JDK 21 is used without polluting global.
# 项目级缓存不落在源码树里（与 build.gradle.kts 里 buildDirectory 同理，落仓根 .build/mobile/）。
org.gradle.projectcachedir=../../.build/mobile/.gradle
