# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Use AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Non-transitive R classes (smaller, faster)
android.nonTransitiveRClass=true
# 工程路径可能含非 ASCII。本仓没有 CMake 构建（termlib 是预编译 AAR；Rust 核心由 cargo 编、NDK 只给它 clang 与链接器），
# 非 ASCII 路径的主要风险不在，所以用官方 override 关掉路径检查。遇到路径相关的怪构建失败，把工程移到纯 ASCII 路径。
android.overridePathCheck=true
# Parallel + caching
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：没改构建脚本的那几趟跳过配置阶段（--no-daemon 下每趟都是冷 JVM）；落在下面 projectcachedir 里（各工作树一份）。
# 构建缓存（上一行）用 gradle 家里那份几棵树共用的：新开的树头一趟靠它命中别的树编过的任务。
org.gradle.configuration-cache=true
# JAVA_HOME for Gradle is provided by the activated shell (scripts/env.sh / env.ps1) or local.properties;
# do NOT hardcode here so the isolated JDK 21 is used without polluting global.
# 项目级缓存不落在源码树里（与 build.gradle.kts 里 buildDirectory 同理，落仓根 .build/mobile/）。
org.gradle.projectcachedir=../../.build/mobile/.gradle
# 手机嵌的 Rust 核心用的 NDK（门禁 `androidbuild` 那一格与手机构建读同一行）。
ccm.ndkVersion=27.3.13750724
# 每个构建类型只出一个 ABI（`:core-rs` 只为它编那一个 target，`:app` 的 abiFilters 读同一行；两个 ABI 从不在同一趟里编）：
#   release（发出去的包，真机也用它）= arm64-v8a；debug（模拟器 · androidTest · 冒烟，本机模拟器是 x86_64）= x86_64。
ccm.abi.release=arm64-v8a
ccm.abi.debug=x86_64
#   minified（混淆过的包、调试签名，只给冒烟装进模拟器）= x86_64。
ccm.abi.minified=x86_64
