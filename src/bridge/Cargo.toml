# G2（Phase G 代码工程审计）：**这六个 crate 此前不是真 workspace member。**
# 实测 `cargo metadata` 的 `workspace_members` 只有 `monitor` 一项 —— `cargo test -p branch-core`
# 之所以能跑，靠的是 cargo 允许 `-p` 选中**依赖图里的非 member 包**，不是 workspace 机制。
# 代价：门禁得在八个地方分别跑（~17 条 `--manifest-path`/`-p`），且每个 crate 单独 test 时
# 会各落一个游离 `Cargo.lock`（`.gitignore` 为此打过补丁）。
#
# ⚠ `vendor/code-picture-core` **刻意 exclude**：它是 vendor 进来的第三方内核，
# 不该被 `--workspace` 的 fmt/clippy/test 扫到（也不该因为我们的 lint 设置而红）。
# ⚠ `src/backend` **不在这里** —— 它有自己独立的 `Cargo.lock`，
# 那条隔离是真架构约束（Linux/Windows CI runner），见它自己的 `Cargo.toml` 头注。
[workspace]
members = [
    ".",
    "crates/acct-core",
    "crates/branch-core",
    "crates/creds-core",
    "crates/gate-core",
    "crates/guard-core",
    "crates/search-core",
    "crates/shell-quote-core",
    "crates/codex-token-core",
]
exclude = ["vendor/code-picture-core"]

[package]
name = "monitor"
version = "3.8.1"
description = "cc-monitor — Claude Code 的开发工作台：只读渲染会话输出 + 本机/远端会话管理 + 代码全景 + skill 接入面（Tauri 2 + TypeScript，Windows / Linux）"
authors = ["cc-monitor contributors"]
edition = "2021"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/local/cc-monitor"
homepage = "https://github.com/local/cc-monitor"
keywords = ["claude", "claude-code", "monitor", "tauri", "viewer"]
categories = ["development-tools", "visualization"]

[lib]
name = "monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon feature 实际没用（前端不调系统托盘 API），移除以减小依赖体积。
# 未来若加托盘菜单，重新启用 features = ["tray-icon"] 即可
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Batch14-F42：turn-end 系统通知（Windows toast / Linux notify）
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F62：从历史某轮创建分支（写 <new-sid>.jsonl）时生成新 sessionId。
# uuid 1.x 已在 Cargo.lock（tauri 传递依赖）+ 本地 registry 缓存，加 v4 feature 离线可编。
uuid = { version = "1", features = ["v4"] }

# Batch15-P0：code-picture 代码全景可视化内核（vendor 进仓,见 vendor/code-picture-core/VENDOR.md）。
# 只读查询 + tree-sitter 符号索引 + rusqlite(bundled) 侧车索引;引 crate use Engine(不走 MCP)。
code-picture-core = { path = "vendor/code-picture-core" }
# G1（branch-anywhere）：分叉的记录变换，与远端后端共用同一份实现。
branch-core = { path = "crates/branch-core" }
codex-token-core = { path = "crates/codex-token-core" }
acct-core = { path = "crates/acct-core" }
# K-H2a：第三方 API key 的唯一住址（类型 / 落盘格式 / 权限判断），与远端后端共用。
# ★ `features = ["harden"]` —— **monitor 是唯一会写这份文件的一侧**，所以只有这里开它。
# backend 那侧刻意**不开**（`K-H2a` 裁四：backend 只许读；`readonly_guard.rs` 扫它的生产段
# 断言不含任何文件系统变更调用，白名单恰好一个模块 `control/fork_write.rs`）。
# ⇒ 「backend 写不了这份文件」是**编译器**兜的，不是一条判据兜的。
creds-core = { path = "crates/creds-core", features = ["harden"] }

# P4c：**POSIX 单引号 quote 的唯一 Rust 实现**（P4b 之前叫 `launch-core`，那时它还持有
# 载荷编译器与 ccm 调用行的决策内核 —— 那两样 P4b 已归位 `src/backend/control/`）。
# ⚠ 原注释说「backend 侧刻意还没加这条依赖」已经过期两轮：U8c-2b-0 起后端的
# `control/tmux_hook.rs::sq` 就在调它，那也是它今天唯一的后端用量。
shell-quote-core = { path = "crates/shell-quote-core" }
# F03：**§34 Gate 2（identity）的唯一实现**——「这个 tmux 会话是不是本工具管的」。
# monitor 与后端共用同一份判定（定框 C1），防「把 send-keys/kill 搬进后端时静默丢掉一道门」。
gate-core = { path = "crates/gate-core" }

# K-R100：**历史全文搜索口径的唯一实现**（12 个同名助手 + 4 个口径常量 + snippet 预算）。
# 收口前 monitor `src/search.rs` 与 backend `observe/search_query.rs` 各写一遍，逐字相同、
# 零判据对拍 —— 「今天没漂」不是保障。判据住 `search.rs::the_search_kou_jing_has_exactly_one_home`。
search-core = { path = "crates/search-core" }

notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"

# SSH-remote Phase 0 (issue #15) S3：先证明 russh 能在 windows-msvc 下编译 + LTO 链接。
# 默认 crypto backend 是 aws-lc-rs（需 NASM/cmake，windows 上易失败）；
# 改用 default-features=false + ring 纯 Rust/汇编后端规避（见 ssh_source.rs 顶部注释）。
# flate2/rsa 是 russh 默认开的非 crypto-backend feature，手动保留以维持等价行为。
russh = { version = "0.61.1", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP 写（issue #29 自动部署 / #28 后续）：russh-sftp 是 transport-agnostic（吃 channel
# 的 AsyncRead+AsyncWrite 流），与 russh 版本解耦——只需 request_subsystem("sftp") 后把
# channel.into_stream() 交给它。
# 🔴〔步 23b · 2026-09-19〕**2 → 3**：`设计/60 §6.5.3` 现打核过 5 个候选，选定的是
# `russh-sftp` **3.0.0**（Apache-2.0，非 GPL —— 用户 2026-09-19 的「不要 GPL」这一条现打核过）。
# 那一节里全部的论证都是对着 3.x 做的（传输泛型 `new<S>` · `tokio` 不开 `net` feature
# ⇒ 它结构上开不了 socket，传输只能由调用方喂）。换版本掉回去会被
# `tests/bridge/sftp_tests.rs::the_sftp_dependency_is_really_on_russh_sftp_three` 逮住。
# ⚠ **现打复核过一条不变的事实**：3.0.0 **仍然无** posix-rename@openssh 扩展
# （2.3.0 与 3.0.0 两份源码里 `posix-rename` 零命中）⇒ sftp.rs 的近似原子写
# 「写 .tmp → 旧目标 rename 成 .bak → rename → 清 .bak」**这一版照旧成立，不许当成已解决**。
russh-sftp = "3"
# 版本钉死规避 pre-release 解析地雷：russh 的 ECDSA 走 p256/p521 0.14.0-rc.9，
# 它们要 primefield 0.14.0-rc.9。但 cargo 默认会在 0.14.0-rc.* 区间内取最新
# = primefield 0.14.0-rc.10（2026-06-04 刚发），rc.10 改了 ff trait 拆分
# （primefield::ff::Field vs elliptic_curve::Field），与 rc.9 的 p256/p521 不兼容
# → p256/p521 编译失败（E0277 FieldElement: elliptic_curve::Field not satisfied）。
# 我们不直接用 primefield，这里仅作为 resolver 杠杆把它钉回 rc.9。
# 详见 ssh_source.rs 顶部 crypto-backend 注释 + issue #15 S3 报告。
primefield = "=0.14.0-rc.9"

tokio = { version = "1", features = ["full"] }
# 远端 fan-out 并发（R9）：join_all 同时查所有已配置远端，借用不需 'static/Send。
# 已在 lockfile（russh 传递依赖），此处提升为直接依赖。
futures = "0.3"
parking_lot = "0.12"

dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# v2.0.0 issue #4：滚动 log 文件 + non_blocking writer，给 GUI app（无 stderr）一个用户可见的诊断通道
tracing-appender = "0.2"

# 🔴〔步 24e · 2026-09-20〕**原生文件管理窗口**（`设计/60 §4 戊` · `§5` 第三段）。
# 框架定案 egui 的读数住 `真相源/99`；许可 `MIT OR Apache-2.0`，与「不要 GPL」不冲突。
#
# ⚠ **为什么这两条依赖挂在 `monitor` 上，而不是一个新 crate** —— 两条独立的理由，
#    都不是省事（详细论证与现打依据住 `src/filewin/mod.rs` 的头注）：
#  ① **进程形态定的是「同进程」**：窗口要直接调 `sftp_pool` 的那些函数，
#     而那个池是 `sftp_pool.rs:539` 的**进程级 `OnceLock`** ⇒ 换进程 = 换一份池
#     = 同一台远端第二条 SSH 连接，秤 F4 钉的「6 通道 − 4 车道 = 2」会被悄悄变成两份预算。
#  ② **门禁 `cargo` 那一格把 workspace 包数**恒等**钉在 9**（`tests/scripts/gate.sh:1351`
#     的 `run_gate_sum cargo 9`）。新增一个 workspace 成员 ⇒ 那一格当场红，
#     而那个 `9` 住 `gate.sh`，**不在 24e 的写区** ⇒ 不许为了塞一个 crate 去动判据。
#     ⇒ 落成 `monitor` 自己的一个模块，包数不动。
#
# ⚠ **代价如实记**：这两条把依赖树从 679 个包推到约 1080 个（winit / wgpu / naga / accesskit
#    一大片）。现打核过它编得过的三档（`cargo check`）：
#      · 宿主 `x86_64-unknown-linux-gnu`     ✅
#      · `x86_64-pc-windows-gnu`（门禁 winchk 那一格用的 target）✅ 31.97 秒
#      · `x86_64-unknown-linux-musl`          ✅（只是 `check`，不是静态链接）
#    ⚠ `muslbuild` 那一格的射程是 `src/backend`（`gate.sh:1117` 逐字 `cd src/backend`）
#      ⇒ 本条依赖**碰不到它**；「GUI crate 能不能 musl 静态链接」这个设计题**没被本刀回答**。
egui = "0.36"
# 🔴 **渲染后端必须是 `glow`，不能用 eframe 默认的 `wgpu`** —— 理由是现打出来的编译失败，
#    不是口味。**这一条别顺手改回默认。**
#
# ## 为什么：`wgpu` 那条路在本仓交叉编译到 Windows 时**编不过**
#
# 门禁 `winchk` 那一格跑 `cargo check --locked --all-targets -p monitor
# --target x86_64-pc-windows-gnu`。带默认 feature（`wgpu`）时它**红**，10 条类型错全在
# `wgpu-hal` 的 DX12 后端上（`expected ID3D12Device, found Direct3D12::ID3D12Device` 这一形）。
#
# 病根不在 wgpu，在**本仓已经钉着两个 `windows` 大版本**：
#   · `gpu-allocator 0.28` 的 spec 是 `windows = ">=0.53, <=0.62"`（**很宽**）
#     ⇒ cargo 拿本仓现成的 **`windows 0.56`** 就把它满足了；
#   · 而 `wgpu-hal 30.0.1` 自己用 **`windows 0.62`**。
#   ⇒ 同一段 D3D12 代码里 `ID3D12Device` / `ID3D12Heap` 来自**两个不同的 `windows` crate** ⇒ E0308/E0277。
# ⚠ 这个组合在一个干净的独立工程里**不出现**（那里没有 0.56/0.61，gpu-allocator 直接拿 0.62）
#   —— 它是**本仓特有**的，因为 `windows 0.56`（项目自用）与 `windows 0.61`（`windows-wv2`）已经在树上。
#
# ⇒ 换 `glow`：`cargo tree -i wgpu` 确认 `wgpu` 整棵离开**构建图**，`winchk` 现打 **rc=0**。
# ⚠ 代价：OpenGL 而非 Vulkan/D3D12。对一个文件列表够用。**没在真 GPU 上比过两者**。
#
# ## ⚠ 它**没有**顺带解决的那条（别把两件事混起来）
#
# 门禁 `cargo` 那一格仍然红，红在 `lockfile_conflict_guard` 上：
# `cfg_aliases` 在 monitor 是 **0.2.2**、在 `src/backend/Cargo.lock` 是 **0.2.1**。
# 逐个 manifest 现打：`winit` 与 `glutin` 都只要 `^0.2.1`，**只有 `wgpu` 要 `^0.2.2`**——
# 而 **`Cargo.lock` 记的是所有 feature 的并集**，`egui-wgpu` 作为 eframe 的可选依赖仍留在 lock 里，
# 把 `^0.2.2` 一起带着 ⇒ 换后端**改不了 lock**，`cargo update -p cfg_aliases --precise 0.2.1` 照样失败。
# ⇒ 那条只有两条真出路，**都不在 24e 的写区，所以停下报备、不自作主张**：
#   ① 把 `src/backend/Cargo.lock` 的 `cfg_aliases` 抬到 0.2.2（它只是 `nix` 的 build-dependency，
#      纯构建期、零运行时面）——**改的是 `src/backend/`**；
#   ② 不用 `eframe`，自己拼 `egui-winit` ＋ `egui_glow` ＋ `glutin`（scratchpad 现打：
#      那样 `wgpu` 从 lock 里彻底消失、`cfg_aliases` 钉得回 0.2.1、总包数 308）——
#      但那是为了躲一行 lockfile 自己重写一遍 eframe 的集成层，是「硬绕」，得先有人拍板。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
# `winit` 是 `eframe` 的传递依赖，这里**提升为直接依赖**，只为一件事：
# `EventLoopBuilderExtX11` / `ExtWayland` / `ExtWindows` 这三个**平台扩展 trait**
# —— `eframe` 只 re-export 了 `EventLoopBuilder` 本体（`epi.rs:26`），没 re-export 它们，
# 而「egui 窗口跑在次线程」全靠它们的 `with_any_thread(true)`（见 `src/filewin/mod.rs` 头注）。
# ★ **版本漂了会怎样：编译器当场报错，不需要额外判据。**
#   若本条与 `eframe` 解析到两个不同的 winit 大版本，那三个 trait 就不再实现在
#   `eframe::EventLoopBuilder` 上 ⇒ `filewin::shell` 的 hook 编不过。
winit = "0.30"

[dev-dependencies]
# C01（rust-ts-boundary）：**故意只在 dev 侧**。`ts-rs` 是 codegen 工具，
# 导出本来就走 `cargo test`（`#[ts(export)]` 生成的是一个测试），
# 所以它没有理由进发布二进制。派生用 `#[cfg_attr(test, ...)]` 挂在 test cfg 上。
#
# **这是个会被复制 127 次的策略决定**（Phase D 审计 I4 点出），所以现在定比 C04 再定便宜。
# 供应链增量本来就小（`ts-rs` + `ts-rs-macros` + `termcolor`，后两者是 proc-macro/构建期），
# 但「codegen 工具不进产物」是正确的依赖方向。
ts-rs = "12.0.1"
# U8a-2a：源码扫描型守卫的「只留生产段」剥法，与远端后端共用同一份。
# **必须是 dev-dependency** —— 守卫全在 `cfg(test)` 里，它没有理由进发布二进制。
# 起因：monitor 侧的守卫此前各写便宜近似（`split("\n#[cfg(test)]").next()`），
# 那个近似在 `ssh_source.rs` 上会把扫描面砍掉三分之二（详见 guard-core 头注）。
guard-core = { path = "crates/guard-core" }

[target.'cfg(windows)'.dependencies]
# v1.7.0：cc 注入式绑定恢复 ToolHelp（claude.exe 的 parent_pid 反查 PS） +
# UI_WindowsAndMessaging（EnumWindows 找 title marker、SetForegroundWindow 拉前）。
# ProcessStatus 仍不需要（v1.6 拉前算法时也没真用）。
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # ccbus-win 09-10 第七拍：`cc_bus::reap_whole_tree_on_drop` 要 Job Object
    # （`CreateJobObjectW` / `SetInformationJobObject` / `AssignProcessToJobObject`）。
    # 起因是一条有云端读数的真缺陷：Windows 上 `Git\bin\bash.exe` 是外壳，起完真 bash
    # 自己就退，`kill_on_drop` 的 `TerminateProcess` 打在一个已经死了的 pid 上 ⇒
    # 每次本机读超时（以及「读够了就掐断」那条常规路径）都漏下一个真 shell 进程。
    # ⚠ **不新增 crate**，只是把这个已在依赖里的 crate 的一个模块打开 ——
    #   本机现打确认（`cargo check -p monitor --target x86_64-pc-windows-gnu`）：
    #   不加这一行时 `windows::Win32::System::JobObjects` 是 `E0432 unresolved import`，
    #   编译器自己指出「the item is gated behind the `Win32_System_JobObjects` feature」。
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
    # v2.4.2 issue #2: keybd_event 模拟 Alt 按键让 OS 视当前进程为
    # "刚有用户输入"，配合 AttachThreadInput 突破 Win10/11 前台抢焦限制。
    "Win32_UI_Input_KeyboardAndMouse",
] }
# K-H2a `KS5`：`Win32_Security` / `Win32_Security_Authorization` 两个 feature **不加在这里**。
# 用到它们的 Win32 调用（设 / 读凭据文件的 DACL）住 `crates/creds-core`——
# 那是「一个安全性质只许有一个实现」的落点（`K-H2a` 裁三），monitor 与后端共用同一份。
# 本 crate 只是它的**调用点之一**（`src/platform_fs.rs`），不直接碰 Win32。
# ⚠ cargo 对同一版本的 `windows` 做 feature 合并 ⇒ 本 crate 的构建里那两个 feature 事实上是开的，
# 但**声明住在真正用它的那个 crate**，别在这里重复一份（两处声明 = 下一个漂移源）。
# issue #9：single-instance lock。第二个 cc-monitor 实例启动时立即退出，
# 第一个窗口拉到前台。Tauri 官方 plugin，user-scoped mutex，跨 user session 不冲突。
tauri-plugin-single-instance = "2"
# F12 nudge 加固：resize 稳定后直接调 WebView2 controller COM 接口
# （SetBounds / NotifyParentWindowPositionChanged / SetIsVisible）修合成层错位。
# RECT/BOOL 参数类型必须来自 wry 依赖树里 webview2-com 0.38 配对的 windows 0.61
# ——与上面项目自用的 windows 0.56 **类型不互通**，故 package rename 引入；
# 版本收敛到 lock 里已有的 0.61.3，不新增依赖树条目。
windows-wv2 = { package = "windows", version = "0.61", features = ["Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
