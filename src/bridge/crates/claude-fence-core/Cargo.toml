[package]
name = "claude-fence-core"
version = "0.1.0"
edition = "2021"
description = "「哪些路径是 Claude 自己的数据，不许我们写」那一个判定 ＋ 它的拒绝。monitor 与 backend 共用 —— 用户 2026-09-22 裁定后端可在显式操作下写用户选的路径，而那道围栏必须由**拥有那份数据的那台机器**执行 ⇒ 判定要在两侧都够得着，而它只许有一个家。"

# **零依赖**，与 shell-quote-core / branch-core 同一条约束：
# backend 是 Linux-only 的静态 musl 二进制、且刻意不在 monitor 的 workspace 里，
# 一旦引入平台相关的东西，共享就破了。
# 🔴 而本 crate 还多一条自己的理由：它的全部语料是**一个路径字符串**，
# 没有连接、没有 IO、没有 async ⇒ 「这道围栏够不着线」这件事由它的依赖表本身担保。
[dependencies]
