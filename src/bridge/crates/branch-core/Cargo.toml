[package]
name = "branch-core"
version = "0.1.0"
edition = "2021"
description = "会话分叉：按 sid 找那份会话文件 + 记录变换——两侧共用的唯一一份（无平台依赖；IO 只有一处只读的目录枚举，K-R88）。"

# **依赖只有 serde_json，这是本 crate 能被两侧共用的前提。**
# backend 是 Linux-only 的静态 musl 二进制、且刻意不在 monitor 的 workspace 里；
# 一旦这里引入 tauri / tokio / 平台相关的东西，共享就破了。
[dependencies]
serde_json = "1"
# 〔DUP1〕sid 形状的唯一一份住 `shell-quote-core::session_id_ok`（`INVARIANTS §47` ①），本 crate 再导出它。同族共享 crate、零依赖。
shell-quote-core = { path = "../shell-quote-core" }
