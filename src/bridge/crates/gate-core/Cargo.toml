[package]
name = "gate-core"
version = "0.1.0"
edition = "2021"
description = "§34 Gate 2（identity）的唯一实现：一个 tmux 会话是不是本工具管的。monitor 与 daemon 共用同一份判定，防「搬进后端时静默丢掉一道门」。"

# **零依赖**，理由同 shell-quote-core：daemon 是 Linux-only 的静态 musl 二进制、
# 刻意不在 monitor 的 workspace 里；一旦引入平台相关的东西，共享就破了。
# 本 crate 只做**纯判定**：不起进程、不碰 tmux、不认识 shell。
# 「怎么去问远端 `@ccm_sid`」由两侧各自的承载负责（monitor 拼 shell 串、daemon argv 直传）。
[dependencies]
