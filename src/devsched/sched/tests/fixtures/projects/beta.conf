# 夹具项目配置：形状照 code-picture 那份
marker = crates/beta-core/Cargo.toml
remote_if =
need_cargo = (^|[[:space:]/])cargo[[:space:]]
local_if = (^|[[:space:];&|(])pb[[:space:]]|snapshot\.sh
rsync = -rlpD -c
exclude = .git target node_modules .env* *.key
build = target
env = CARGO_TARGET_DIR CARGO_INCREMENTAL LANE
data = /srv/corpus
siblings = /srv/beta-sib
sccache = 0
   trailing   =   spaced value
