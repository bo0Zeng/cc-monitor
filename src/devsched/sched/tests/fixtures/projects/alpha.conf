# 夹具项目配置：形状照 cc-monitor 那份
marker = tests/scripts/quick-check.sh
remote_if = cargo[[:space:]]+(\+[^[:space:]]+[[:space:]]+)?(test|clippy|check|nextest)([[:space:]]|$)|tests/scripts/quick-check\.sh
local_if = cargo[[:space:]]+(\+[^[:space:]]+[[:space:]]+)?(build|run|install|doc|bench)([[:space:]]|$)|--no-run|--target|gradle|(^|[[:space:];&|(])(node|npm|npx|tmux)[[:space:]]|bless|export_bindings|--only[[:space:]]+(mobile|win-check)
need_cargo = (^|[[:space:]/])cargo[[:space:]]
need_gui = frontend/shell|quick-check\.sh
need_tmuxnew = cargo[[:space:]]+(\+[^[:space:]]+[[:space:]]+)?(test|nextest)([[:space:]]|$)|quick-check\.sh
need_node = quick-check\.sh
need_own = bless|export_bindings
heavy_if = gradle|--only[[:space:]]+mobile
heavy_prefix = nice -n 19 ionice -c3 env GRADLE_OPTS=-Dorg.gradle.workers.max=8
local_sh = 1
sh_ok = session-scrub.sh quick-check.sh
git = 1
mirror = _mirror.git
seed =
rsync = -a
sync =
exclude = .git node_modules /.build target .env* *.key *.pem *.p12 id_* .ssh/ .claude/ .cc-monitor/ /accounts/ credentials* *.secret .planned-build/
pull =
pulldirs = .build/quick-check
build = .build
out_env = ALPHA_OUT
env = CARGO_INCREMENTAL RUSTC_WRAPPER CC
data =
prio_env = ALPHA_PRIO
local_env = ALPHA_LOCAL
