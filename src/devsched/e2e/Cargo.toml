[package]
name = "devsched-e2e"
description = "开发调度端到端：调度端的库经真管道拉起编译节点"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# 测试要找编译节点的二进制：CARGO_BIN_EXE_* 只认本包的 bin ⇒ 这里带一个只转调 devsched_node::main 的
#   （名字跟编译节点自己的 devsched-node 错开，免得同一工作区两个包产出同名文件）。
[[bin]]
name = "devsched-node-e2e"
path = "src/bin/devsched-node-e2e.rs"

[dependencies]
devsched-node.workspace = true

[dev-dependencies]
devsched-sched.workspace = true
devsched-wire.workspace = true
devsched-policy.workspace = true

# 测试住仓根 tests/ 的同形位置（仓里的守卫只剥 #[cfg(test)] mod，src/ 下整份测试会被当生产段扫）
[[test]]
name = "pipe"
path = "../../../tests/devsched/e2e/pipe.rs"
