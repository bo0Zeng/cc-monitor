[package]
name = "code-picture-core"
version = "0.1.0"
edition = "2021"
description = "code-picture 只读内核:tree-sitter 符号索引 + git 锚点 + SQLite。跨平台、无 Tauri 依赖。"

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
# 多语言 grammar(F11 一次加全;F11 只接线 Rust,F12–F14 逐族实现分类)
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 线上类型的 TypeScript 声明(生成物 `src/wire.ts`)由测试写出 ⇒ codegen 工具**只在 dev 侧**:
# 派生挂在 `#[cfg_attr(test, …)]` 上,发布构建与下游(path 依赖本 crate 的消费方)都不编它。
ts-rs = "12.0.1"
