[package]
name = "cc-monitor-panorama"
# 〔RM1c · 第四波〕只装代码全景引擎的**独立小程序**（用户 09-24 V108 选 B）。
#
# 它是什么：vendored `code-picture-core` ＋ 一问一答的 JSON CLI（argv 进、stdout 一行 JSON 出）。
# 谁起它：那台机器上的后端，经插件通用调用口（`src/backend/plugin/`）按需起；
#        后端本体**仍零** code-picture（`C21`「也不编进 backend」· `95 §0`「不并进后端本体」照旧）。
#
# ⚠ 版本号只进 `--probe` 的 `version=` 那一行（插件口那套方言：**只进诊断文案、不参与判断**），
#   能不能用按 `capabilities=` 逐个 op 查，不比版本号。
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate，**刻意不进任何 workspace**（同 `src/backend` 那条理由）：
# 它按目标平台单独编、单独随后端部署；拖进 `src/bridge` 那个 workspace 等于让 monitor 的
# `cargo test --all` 替它背那 11 棵 C 构建树（9 门 grammar ＋ tree-sitter ＋ SQLite）。
#
# 🔴 住址**不许**是 `src/common/`：`panorama_locus_guard` 正题④ —— 两棵树都 path 依赖
# 那个目录下的共享 crate，往那里放一个链引擎的包 = 同时给两个地址空间装上引擎。
# 本 crate 自己一份 `Cargo.lock`（第三份 lock），登记在 `panorama_locus_guard::LOCKS`
# 与 `ENGINE_LINKED_BY` —— 「引擎被链进了哪几个地址空间」这句话的账面形态。

[[bin]]
name = "cc-monitor-panorama"
path = "main.rs"

[dependencies]
# 副本是上游的镜子，不是分身（`VENDOR.md`）：本 crate 只**用**它，一个字不改它。
code-picture-core = { path = "../bridge/vendor/code-picture-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 源码扫描型判据的「只留生产段」剥法 —— 全仓一份（`structural_scan` 的「剥注释实现只许一份」）。
guard-core = { path = "../common/guard-core" }

