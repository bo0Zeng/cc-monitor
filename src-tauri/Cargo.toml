[package]
name = "monitor"
version = "2.0.0"
description = "cc-monitor — Claude Code CLI 的只读输出渲染窗口（Tauri 2 + TypeScript，Windows）"
authors = ["cc-monitor contributors"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/local/cc-monitor"
homepage = "https://github.com/local/cc-monitor"
keywords = ["claude", "claude-code", "monitor", "tauri", "viewer"]
categories = ["development-tools", "visualization"]

[lib]
name = "monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon feature 实际没用（前端不调系统托盘 API），移除以减小依赖体积。
# 未来若加托盘菜单，重新启用 features = ["tray-icon"] 即可
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"

tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# v2.0.0 issue #4：滚动 log 文件 + non_blocking writer，给 GUI app（无 stderr）一个用户可见的诊断通道
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
# v1.7.0：cc 注入式绑定恢复 ToolHelp（claude.exe 的 parent_pid 反查 PS） +
# UI_WindowsAndMessaging（EnumWindows 找 title marker、SetForegroundWindow 拉前）。
# ProcessStatus 仍不需要（v1.6 拉前算法时也没真用）。
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
