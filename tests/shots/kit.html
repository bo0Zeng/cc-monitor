<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 通用组件总览（截图工具自己的页）：产品的层声明 · 重置 · 令牌，组件样式随组件的 CSS Modules 来 -->
    <link rel="stylesheet" href="/src/frontend/ui/styles/layers.css" />
    <link rel="stylesheet" href="/src/frontend/ui/styles/reset.css" />
    <link rel="stylesheet" href="/src/frontend/ui/styles/tokens.css" />
    <title>通用组件</title>
    <style>
      html, body { height: auto; overflow: visible; }
      body { background: var(--bg-2); padding: 20px 24px 40px; }
      .g-h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
      .g-sub { color: var(--text-2); font-size: 12px; margin: 0 0 16px; }
      .g-sec { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 14px 16px 16px; margin: 0 0 12px; }
      .g-sec > h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
      .g-sec > h2 span { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); font-weight: 400; }
      .g-grid { display: grid; gap: 10px 16px; align-items: start; }
      .g-cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; align-items: flex-start; }
      .g-cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }
      .g-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .g-stage { position: relative; width: 100%; border: 1px dashed var(--border-medium); border-radius: 8px; padding: 10px; background: var(--bg); }
      .g-bar { display: flex; gap: 8px; align-items: center; height: 28px; padding: 0 10px; background: var(--bg-2); border-radius: 6px; }
      .g-cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .g-cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .g-cols4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .g-cols6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .g-fake { color: var(--text-2); font-size: 13px; }
      .g-fake i { display: block; height: 10px; border-radius: 4px; background: #ffffff10; margin: 10px 0; }
    </style>
    <script type="module" src="/tests/shots/kit-gallery.ts"></script>
  </head>
  <body></body>
</html>
