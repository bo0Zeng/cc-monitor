# cargo-about 的配置（`tests/scripts/third-party-notices.py` 用）：收哪几种许可 · 按哪几个目标平台收依赖 · 不收开发期依赖。
# 目标平台 == 发版产出的那几样：Linux（壳 · deb · 本机后端）· 两个 musl 远端后端 · Windows。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
