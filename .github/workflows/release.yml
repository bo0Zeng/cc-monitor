name: Release

# 推 v* tag 时触发：
#  0. ci-gate：**同一个 commit 上的 CI 必须绿过**，否则后面一步都不起（R1，2026-09-09 加）。
#  1. build-backends (ubuntu)：用 cargo-zigbuild 交叉编译 aarch64 / x86_64 musl 远端后端，
#     作为 artifact 传给 Windows 作业 —— 让发布安装包内嵌后端、自动部署 (#29) 可用。
#     〔RM1c · 第四波〕同一个 job、同一条配方再编一件：只装代码全景引擎的独立小程序
#     （`src/panorama-engine`，V108 选 B），同进 `embedded-backends` 那个 artifact。
#  2. build-windows：下载后端放进 src/bridge/embedded-backends/ → cargo tauri build →
#     把 NSIS / MSI bundle 作为 GitHub Release 附件上传。
#  3. build-linux：同一批 backend artifact → tauri build --bundles deb → 追加进同一个 Release。
# 注意：默认 build 会尝试下载 WiX toolset 来打 MSI，若网络不稳定可临时改 --bundles nsis。
#
# ── 🔴 `19b`（2026-09-19）：**本文件是「产字节那条路」的唯一驱动** ─────────────────
#
# `设计/96 §7.1.2` 现打两条硬事实，它们是这一段存在的全部理由：
#  ① 三个落点（`embedded-backends/` · `binaries/` · `native-backend/`）**全部 gitignore**
#     ⇒ **字节不进仓**，它只在「发版那一趟」存在 ⇒ 表的值不是一个文件，是**一条产线**；
#     🔴 〔步 `19c` 订正 09-19〕**这一句在步 8（全仓改名 `daemon`→`backend`）到今天之间是假的**：
#     `src/bridge/.gitignore` 里还写着 `/embedded-daemons/` 与 `/native-daemon/`，
#     现打 `git check-ignore` **两条都不命中** ⇒ 三个落点里有两个从改名那天起就没被挡住。
#     本拍把那两行改对，并给它们加了机检锚（`K-R124-ruler.py` ⑬d 与 `build.rs` 的落点常量两向对拍）
#     —— 这句「硬事实」从此有人每趟核它。
#  ② 三条产线**只由本文件驱动**，而本文件只在推 `v*` tag / 手工触发时跑
#     ⇒ 平常的 `cargo build` 一格字节都没有 ⇒ **这张表的门禁只能建在本文件上，不能建在 `cargo` 上**。
#
# ── 🔴 `19c`（2026-09-19）：本文件有一个**本机孪生** ─────────────────────────────
#
# `tests/scripts/re-embed.sh` 是「`BUILD_ID` bump 的同拍步骤」：开发树上 bump 了
# `src/backend/lib.rs` 的 `const BUILD_ID` 之后，盘上那几份内嵌字节立刻变旧，
# `src/bridge/build.rs` 的半 bump 守卫当场 panic、**整棵树编不过**
#（2026-09-18 实地踩过一次，四路 agent 同时中）。那条命令把它们重编回来。
# 🔴 **它与本文件下面那两步是同一条配方，不是两条**：
#   · `Cross-compile backend for both musl targets` ↔ 脚本的 `REEMBED_TARGETS` ＋ `REEMBED_BUILD_FLAGS`
#   · `Build local backend (native)`（两个 job 各一处）     ↔ 脚本的 `--native` 那一趟
#   两侧由 `tests/evidence/K-R124-ruler.py` 的 ⑬b **每趟两向对拍**（target 集合相等 ＋ 旗标逐字相同）。
#   ⇒ **改本文件那几步的 target 或旗标，不同拍改那条命令，门禁当场红**（反过来也一样）。
# ⚠ **诚实边界**：本机那一趟买到的是「开发期自洽 ＋ 裸 exe 恢复部署能力」，
#   **不等于**本文件这一趟办完了 —— 形态不同（`build.rs` 自陈：static-pie / 未 strip / 不同 rustc），
#   工具链版本也未必是下面钉的那两个。
#
# ⚠ **条 63 承诺哪几格 ↔ 本文件哪几步产它们的字节** —— 那张表**不抄在这里**。
#   唯一住址：`tests/evidence/K-R124-ruler.py` 的 `BYTE_LINES`（承诺面那一侧它又是从
#   `tests/evidence/K-G4-platform-ledger.py::PROMISED` 导进去的，全仓只有那一份）。
#   本文件里每加/删/改名一个「编后端」的步骤，那份判据会**两向**红 —— 这是刻意的：
#   多一条没人登记的产线 ＝ 给一个**没承诺的平台**悄悄发了字节。
on:
  push:
    tags: ['v*']
  # ── KR114D1（`K-R114`，2026-09-14）：**手工触发**。 ─────────────────────────
  #
  # 在这之前本文件**只认 tag push**（`KU27` 登记的那条）⇒「先手工跑一趟看看」
  # **在构造上做不到**：想验一次本文件改得对不对，唯一的办法是真推一个 `v*` tag，
  # 而推错了要撤 tag、撤 release，还可能已经发到用户手上。
  #
  # 🔴 **加触发器的同时必须加一个「不发布」的开关** —— 否则手工触发就等于**误发一个版**，
  #    那比「触发不了」更贵：触发不了只是不方便，误发是发出去了收不回来。
  workflow_dispatch:
    inputs:
      publish:
        description: '把产物挂上 GitHub Release（true = 真发一个版）。默认 false = 只构建、不发布。'
        type: boolean
        default: false

# 🔴 **「这一趟发不发布」这个量只有这一个住址** ——
#    本文件里任何一处要问「该不该往 Release 上写东西」，一律读 `env.PUBLISH`，
#    不许各自再拼一遍 `github.event_name` / `inputs.publish`（同一个量两处各写一份，
#    正是 `ci-gate` 那段头注在治的病）。
#
# 语义（**fail-closed**）：只有 `push`（= 本文件唯一的 push 触发器：`v*` tag）
# 或者手工触发时**显式**把 `publish` 拨成 true，才算「要发布」。
# 将来若再加别的触发器，默认落在「不发布」那一侧 —— 那是刻意的方向。
#
# ⚠ 它守的是**「往 GitHub Release 写」**这一件事，**不是** job 之间传的
#   `actions/upload-artifact`（那份 `embedded-backends` 是内部件，不发给任何人，
#   而且 `build-windows` / `build-linux` 靠它才起得来）。
#
# ── 🔴 `19b`（09-19）：**「后端身份住哪份源码」这个量也只有这一个住址** ──────────────
#
# 本文件有**两步**要抠后端的 `const BUILD_ID`（内嵌校验那一步 · 版本对账那一步）。
# 步 9 把身份从 `main.rs` 搬到 `lib.rs` 时**只改了其中一步**，另一步留在 `main.rs` 上
# —— 而 `main.rs` 里今天**没有**那个 const ⇒ 那一步在真发版时抠回一个空值，
# 死在「抠不到后端的 const BUILD_ID」上，而红的原因与它要守的事毫无关系。
# ⇒ 收成一个 `env:`：两步都读它，**再也漏不掉第二处**。
# ⚠ 消费侧写成 `$env:CCM_BACKEND_IDENTITY_SRC`（两步都是 pwsh）。
# ⚠ 判据那一侧同拍钉住：`K-R124-ruler.py` 的 ⑩ 会把本文件里每一处抽取的路径解出来，
#   **实打去读那份文件**，抠不出恰好一个 const 就红 —— 住址指空这一形从此当场现形。
env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
  CCM_BACKEND_IDENTITY_SRC: src/backend/lib.rs

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # R1：**发版的第一道门 —— 这棵树的 CI 必须绿过。**
  #
  # 在这个 job 之前，本文件里**一条测试门都没有**（`cargo test` / `cargo clippy` /
  # `cargo fmt` / `npm test` / `npm run gate` / `tsc --noEmit` / `vitest` / `e2e`
  # 在本文件里**全部零命中**）：它只做「交叉编译 backend → 核版本号与 tag 一致 → npm ci →
  # 打包 → 算校验和 → 上传」。而跑测试的是**另一条**流水线 `ci.yml`，两条互不相干
  # ⇒ **推一个 tag，主干红成什么样都照发。**
  #（2026-09-09 现打：`ci.yml` 最近一次 main 的 run 34432595554，8 个 job **红 6 个**。
  #  而 release 会把这棵红树打成安装包发给新用户 —— 发版标准逐字是「新用户可以稳定装上」。）
  #
  # ## 为什么是「查同一个 commit 上的 CI 结论」，而不是把测试步骤抄一份进来
  #
  # 本仓有一条明纪律：**同一个量不许两处各写一份**（`README.md` 那句「条数刻意不写在这里」、
  # `RELEASING.md` 里「测试数 / CI job 数不要求每版跟」都是它的实例）。把 `cargo test` /
  # `npm test` 抄进本文件就是又立一份**会漂**的清单副本；而且抄的必然是**子集** ——
  # 「Release 绿了」会被读成「测试过了」，实际只跑了 8 件里的两三件，**比没有门更坏**
  #（没有门的时候没人会误以为测过）。
  # ⇒ 这里存的不是清单，是**一条指针**：跑什么、跑几件，由 `ci.yml` 一处说了算；本门只问结论。
  #
  # ## 为什么不是 `workflow_run`
  #
  # `needs:` **跨不了 workflow**，GitHub 只留两条路：把本文件的触发器换成 `workflow_run`，
  # 或者查 API。前者要连带重写 checkout 的 ref、`github.ref_name`（下面那道版本号检查正用着它）
  # 和发布目标 —— 而本文件**只有推 tag 才会跑、本地一步都验不了**，那是拿整条发版路径
  # 去换一个等价的结果。⇒ 选查 API。
  #
  # ## 可行性是现打验过的（2026-09-09，读 v3.6.0 那次的云端记录）
  #
  # · `ci.yml` 的触发器含 `tags: ['v*']` ⇒ 同一次 tag push **同时**起 CI 与 Release；
  # · v3.6.0 那次 Release run 的 `head_sha` = `851d8a44…`，与 `head_commit.id` **逐字相同**
  #  （**不是** tag 对象的 sha —— annotated tag 那个坑在这里不成立，是查过的，不是推的）；
  #   按那个 sha 查回来三条 run：CI(tag) · Release(tag) · CI(main)，head_sha 全同 ⇒ 对得上；
  # · CI 整条实测 3-6 分钟（v3.6.0 那次 3m18s；09-10 那次 5m43s），而 `build-windows`
  #   一个人就 9m16s ⇒ 这道门加的等待**短于**它后面那一步。
  #
  # ⚠ **本门只认「结论」，不认「跑了几个 job」** —— 后者是 `ci.yml` 自己的事，本文件不存副本。
  # ⚠ **认 CI 用两把尺子取或**（workflow 文件路径 **或** workflow 名）：另一路正在改 `ci.yml`，
  #    只改其中一样仍会命中另一把；两把都不中 ⇒ **拦下**，不静默放行。
  # ⚠ **fail-closed**：查不到 CI run · CI 不绿 · 等超时 · API 调不通，四种都拦。
  #    要绕过它只能**改这个文件**（那会留在 git 历史上），不能靠「今天先不管」。
  # ⚠ **它接受这个 commit 上任意一条绿的 CI run** —— 同一个 sha 上 main 那次与 tag 那次
  #    跑的是同一棵树、同一份 `ci.yml`，所以先推 main 等它绿、再推 tag，这道门几乎不加等待。
  ci-gate:
    name: Gate on CI (same commit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read      # 读 workflow runs 要它；仓库默认 token 权限被收紧时这里显式要回来
    steps:
      - name: Require a green CI run on this exact commit
        # 🔴 只在「要发布」时才拦。理由：本门问的是「**发出去的这棵树测过没有**」——
        # 演练（`publish=false`）**什么都不发**，没有可发坏的东西；而演练又恰恰跑在
        # 一个**没进过 main、因此没有 CI run** 的分支上（`ci.yml` 只在 main / PR / tag 上跑）
        # ⇒ 不放它过，手工触发在构造上永远走不到第一个构建步骤，这个触发器就白加了。
        # ⚠ 反过来说死：`publish=true` 的手工触发**照样要过这道门**，与推 tag 一模一样。
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          filter='.workflow_runs[]
                  | select(.path == ".github/workflows/ci.yml" or .name == "CI")
                  | "\(.status) \(.conclusion) \(.html_url)"'
          find_deadline=$(( SECONDS + 600 ))    # 10 min：CI run 迟迟不出现 ⇒ 判「这个 commit 没跑过 CI」
          wait_deadline=$(( SECONDS + 2700 ))   # 45 min：CI 实测 3-6 min，其余全是排队余量
          while : ; do
            # gh 调不通就让 set -e 当场把这一步弄红（fail-closed）。补救是重跑这一个 job。
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq "$filter")
            if [ -z "$runs" ]; then
              if [ "$SECONDS" -gt "$find_deadline" ]; then
                echo "::error::commit $SHA 上查不到任何 CI run —— 发版拒绝：没有测试证据。"
                echo "常见原因：ci.yml 的触发器不再含 tags 那一条；这个 commit 从没进过 main；或 CI 的文件名与 workflow 名同时变了。"
                exit 1
              fi
              echo "还没看到 CI run（SHA=$SHA），20s 后再看…"
              sleep 20
              continue
            fi
            echo "$runs"
            green=$(printf '%s\n' "$runs" | grep -c '^completed success ' || true)
            pending=$(printf '%s\n' "$runs" | grep -cv '^completed ' || true)
            if [ "$green" -gt 0 ]; then
              echo "CI 在 commit $SHA 上绿过（$green 条）⇒ 放行。"
              exit 0
            fi
            if [ "$pending" -gt 0 ]; then
              if [ "$SECONDS" -gt "$wait_deadline" ]; then
                echo "::error::等 CI 等超时（45 min）—— 发版拒绝：拿不到测试结论。"
                exit 1
              fi
              echo "CI 还在跑（$pending 条未完），30s 后再看…"
              sleep 30
              continue
            fi
            echo "::error::commit $SHA 上的 CI 全部跑完、没有一条是绿的 —— 发版拒绝。"
            echo "上面每行是 status / conclusion / run 链接。先把 CI 修绿再重跑这一个 job。"
            exit 1
          done

  build-backends:
    name: Cross-compile remote backends (musl)
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装两个 musl target 的 std（cross 在容器里复用）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # zig 作 cross-linker：cargo-zigbuild 在 ubuntu 原生跑（build script 本机执行、不进
      # 容器）—— 避开 cross 0.2.5 旧镜像 glibc 跑不了新 rustc(1.96) build script 的坑。
      # zig 用 **stable 0.14.0**：永久下载地址、可靠，不像 nightly 那样镜像 404 / 轮换失效
      #（master 实测连 ziglang.org 官方都 404）。本地实测 zig 0.14.0 + cargo-zigbuild 0.23.0
      # 能从头编出双 musl 静态二进制。
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.0

      # cc-monitor-backend 是独立 crate（无 workspace），静态编译成 musl。
      # build_id 由源码 const BUILD_ID 决定（src/bridge/build.rs 同源解析），从源码编译天然版本一致。
      #
      # ⚠ **`--locked` 不是可选的**（2026-09-09 加）：两份 `Cargo.lock` 今天都钉着
      # `crypto-bigint 0.7.3`，而 **`0.7.0…0.7.4` 在 crates.io 上全部 yanked、只有 `0.7.5` 没被 yank**
      #（09-09 现打 crates.io API 核实过 —— `src/backend/Cargo.toml` 里 `K-R34` 那段
      #  留着的问号「本轮没核，判不了」，这次核了：`yanked=true`）。
      # cargo **只在解析那一步**挡 yanked，lock 里已经写着的照用 ⇒ 今天编得过。
      # 但凡有什么让它**重走解析**（换机器 / 改依赖 / lock 与 manifest 对不上），后果二选一，
      # 两条都坏：① 联网时它会**悄悄挪到 `0.7.5`** ⇒ 发出去的安装包与 CI 测过的**不是同一棵依赖树**；
      # ② 拿不到 `0.7.5`（离线 / 缓存里只有那份 yanked 的）时当场退 101。
      # `--locked` 把这两种都变成**一条响亮的失败**：lock 要动就报错，绝不静默换依赖。
      - name: Cross-compile backend for both musl targets
        working-directory: src/backend
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      # 〔RM1c · 第四波〕只装代码全景引擎的**独立小程序**（用户 09-24 V108 选 B）：
      # 后端经插件通用调用口按需起它，后端本体仍零 code-picture。同一条配方、同两个 target
      # （`tests/scripts/re-embed.sh` 逐字同源，`tests/evidence/K-R124-ruler.py` ⑬b 两向对拍）。
      # 字节进同一个 artifact，落 `src/bridge/embedded-backends/cc-monitor-panorama-<arch>`，
      # 由 `src/bridge/build.rs::embed_panoramas` 内嵌。⚠ 它**没有**身份戳（不随 `BUILD_ID` 走）。
      - name: Cross-compile panorama for both musl targets
        working-directory: src/panorama-engine
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      # 命名成 src/bridge/build.rs embed_backends 期望的 cc-monitor-backend-<arch>。
      #
      # 🔴 **K-R70（09-12）：不再旁挂 `.build_id` 清单 —— 身份跟着字节走。**
      # 〔墓碑，本步原话逐字：「Batch9：旁挂 .build_id 清单 = 字节真实身份（编译器可能把
      #  BUILD_ID 优化成立即数、字节内搜不到明文——运行时启发式会误拒正品；清单从源码同一
      #  提取点生成，与刚编出的字节天然同源）」。**最后半句正是病灶**：清单从**源码**抠，
      #  所以三个载体的清单**恒等**，而恒等的东西一格证据都不提供（K-R68 · DECISIONS#R26 裁定零）。〕
      # 今天后端自己带着一段 `#[used] static` 的身份戳（lib.rs::CC_MONITOR_BUILD_STAMP，
      # 〔19b 订正：步 9 起它住 lib.rs，这段头注原写 main.rs —— 指向一份抠不出东西的住址〕），
      # 连续、拆不成立即数 ⇒ 下游（src/bridge/build.rs）直接从字节里扫，不需要任何旁文件。
      - name: Stage binaries
        run: |
          mkdir -p staged
          cp .build/backend/x86_64-unknown-linux-musl/release/cc-monitor-backend staged/cc-monitor-backend-x86_64
          cp .build/backend/aarch64-unknown-linux-musl/release/cc-monitor-backend staged/cc-monitor-backend-aarch64
          # 〔RM1c〕全景小程序（`.build/panorama` 是 `src/panorama-engine/.cargo/config.toml` 声明的 target-dir）。
          cp .build/panorama/x86_64-unknown-linux-musl/release/cc-monitor-panorama staged/cc-monitor-panorama-x86_64
          cp .build/panorama/aarch64-unknown-linux-musl/release/cc-monitor-panorama staged/cc-monitor-panorama-aarch64
          file staged/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: embedded-backends
          path: |
            staged/cc-monitor-backend-*
            staged/cc-monitor-panorama-*
          if-no-files-found: error

  build-windows:
    name: Build Windows artifacts
    needs: build-backends
    runs-on: windows-latest
    permissions:
      contents: write   # 需要 write 才能上传 release 附件
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与 ci.yml 对齐（≥22.18 type-stripping），避免发版与 CI 用不同 node
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/bridge

      - name: Download cross-compiled backends
        uses: actions/download-artifact@v4
        with:
          name: embedded-backends
          path: backend-artifacts

      # 放进 build.rs 期望的位置；缺任一 arch 就 fail——绝不静默发出「自动部署被关」的安装包。
      #
      # 🔴 **K-R70（09-12）：校验从「比清单」换成「问字节」。**
      # 〔墓碑，本步原话逐字：「v2.22.1 修复：**必须连 .build_id 清单一起拷**。此前只拷
      #  二进制不拷清单 → build.rs 拿不到内嵌身份 → 运行时字节启发式又搜不到被优化的
      #  BUILD_ID 明文 → 「身份未知跳过自动部署」→ v2.19-v2.22 全部 CI 安装包的远端流模式
      #  静默降级（bg 会话不可见 + 全量推流拥塞）。清单内容再与源码 BUILD_ID 对拍」。
      #  那次事故与那次修复都是真的；今天换掉的是**修法**：清单是从源码抠的**标签**，
      #  它与刚编出来那份字节之间没有任何因果 —— 三个载体的清单永远一致，
      #  而「永远一致」证不了任何事（K-R68 · DECISIONS#R26 裁定零）。〕
      # 今天问的是**这份字节自己**：backend 里那段 `#[used] static CC_MONITOR_BUILD_STAMP`
      # 逐字是 `<<ccm-build-id:$src:ccm-build-id>>`，界标的唯一住址在 `env.CCM_BACKEND_IDENTITY_SRC`
      # 那份源码的 BUILD_STAMP_OPEN / BUILD_STAMP_CLOSE（这里按同一条既有机制从源码抠，不手抄）。
      # 〔19b 订正：这两行原写 `main.rs`，步 9 之后那里没有界标了。〕
      # ⚠ 用 Latin1 解字节流：只是把每个字节映成一个字符好做子串搜索，不是在解码文本。
      - name: Place + verify embedded backends
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/bridge/embedded-backends | Out-Null
          foreach ($a in "x86_64","aarch64") {
            $f = Get-ChildItem -Recurse backend-artifacts -Filter "cc-monitor-backend-$a" | Select-Object -First 1
            if (-not $f) { Write-Error "backend artifact cc-monitor-backend-$a 缺失——内嵌失败，自动部署会被禁用"; exit 1 }
            Copy-Item $f.FullName "src/bridge/embedded-backends/cc-monitor-backend-$a" -Force
            Write-Host ("embedded {0} ({1} bytes)" -f $a, $f.Length)
            # 〔RM1c〕全景小程序同一批 artifact。缺了就是这一版远端全景没有字节可推 ⇒ 当场失败，不静默关掉。
            $p = Get-ChildItem -Recurse backend-artifacts -Filter "cc-monitor-panorama-$a" | Select-Object -First 1
            if (-not $p) { Write-Error "panorama artifact cc-monitor-panorama-$a 缺失——远端代码全景没有字节可推"; exit 1 }
            Copy-Item $p.FullName "src/bridge/embedded-backends/cc-monitor-panorama-$a" -Force
            Write-Host ("embedded panorama {0} ({1} bytes)" -f $a, $p.Length)
          }
          # 🔴 〔步 9 · 09-19〕从 main.rs 改成 lib.rs —— BUILD_ID 与身份戳界标已按
          #    `设计/00 §1.5.4` 前置 2 搬进后端库面（in-process 那条路没有那个 main.rs）。
          #    `src/bridge/build.rs::backend_lib_rs` 与本处是同一条住址，改一处就要改另一处；
          #    `tests/backend/build_id_guard.rs` 那条判据钉着三处都指得到真东西。
          # 🔴 〔19b · 09-19〕住址收进文件头那个 `env:` —— 本文件另有一步也要抠同一个 const，
          #    步 9 那次**只改了这一处**，另一处留在 main.rs 上指空了。读同一个量，不各写一份。
          $main = $env:CCM_BACKEND_IDENTITY_SRC
          # 🔴 〔19b〕**抠不到要落在下面那句诊断上，不是落在 PowerShell 的空数组索引上。**
          #    原写法 `(...).Matches[0].Groups[1].Value` 在零命中时抛 "Cannot index into a null
          #    array" ⇒ 那句写好的「先修抽取」一个字都印不出来。读不出来时**显示什么**，
          #    是 `设计/96 §7.2.4` 点名要答的一格 —— 这里答：印住址、印抠的是哪个 const、退 1。
          $mId    = Select-String -Path $main -Pattern 'const BUILD_ID: &str = "([^"]+)"'        | Select-Object -First 1
          $mOpen  = Select-String -Path $main -Pattern 'const BUILD_STAMP_OPEN: &str = "([^"]+)"'  | Select-Object -First 1
          $mClose = Select-String -Path $main -Pattern 'const BUILD_STAMP_CLOSE: &str = "([^"]+)"' | Select-Object -First 1
          $src   = if ($mId)    { $mId.Matches[0].Groups[1].Value }    else { $null }
          $open  = if ($mOpen)  { $mOpen.Matches[0].Groups[1].Value }  else { $null }
          $close = if ($mClose) { $mClose.Matches[0].Groups[1].Value } else { $null }
          if (-not $src -or -not $open -or -not $close) {
            Write-Error ("从 $main 抠不出 BUILD_ID / 身份戳界标（BUILD_ID={0} OPEN={1} CLOSE={2}，空 = 那一行不在这份文件里）" -f $src, $open, $close)
            Write-Error "——本步此刻是无效的（拿一个空戳去扫字节，任何字节都会被判「不是这套源码编的」）。先修抽取：住址在本文件头的 env.CCM_BACKEND_IDENTITY_SRC"
            exit 1
          }
          $want = "$open$src$close"
          Write-Host "expecting stamp: $want"
          foreach ($a in "x86_64","aarch64") {
            $bytes = [System.IO.File]::ReadAllBytes("src/bridge/embedded-backends/cc-monitor-backend-$a")
            $text  = [System.Text.Encoding]::Latin1.GetString($bytes)
            if ($text.IndexOf($want) -lt 0) { Write-Error "内嵌 backend $a 的字节里问不出身份戳 $want —— 它不是这套源码编出来的"; exit 1 }
            Write-Host "stamp $a = $src (从字节里扫出来的，不是从旁边抄的)"
          }

      - name: npm install
        run: npm ci

      # 防 v2.4.2 漂移事故复发：tag 与**四处**版本号（package.json / tauri.conf.json /
      # Cargo.toml / Cargo.lock 的 monitor 包）必须完全一致，否则 fail step。
      - name: Verify version consistency with tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src/bridge/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src/bridge/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          # Cargo.lock 里 monitor 包：`name = "monitor"` 紧跟的 version 行
          $lockRaw = Get-Content src/bridge/Cargo.lock -Raw
          $lock = if ($lockRaw -match '(?m)^name = "monitor"\r?\nversion = "([^"]+)"') { $Matches[1] } else { '<missing>' }
          # ── KR114D1：这一步拆成**两半**，因为手工触发时 `github.ref_name` 是**分支名**，
          #    拿它当版本号比，演练必然红在这里，而红的原因与「版本漂了」毫无关系。
          #    ① **四处互相对账** —— 与触发方式无关，永远做（演练也做，这正是它的价值）。
          #    ② **与 tag 比** —— 只在真要发布时做（`env.PUBLISH`）。
          #    ⚠ 推 tag 那条路上两半都做 ⇒ **与改之前逐字同效**，一格覆盖都没少。
          if ($pkg -ne $conf -or $pkg -ne $cargo -or $pkg -ne $lock) {
            Write-Error "Version drift (四处内部不一致): package.json=$pkg tauri.conf=$conf Cargo.toml=$cargo Cargo.lock(monitor)=$lock"
            exit 1
          }
          Write-Host "Version self-consistent: $pkg (package.json / tauri.conf / Cargo.toml / Cargo.lock all agree)"
          if ($env:PUBLISH -eq 'true') {
            if ($pkg -ne $tag) {
              Write-Error "Version drift: tag=$tag package.json=$pkg tauri.conf=$conf Cargo.toml=$cargo Cargo.lock(monitor)=$lock"
              exit 1
            }
            Write-Host "Version OK: $tag (与 tag 一致)"
          } else {
            Write-Host "演练（publish=false）：跳过「与 tag 一致」那一半；ref_name=$($env:GITHUB_REF_NAME) 不是版本号"
          }
          # ── 🔴 K-R70（09-12）：**第五处刻意不参加，而它从此被点名核过。** ──────────
          #
          # `src/backend/Cargo.toml` 的 version 逐字是 `0.0.0`，**故意的** ——
          # 后端换不换由行为变没变决定（BUILD_ID 的 bump 纪律），不由发版节奏决定；
          # 给它一个跟 tag 走的版本号 = 给后端造第二个身份（K33「后端只有一个」在身份这一维）。
          # 理由全文住那一行上方的注释，机检住 build_id_guard 的
          # the_crate_version_is_deliberately_zero_and_the_real_identity_has_a_home。
          # ⇒ 这里不比它与 tag，而是**盯住它别被人顺手改成一个假数字**，
          #   并确认真身份（BUILD_ID）在这一版里是**说得出**的。
          $dv = (Select-String -Path src/backend/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          # 🔴 〔19b · 09-19〕**这一行原来指着 `src/backend/main.rs`** —— 步 9 把 `BUILD_ID`
          #    搬进 `lib.rs` 时改了上面那一步、漏了这一步，而 `main.rs` 里今天没有那个 const。
          #    后果不是「静默放行」（那还好些），是**发版必红在这里**，且原写法在零命中时
          #    抛 PowerShell 的空数组索引异常 ⇒ 连下面那句诊断都印不出来。
          #    ⇒ 住址读文件头那个 `env:`（全文件唯一一份），抽取写成零命中安全的形状。
          $mDid = Select-String -Path $env:CCM_BACKEND_IDENTITY_SRC -Pattern 'const BUILD_ID: &str = "([^"]+)"' | Select-Object -First 1
          $did = if ($mDid) { $mDid.Matches[0].Groups[1].Value } else { $null }
          if ($dv -ne '0.0.0') {
            Write-Error "src/backend 的 version 现在是 $dv —— 它刻意是 0.0.0（真身份是 BUILD_ID）。改它之前先答：谁在数这个新数字？"
            exit 1
          }
          if (-not $did) {
            Write-Error "抠不到后端的 const BUILD_ID —— 找的是 $env:CCM_BACKEND_IDENTITY_SRC 里那行 'const BUILD_ID: &str = ...;'，它不在那份文件里。后端这一版说不出自己是谁，不许发出去"
            exit 1
          }
          Write-Host "Backend identity OK: src/backend version=0.0.0 (deliberate), BUILD_ID=$did"

      # F05b：**本机后端**（Tauri `externalBin` 那一份）（C7「没有 daemonless，本机也要有后端进程」）。
      #
      # 与上面那批 embedded-backends 是**两件事**：那些是远端 SFTP 部署用的 musl 二进制
      # （`build.rs` 用 `include_bytes!` 内嵌进 monitor）；这一份是**装在用户自己机器上**、
      # 由 monitor 起来看住的本机后端（Tauri `externalBin` 打包，装完落在 monitor.exe 旁边）。
      #
      # ⚠ 必须原生编：backend 在 Windows 上真编得过（2026-08-04 真机实测 exit=0、
      # release 2.6 MB，且跑起来发完整 hello；tmux 那半诚实发 `observation:"unobservable"`）。
      # ⚠ 名字必须带 target triple —— Tauri 的本机后端约定是「构建期带 triple、打包时剥掉」，
      # 而消费侧 `local_backend::resolve_with` 正是先找带 triple 的、再找裸名。
      # `--locked` 的理由与 build-backends 那步同源（同一份 `src/backend/Cargo.lock`、
      # 同一个 yanked 的 `crypto-bigint 0.7.3`），逐字见那里的头注 —— 这里不抄第二份。
      - name: Build local backend (native)
        working-directory: src/backend
        run: cargo build --release --locked
      - name: Stage local backend for externalBin
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host:').Line.Split(' ')[1]
          New-Item -ItemType Directory -Force src/bridge/binaries | Out-Null
          Copy-Item .build/backend/release/cc-monitor-backend.exe `
            "src/bridge/binaries/cc-monitor-backend-$triple.exe" -Force
          Get-ChildItem src/bridge/binaries | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }

      # ── K-R42：**同一份二进制再铺一处** —— 让**裸 `monitor.exe`** 也带得上本机后端 ──────
      #
      # 09-10 干净 win11 上现打：装出来那份 `cc-monitor-backend.exe` **2 个进程在跑**，
      # 裸 `monitor.exe` **0 个**。上面那一步（`binaries/` → Tauri `externalBin`）只服务
      # **安装包**：它把本机后端放进 msi/nsis，装完落在 exe 同目录。裸 exe 拿不到那个文件。
      #
      # ⚠ **这一步不动上面那一步**：安装包那条路 09-10 实测是好的（2 个进程），
      # `externalBin` 仍然只住 `tauri.sidecar.conf.json`、仍然只在下面 `tauri build` 那行
      # 用 `--config` 注入（进主配置会让 `cargo test` 也要求当前 target 的二进制存在，
      # 那是 C2 反面钉住的）。本步**只是把同一个产物再拷一份到 `embedded-backends/`**，
      # 由 `src/bridge/build.rs::embed_native_backend` `include_bytes!` 进 exe。
      #
      # ⚠ **落点刻意不是 `embedded-backends/`**，理由住 `build.rs` 的 `NATIVE_BACKEND_DIR` 头注
      # （一句话：那个目录名是另一条判据认「谁会起真后端」用的来历串，
      #  消费侧那个**字面量** `include_bytes!` 写下它会误伤那条判据）。
      #
      # ⚠ 两个文件**缺一不可**，名字定死在 `build.rs::NATIVE_BACKEND_DIR`/`NATIVE_BACKEND_FILE`：
      #   · `cc-monitor-native`           字节本身（**身份就在它里面**，见下）
      #   · `cc-monitor-native.target`    它是给哪个 triple 编的（名字里没有 triple ⇒ 只能靠它）
      # 少任何一个，`build.rs` 要么打一条 `cargo:warning=没有本机内嵌后端（…）`
      # 而构建照常绿（二进制缺席），要么当场 panic（问不出身份 / target 对不上）。
      # ⇒ 下面那几条 `Test-Path` 就是把前一种也变成硬失败。
      #
      # 🔴 **K-R70（09-12）：`cc-monitor-native.build_id` 那一份不写了。**
      # 〔墓碑：本步原来写三个文件，第三个是 `.build_id`，注释逐字「它的身份（决定落到
      #  用户盘上叫什么名字）」。**它不是身份，是标签** —— 从源码常量抠出来的一行字，
      #  与旁边那份字节之间没有因果（K-R68 · DECISIONS#R26 裁定零）。今天 `build.rs`
      #  直接从字节里扫 `CC_MONITOR_BUILD_STAMP`，落点名字仍是 `cc-monitor-backend-<id>`，
      #  只是那个 `<id>` 换成了**这份字节自己说的**。〕
      # ⚠ `.target` **留着**：它答的是「给哪个平台编的」，不是「你是谁」——
      #   那个事实今天确实只能靠旁边这一份（名字里没有 triple）。如实登记为同族剩余。
      #
      # ⚠ **诚实边界**：本步买到的是「铺了 · target 对得上 · build.rs 没 panic」。
      # 它**买不到**「裸 exe 在真 Windows 上真的起得来一个本机后端」—— 那要真机跑一趟。
      - name: Stage native backend for self-extract
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host:').Line.Split(' ')[1]
          $dir = "src/bridge/native-backend"
          $dst = "$dir/cc-monitor-native"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item .build/backend/release/cc-monitor-backend.exe $dst -Force
          Set-Content -Path "$dst.target" -Value $triple
          foreach ($f in $dst, "$dst.target") {
            if (-not (Test-Path $f)) { Write-Error "本机内嵌后端没铺全（缺 $f）——裸 exe 会回到「0 个本机后端进程」那个读数"; exit 1 }
          }
          Write-Host ("native backend staged: {0} ({1} bytes, target={2})" -f $dst, (Get-Item $dst).Length, $triple)

      # tauri build 会顺序：npm run build (vite) → cargo build --release → bundle (msi + nsis)
      #
      # ⚠ `--config src/bridge/tauri.sidecar.conf.json` 是 F05b 刻意选的形态：`externalBin`
      # **不进主配置** —— `tauri-build` 要求当前 target 的本机后端在**编译期**就存在，
      # 进主配置会让 `cargo test` 也需要一份后端二进制（实测报错
      # `resource path binaries/cc-monitor-backend-<triple> doesn't exist`），
      # 那等于把两半在构建期绑死，正是 C2 反面禁的事。⇒ 只在发版这一步注入。
      - name: tauri build
        run: npx tauri build --config src/bridge/tauri.sidecar.conf.json --bundles nsis,msi

      # ── 🔴〔2026-09-23 现打修〕**产物根不是 `src/bridge/target/`，是 `.build/bridge/`** ────
      #
      # 仓根有一份**进 git 的** `.cargo/config.toml`（`[build] target-dir = ".build/bridge"`；
      # 理由住它自己的头注：构建输出不许落在 `src/` 里，否则一族「走一遍源码树」的判据
      # 会被 `target/` 下成千上万份生成 `.rs` 淹没）。cargo 从 cwd 往上找配置
      # ⇒ **CI 上一样生效**。现打核过（`cd src/bridge && cargo metadata --no-deps`）：
      # `target_directory = <仓根>/.build/bridge`；`npx tauri bundle` 现打也落在那里
      # （`.build/bridge/release/bundle/deb/cc-monitor_3.8.1_amd64.deb`）。
      #
      # 〔墓碑，本步与下面上传那一步原来逐字写的是 `src/bridge/target/release/…`。**那是
      #  09-17 搬树（两个 cargo 工程搬进 `src/`、并加了上面那份配置）之后指空的路径**，
      #  而最后一次发版是 v3.6.0（08-01）—— 在那之前 ⇒ **一次都没人踩到过**。
      #  它坏得**完全静默**：三个 glob 全空 → 本步原来那个 `-ErrorAction SilentlyContinue`
      #  吞掉「路径不存在」→ `SHA256SUMS.txt` 空着照发；下面 `action-gh-release` 的
      #  `files:` 一条都不匹配，而 `fail_on_unmatched_files` 默认 `false` ⇒ 只打 warning
      #  ⇒ **Release 建得出来，上面一个安装包都没有。**〕
      # ⇒ 两件同拍改：① 路径改对；② 把「一条都没匹配」从静默变成硬失败（下面那个**恒等**）。
      # 🔴 判据那一侧同拍钉住：`tests/evidence/K-R124-ruler.py` 的 ⑮ 把本文件里每一处
      #   cargo 产物路径的**根**与那两份 `.cargo/config.toml` 声明的 `target-dir`
      #   做**两向集合相等** —— 再搬一次树、再改一次 `target-dir` 而这里不跟，当场红。
      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          $bundleDir = ".build\bridge\release\bundle"
          $want = @("$bundleDir\nsis\*-setup.exe", "$bundleDir\msi\*.msi", ".build\bridge\release\monitor.exe")
          $got = @(Get-ChildItem -Path $want -ErrorAction SilentlyContinue)
          if ($got.Count -ne $want.Count) {
            Write-Error "产物份数对不上：要 $($want.Count) 份（nsis setup · msi · 裸 exe），现打 $($got.Count) 份（$($got.Name -join ', ')）—— 这一形就是 2026-09-23 逮到的那条：产物根搬去了 .build/bridge/ 而这里还写着 src/bridge/target/ ⇒ 全空，却一声不响"
            exit 1
          }
          $got |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8

      # 🔴 KR124D2（`K-R124`，2026-09-15）：**正文来源**。本文件两处发布步骤**各跑一次这一步**
      #   —— 不是「Windows 生成、Linux 沿用」：两个 job 在不同 runner 上，沿用不了。
      #   生成器只有一个住址（`tests/scripts/release-notes.mjs`），正文取自 `CHANGELOG.md` 里本版那一段
      #   （`src/doc/RELEASING.md § 5` 早就写着这条 SOP，只是一直是手工的一步、从 v3.6.0 起没人做）。
      #   ⚠ 命令刻意写成**不带任何 shell 语法**的一行：本 job 的默认 shell 是 pwsh，
      #     `>` 重定向的编码在 pwsh 与 bash 上不同 ⇒ 让生成器自己写文件，两个 runner 上同一行。
      #   ⚠ 它**不回落**：这一版在 CHANGELOG 里没有段、或段太短 ⇒ 生成器退出码 1 ⇒ 本步骤红，
      #     Release 不会被建出来。**「静默用自动生成那份」正是本条要挡的东西。**
      - name: Render the Release body (CHANGELOG section for this version)
        if: env.PUBLISH == 'true'
        run: node tests/scripts/release-notes.mjs RELEASE_BODY.md

      # 🔴 KR114D1：**本文件两处「往 GitHub Release 写」之一**，闸读 `env.PUBLISH`（住址在文件头）。
      - name: Create / update GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            .build/bridge/release/monitor.exe
            .build/bridge/release/bundle/nsis/*-setup.exe
            .build/bridge/release/bundle/msi/*.msi
            SHA256SUMS.txt

  # ────────────────────────────────────────────────────────────────────────────
  # L4（local-as-remote）：**Linux 产物**。
  #
  # ⚠ **订正（2026-09-09 现打）**：原话「本 job 从未真正跑过」**今天不成立** ——
  # v3.6.0 那次 Release run（`30679669587`，2026-08-01）里 `Build Linux artifacts (deb)`
  # **成功跑完，5m36s**（02:27:39 → 02:33:15，读的是云端 jobs API）。
  #
  # ⚠ **仍然成立的那一半，别跟着一起删**：本 job 只在 tag 时触发 ⇒ **本地一步都验不了**。
  # 而且**真正一次都没在 tag 上跑过的**是 v3.6.0 之后加进来的那些 —— 那之后本文件被改过两次、
  # 期间**没有再发过版**：`ae18878`（08-02，裸二进制上传）与 `e39253e`（08-04，本机后端）。
  # 具体是：两个 job 里的 `Build local backend (native)` + `Stage local backend for externalBin`
  # 共四步、两处 `tauri build` 上的 `--config tauri.sidecar.conf.json`、以及裸二进制那条上传。
  # ⇒ 下面每一处设计都是为了「万一它坏了，坏得可见且不伤及发版」：
  #
  # 1. `needs: [build-backends, build-windows]` —— **串在 Windows 之后**，两个理由：
  #    ① Release 是 `build-windows` 创建的；两个 job 同时 `action-gh-release` 会竞争同一个
  #       release，串起来就没这个竞态。
  #    ② `build-windows` 里那道**四处版本号与 tag 一致**的检查因此**被继承**——版本漂了它
  #       先失败，本 job 根本不会起。**不重复实现那道检查**（重复 = 又一个会漂的副本）。
  # 2. 本 job 失败**不会**让 release 消失（Windows 那半已经建好并传完了），
  #    表现是「workflow 红 + release 里少了 .deb」——**可见的缺失，不是静默降级**。
  # 3. **格式选 deb 而不是 AppImage**。STATUS 里建议过 AppImage（单文件、不管发行版依赖），
  #    那个好处是真的；但 AppImage 打包要**下载 linuxdeploy** + 依赖 `libfuse2`
  #    （Ubuntu 24.04 已不默认提供）——在一个**没法在本地验证**的 job 上，
  #    那是两个额外的失败面。deb 用 Tauri 自带的纯 Rust 打包器，零外部工具。
  #    ⇒ **先把 deb 跑通，AppImage 留作后续**（已登记）。
  # 4. **不动 `src/bridge/tauri.conf.json` 的 `bundle.targets`**（那是 Windows 主路径共享的
  #    最高风险面）；格式在命令行上给。
  build-linux:
    name: Build Linux artifacts (deb)
    needs: [build-backends, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 追加附件到已存在的 release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与 build-windows / ci.yml 对齐
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/bridge

      # 同 ci.yml::linux-app-build 那四个（构建期必需，不是打包才要）。
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Download cross-compiled backends
        uses: actions/download-artifact@v4
        with:
          name: embedded-backends
          path: backend-artifacts

      # 只做**放置**，不重做校验：`build-windows` 已经对**同一批 artifact** verify 过
      #（🔴 `K-R70` 09-12 起那道 verify 是「从字节里扫出身份戳」，不再是「比清单」），
      # 而本 job `needs` 它 ⇒ 那道检查已经过了。
      # 重写一份 bash 版校验只会多一个会漂的副本。缺文件仍然 fail（`cp` 会失败）。
      # ⚠ 清单那两行跟着一起没了（`K-R70`：那是标签不是指纹，见 build-backends 那步的墓碑）。
      - name: Place embedded backends
        run: |
          set -euo pipefail
          mkdir -p src/bridge/embedded-backends
          for a in x86_64 aarch64; do
            bin=$(find backend-artifacts -name "cc-monitor-backend-$a" -type f | head -1)
            [ -n "$bin" ] || { echo "backend artifact 缺失（$a）"; exit 1; }
            cp "$bin" "src/bridge/embedded-backends/cc-monitor-backend-$a"
            echo "embedded $a placed"
            # 〔RM1c〕全景小程序同一批 artifact（缺了 ⇒ `cp` 失败 ⇒ 本步失败，同上一行的口径）。
            pano=$(find backend-artifacts -name "cc-monitor-panorama-$a" -type f | head -1)
            [ -n "$pano" ] || { echo "panorama artifact 缺失（$a）"; exit 1; }
            cp "$pano" "src/bridge/embedded-backends/cc-monitor-panorama-$a"
            echo "embedded panorama $a placed"
          done

      - name: npm ci
        run: npm ci

      # F05b：本机后端（理由同 build-windows 那两步，见那里的头注）。
      # ⚠ Linux 侧同样必须做 —— `externalBin` 一旦注入，`tauri build` 就要求**当前 target**
      # 的那份二进制存在；少了它这一步会以 `resource path ... doesn't exist` 直接失败。
      # `--locked` 同上：理由住 build-backends 那步的头注，这里不抄第二份。
      - name: Build local backend (native)
        working-directory: src/backend
        run: cargo build --release --locked
      - name: Stage local backend for externalBin
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src/bridge/binaries
          cp .build/backend/release/cc-monitor-backend \
             "src/bridge/binaries/cc-monitor-backend-$triple"
          ls -l src/bridge/binaries

      - name: tauri build (deb)
        run: npx tauri build --config src/bridge/tauri.sidecar.conf.json --bundles deb

      # ⚠ 路径的理由与 Windows 那一步**同一条**（产物根是 `.build/bridge/`，不是
      #   `src/bridge/target/`）—— 逐字住那一步的头注，这里不抄第二份。
      #   `[ -f ] || continue` 同拍换成硬失败：它是那条静默的另一半。
      - name: Compute SHA256 checksums (Linux)
        run: |
          set -euo pipefail
          : > SHA256SUMS-linux.txt
          n=0
          # 二进制名是 cargo 包名 `monitor`（不是 productName `cc-monitor`）——
          # 与 build-windows 里的 `monitor.exe` 同源；`installer.nsi` 现打的
          # `!define MAINBINARYNAME "monitor"` 也是这个名字。
          for f in .build/bridge/release/bundle/deb/*.deb .build/bridge/release/monitor; do
            [ -f "$f" ] || { echo "::error::产物不在盘上：$f —— 产物根搬过一次（见 build-windows 那一步的头注）"; exit 1; }
            # 只把**路径**收成 basename，别顺手把 hash 也剥了
            #（`sed 's#.*/##'` 是贪婪的，会把 "hash  path/to/" 整段吃掉）。
            sha256sum "$f" | awk '{n = split($2, p, "/"); print $1 "  " p[n]}' >> SHA256SUMS-linux.txt
            n=$((n + 1))
          done
          [ "$n" -eq 2 ] || { echo "::error::产物份数对不上：要 2（deb ＋ 裸二进制），现打 $n"; exit 1; }
          cat SHA256SUMS-linux.txt

      # ── 🔴〔2026-09-23〕**安装包的二进制清单 ↔ 本包声明的那几个，两向集合相等** ────────
      #
      # ## 它买的是什么（这是全仓**唯一**一处对着真产物核这件事的地方）
      #
      # 门禁那一侧（`K-R124-ruler.py` ⑭）只读**盘上的文本**：Cargo.toml 的 `[[bin]]` ↔ 登记 ↔
      # `externalBin`。它**买不到**「打包器真把它们装进去了」。本步对着**真 `.deb` 的字节**问
      # 那一句：解出来的 `usr/bin/` 里到底有哪几个文件。
      #
      # ## 为什么两侧都**现算**，不写第三份清单
      #
      # 左边从 `src/bridge/Cargo.toml` 的 `[[bin]]` ＋ `tauri.sidecar.conf.json` 的
      # `externalBin` 现算（那是**唯一住址**，同一份也是判据 ⑭ 读的那两份）；右边从 `.deb`
      # 现打。手抄一份「应该有这三个」进本文件 = 又一个会漂的副本（本仓最贵那族病）。
      #
      # ## 🔴 它同时是「非主 `[[bin]]` 会被打包器自动装」这条机制的**探针**
      #
      # `cc-monitor-filewin` 进安装包**不靠本仓任何配置**：`tauri-cli::get_binaries` 把
      # Cargo.toml 里每一个 `[[bin]]` 都交给打包器（`name == 包名` 的算主二进制、其余
      # `!bin.main()`），而 nsis / msi / deb 三个打包器都把非主 bin 装到主二进制旁边。
      # ⇒ 那条机制哪天变了（升级 CLI、上游改行为），**本步会在 deb 上先红**，而它与
      #   Windows 那两个安装包是**同一个机制** ⇒ 这一格红就是「Windows 那份也别信了」。
      # ⚠ 反过来**不成立**：本步绿只代表 deb 里有它。Windows 那两份安装包本刀**没买到**
      #   （没有 Windows 机器、也不跑 NSIS/WiX）—— 如实登记，别读宽。
      - name: The .deb really ships every binary this package declares
        run: |
          set -euo pipefail
          # ⚠ 恰好一份才判得动（多一份 = 下面 `dpkg-deb -c "$deb"` 会拿到一串路径）。
          debs=(.build/bridge/release/bundle/deb/*.deb)
          [ "${#debs[@]}" -eq 1 ] && [ -f "${debs[0]}" ] \
            || { echo "::error::deb 不是恰好一份（现打 ${#debs[@]}：${debs[*]}）—— 判不了，按红记"; exit 1; }
          deb="${debs[0]}"
          # 🔴 两侧的排序必须同口径：`LC_ALL=C sort` = 码点序 = python 的 `sorted()`。
          #   跟着环境的 locale 走，`diff` 会在「两边其实是同一个集合」时报差异。
          # ⚠ **刻意写成 `python3 -c` 一行，不用 heredoc**：`run: |` 是 YAML 的块标量，
          #   heredoc 的正文要顶到第 0 列才收得住终止符，而那**破掉块标量的缩进**
          #   ⇒ 整份 `release.yml` 解不动（现打栽过一次，`K-R124` 的 ④ 地板当场红）。
          want="$(python3 -c 'import json,tomllib; bins={b["name"] for b in tomllib.load(open("src/bridge/Cargo.toml","rb"))["bin"]}; ext={p.rsplit("/",1)[-1] for p in json.load(open("src/bridge/tauri.sidecar.conf.json"))["bundle"]["externalBin"]}; print("\n".join(sorted(bins|ext)))')"
          got="$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed -nE 's#^(\./)?usr/bin/##p' | LC_ALL=C sort)"
          printf '想要：\n%s\n现打（%s 的 usr/bin/）：\n%s\n' "$want" "$deb" "$got"
          # 🔴 两向：`diff` 对**两个方向**都出声。少一个 = 安装包里没有它（用户点那个按钮会
          #   拿到一条响亮的失败，`filewin::proc::resolve_window_bin` 那一形）；
          #   多一个 = 装了一份没人登记的二进制。
          diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") \
            || { echo "::error::安装包的二进制清单与本包声明的对不上（上面 < 是声明了没装、> 是装了没登记）"; exit 1; }

      # DN-8（aterm 2026-07-31 请求）：backend 的 **musl 二进制也挂成 Release 资产**。
      # 此前它们只作为 CI artifact 传给 build-windows 内嵌 ⇒ 外部项目（aterm 走自部署）
      # 拿不到，只能自己装 zig 交叉编译一遍。
      #
      # **挂在本 job 而不是 build-backends**：后者跑在 build-windows **之前**，在那里调
      # `action-gh-release` 会①抢先创建 release，正是本文件上面那段注释要避开的竞态；
      # ②**绕过** build-windows 里「四处版本号与 tag 一致」那道检查。本 job
      # `needs: [build-backends, build-windows]`，两条都天然继承。artifact 也已经下载好了。
      #
      # 🔴 **`files: |` 里 `#` 不是注释**（2026-09-09 订正）：那是 YAML 字面块，
      # 整行会当成**文件 glob** 交给 `action-gh-release`。下面这三行原本就写在块里，
      # 靠 `fail_on_unmatched_files` 默认 `false` 才只打 warning 没炸。
      # ⚠ 它们与它们下面那条 `monitor` 一起是 `ae18878`（08-02）加的，而最后一次发版是
      # v3.6.0（08-01）⇒ **这一段一次都没在 tag 上跑过**，那三条 warning 也就从没人看见。搬出来。
      # U5-走查：**裸二进制此前算了 hash 却没上传** —— `SHA256SUMS-linux.txt` 里有它那一行，
      # 而 Release 页上没有那个文件，用户照校验和逐个核就会卡在这儿。
      # 补上传（与 Windows 侧 `monitor.exe` 对称：那边一直是「安装器 + 裸二进制」两样都给）。
      # 🔴 KR124D2（`K-R124`，2026-09-15）：**正文来源，这一处与 Windows 那一处同源同值**。
      #   为什么这一处也要给：`action-gh-release` 对一个**已存在**的 release 是 PATCH ——
      #   本 job 不给正文，那一次 PATCH 会把 Windows 刚写上去的正文按它自己的口径再处理一遍。
      #   两处给**同一个生成器、同一个版本号**产出的同一份字节 ⇒ 第二次写是幂等的。
      #   ⚠ **竞态一个字没动**：`needs: [build-backends, build-windows]` 还在，
      #     release 仍然由 `build-windows` 创建，本 job 仍然只追加（文件头 `:452` 那段头注的第 ①）。
      - name: Render the Release body (CHANGELOG section for this version)
        if: env.PUBLISH == 'true'
        run: node tests/scripts/release-notes.mjs RELEASE_BODY.md

      # 🔴 KR114D1：**本文件两处「往 GitHub Release 写」之二**，闸读 `env.PUBLISH`（住址在文件头）。
      - name: Append Linux artifacts to the release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            .build/bridge/release/bundle/deb/*.deb
            .build/bridge/release/monitor
            SHA256SUMS-linux.txt
            backend-artifacts/cc-monitor-backend-x86_64
            backend-artifacts/cc-monitor-backend-aarch64
