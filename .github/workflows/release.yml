name: Release

# 推 v* tag 时触发：
#  0. ci-gate：**同一个 commit 上的 CI 必须绿过**，否则后面一步都不起（R1，2026-09-09 加）。
#  1. build-daemons (ubuntu)：用 cargo-zigbuild 交叉编译 aarch64 / x86_64 musl 远端 daemon，
#     作为 artifact 传给 Windows 作业 —— 让发布安装包内嵌 daemon、自动部署 (#29) 可用。
#  2. build-windows：下载 daemon 放进 src-tauri/embedded-daemons/ → cargo tauri build →
#     把 NSIS / MSI bundle 作为 GitHub Release 附件上传。
#  3. build-linux：同一批 daemon artifact → tauri build --bundles deb → 追加进同一个 Release。
# 注意：默认 build 会尝试下载 WiX toolset 来打 MSI，若网络不稳定可临时改 --bundles nsis。
on:
  push:
    tags: ['v*']

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # R1：**发版的第一道门 —— 这棵树的 CI 必须绿过。**
  #
  # 在这个 job 之前，本文件里**一条测试门都没有**（`cargo test` / `cargo clippy` /
  # `cargo fmt` / `npm test` / `npm run gate` / `tsc --noEmit` / `vitest` / `e2e`
  # 在本文件里**全部零命中**）：它只做「交叉编译 daemon → 核版本号与 tag 一致 → npm ci →
  # 打包 → 算校验和 → 上传」。而跑测试的是**另一条**流水线 `ci.yml`，两条互不相干
  # ⇒ **推一个 tag，主干红成什么样都照发。**
  #（2026-09-09 现打：`ci.yml` 最近一次 main 的 run 34432595554，8 个 job **红 6 个**。
  #  而 release 会把这棵红树打成安装包发给新用户 —— 发版标准逐字是「新用户可以稳定装上」。）
  #
  # ## 为什么是「查同一个 commit 上的 CI 结论」，而不是把测试步骤抄一份进来
  #
  # 本仓有一条明纪律：**同一个量不许两处各写一份**（`README.md` 那句「条数刻意不写在这里」、
  # `RELEASING.md` 里「测试数 / CI job 数不要求每版跟」都是它的实例）。把 `cargo test` /
  # `npm test` 抄进本文件就是又立一份**会漂**的清单副本；而且抄的必然是**子集** ——
  # 「Release 绿了」会被读成「测试过了」，实际只跑了 8 件里的两三件，**比没有门更坏**
  #（没有门的时候没人会误以为测过）。
  # ⇒ 这里存的不是清单，是**一条指针**：跑什么、跑几件，由 `ci.yml` 一处说了算；本门只问结论。
  #
  # ## 为什么不是 `workflow_run`
  #
  # `needs:` **跨不了 workflow**，GitHub 只留两条路：把本文件的触发器换成 `workflow_run`，
  # 或者查 API。前者要连带重写 checkout 的 ref、`github.ref_name`（下面那道版本号检查正用着它）
  # 和发布目标 —— 而本文件**只有推 tag 才会跑、本地一步都验不了**，那是拿整条发版路径
  # 去换一个等价的结果。⇒ 选查 API。
  #
  # ## 可行性是现打验过的（2026-09-09，读 v3.6.0 那次的云端记录）
  #
  # · `ci.yml` 的触发器含 `tags: ['v*']` ⇒ 同一次 tag push **同时**起 CI 与 Release；
  # · v3.6.0 那次 Release run 的 `head_sha` = `851d8a44…`，与 `head_commit.id` **逐字相同**
  #  （**不是** tag 对象的 sha —— annotated tag 那个坑在这里不成立，是查过的，不是推的）；
  #   按那个 sha 查回来三条 run：CI(tag) · Release(tag) · CI(main)，head_sha 全同 ⇒ 对得上；
  # · CI 整条实测 3-6 分钟（v3.6.0 那次 3m18s；09-10 那次 5m43s），而 `build-windows`
  #   一个人就 9m16s ⇒ 这道门加的等待**短于**它后面那一步。
  #
  # ⚠ **本门只认「结论」，不认「跑了几个 job」** —— 后者是 `ci.yml` 自己的事，本文件不存副本。
  # ⚠ **认 CI 用两把尺子取或**（workflow 文件路径 **或** workflow 名）：另一路正在改 `ci.yml`，
  #    只改其中一样仍会命中另一把；两把都不中 ⇒ **拦下**，不静默放行。
  # ⚠ **fail-closed**：查不到 CI run · CI 不绿 · 等超时 · API 调不通，四种都拦。
  #    要绕过它只能**改这个文件**（那会留在 git 历史上），不能靠「今天先不管」。
  # ⚠ **它接受这个 commit 上任意一条绿的 CI run** —— 同一个 sha 上 main 那次与 tag 那次
  #    跑的是同一棵树、同一份 `ci.yml`，所以先推 main 等它绿、再推 tag，这道门几乎不加等待。
  ci-gate:
    name: Gate on CI (same commit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read      # 读 workflow runs 要它；仓库默认 token 权限被收紧时这里显式要回来
    steps:
      - name: Require a green CI run on this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          filter='.workflow_runs[]
                  | select(.path == ".github/workflows/ci.yml" or .name == "CI")
                  | "\(.status) \(.conclusion) \(.html_url)"'
          find_deadline=$(( SECONDS + 600 ))    # 10 min：CI run 迟迟不出现 ⇒ 判「这个 commit 没跑过 CI」
          wait_deadline=$(( SECONDS + 2700 ))   # 45 min：CI 实测 3-6 min，其余全是排队余量
          while : ; do
            # gh 调不通就让 set -e 当场把这一步弄红（fail-closed）。补救是重跑这一个 job。
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq "$filter")
            if [ -z "$runs" ]; then
              if [ "$SECONDS" -gt "$find_deadline" ]; then
                echo "::error::commit $SHA 上查不到任何 CI run —— 发版拒绝：没有测试证据。"
                echo "常见原因：ci.yml 的触发器不再含 tags 那一条；这个 commit 从没进过 main；或 CI 的文件名与 workflow 名同时变了。"
                exit 1
              fi
              echo "还没看到 CI run（SHA=$SHA），20s 后再看…"
              sleep 20
              continue
            fi
            echo "$runs"
            green=$(printf '%s\n' "$runs" | grep -c '^completed success ' || true)
            pending=$(printf '%s\n' "$runs" | grep -cv '^completed ' || true)
            if [ "$green" -gt 0 ]; then
              echo "CI 在 commit $SHA 上绿过（$green 条）⇒ 放行。"
              exit 0
            fi
            if [ "$pending" -gt 0 ]; then
              if [ "$SECONDS" -gt "$wait_deadline" ]; then
                echo "::error::等 CI 等超时（45 min）—— 发版拒绝：拿不到测试结论。"
                exit 1
              fi
              echo "CI 还在跑（$pending 条未完），30s 后再看…"
              sleep 30
              continue
            fi
            echo "::error::commit $SHA 上的 CI 全部跑完、没有一条是绿的 —— 发版拒绝。"
            echo "上面每行是 status / conclusion / run 链接。先把 CI 修绿再重跑这一个 job。"
            exit 1
          done

  build-daemons:
    name: Cross-compile remote daemons (musl)
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装两个 musl target 的 std（cross 在容器里复用）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # zig 作 cross-linker：cargo-zigbuild 在 ubuntu 原生跑（build script 本机执行、不进
      # 容器）—— 避开 cross 0.2.5 旧镜像 glibc 跑不了新 rustc(1.96) build script 的坑。
      # zig 用 **stable 0.14.0**：永久下载地址、可靠，不像 nightly 那样镜像 404 / 轮换失效
      #（master 实测连 ziglang.org 官方都 404）。本地实测 zig 0.14.0 + cargo-zigbuild 0.23.0
      # 能从头编出双 musl 静态二进制。
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.0

      # cc-monitor-remote 是独立 crate（无 workspace），静态编译成 musl。
      # build_id 由源码 const BUILD_ID 决定（src-tauri/build.rs 同源解析），从源码编译天然版本一致。
      #
      # ⚠ **`--locked` 不是可选的**（2026-09-09 加）：两份 `Cargo.lock` 今天都钉着
      # `crypto-bigint 0.7.3`，而 **`0.7.0…0.7.4` 在 crates.io 上全部 yanked、只有 `0.7.5` 没被 yank**
      #（09-09 现打 crates.io API 核实过 —— `remote-daemon-proto/Cargo.toml` 里 `K-R34` 那段
      #  留着的问号「本轮没核，判不了」，这次核了：`yanked=true`）。
      # cargo **只在解析那一步**挡 yanked，lock 里已经写着的照用 ⇒ 今天编得过。
      # 但凡有什么让它**重走解析**（换机器 / 改依赖 / lock 与 manifest 对不上），后果二选一，
      # 两条都坏：① 联网时它会**悄悄挪到 `0.7.5`** ⇒ 发出去的安装包与 CI 测过的**不是同一棵依赖树**；
      # ② 拿不到 `0.7.5`（离线 / 缓存里只有那份 yanked 的）时当场退 101。
      # `--locked` 把这两种都变成**一条响亮的失败**：lock 要动就报错，绝不静默换依赖。
      - name: Cross-compile daemon for both musl targets
        working-directory: remote-daemon-proto
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      # 命名成 src-tauri/build.rs embed_daemons 期望的 cc-monitor-remote-<arch>。
      # Batch9：旁挂 .build_id 清单 = 字节真实身份（编译器可能把 BUILD_ID 优化成
      # 立即数、字节内搜不到明文——运行时启发式会误拒正品；清单从源码同一提取点
      # 生成，与刚编出的字节天然同源）。
      - name: Stage binaries
        run: |
          mkdir -p staged
          cp remote-daemon-proto/target/x86_64-unknown-linux-musl/release/cc-monitor-remote staged/cc-monitor-remote-x86_64
          cp remote-daemon-proto/target/aarch64-unknown-linux-musl/release/cc-monitor-remote staged/cc-monitor-remote-aarch64
          BUILD_ID=$(grep -oP 'const BUILD_ID: &str = "\K[^"]+' remote-daemon-proto/src/main.rs)
          echo "$BUILD_ID" > staged/cc-monitor-remote-x86_64.build_id
          echo "$BUILD_ID" > staged/cc-monitor-remote-aarch64.build_id
          cat staged/*.build_id
          file staged/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: embedded-daemons
          path: staged/cc-monitor-remote-*
          if-no-files-found: error
        # ↑ glob 同时带上 .build_id 清单（cc-monitor-remote-* 前缀匹配）

  build-windows:
    name: Build Windows artifacts
    needs: build-daemons
    runs-on: windows-latest
    permissions:
      contents: write   # 需要 write 才能上传 release 附件
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与 ci.yml 对齐（≥22.18 type-stripping），避免发版与 CI 用不同 node
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download cross-compiled daemons
        uses: actions/download-artifact@v4
        with:
          name: embedded-daemons
          path: daemon-artifacts

      # 放进 build.rs 期望的位置；缺任一 arch 就 fail——绝不静默发出「自动部署被关」的安装包。
      # v2.22.1 修复：**必须连 .build_id 清单一起拷**。此前只拷二进制不拷清单 →
      # build.rs 拿不到内嵌身份 → 运行时字节启发式又搜不到被优化的 BUILD_ID 明文 →
      # 「身份未知跳过自动部署」→ v2.19-v2.22 全部 CI 安装包的远端流模式静默降级
      # （bg 会话不可见 + 全量推流拥塞）。清单内容再与源码 BUILD_ID 对拍，嵌错比没嵌更糟。
      - name: Place + verify embedded daemons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/embedded-daemons | Out-Null
          foreach ($a in "x86_64","aarch64") {
            $f = Get-ChildItem -Recurse daemon-artifacts -Filter "cc-monitor-remote-$a" | Select-Object -First 1
            if (-not $f) { Write-Error "daemon artifact cc-monitor-remote-$a 缺失——内嵌失败，自动部署会被禁用"; exit 1 }
            Copy-Item $f.FullName "src-tauri/embedded-daemons/cc-monitor-remote-$a" -Force
            $m = Get-ChildItem -Recurse daemon-artifacts -Filter "cc-monitor-remote-$a.build_id" | Select-Object -First 1
            if (-not $m) { Write-Error ".build_id 清单缺失（$a）——身份未知的内嵌会被运行时拒绝，流模式将降级"; exit 1 }
            Copy-Item $m.FullName "src-tauri/embedded-daemons/cc-monitor-remote-$a.build_id" -Force
            Write-Host ("embedded {0} ({1} bytes)" -f $a, $f.Length)
          }
          $src = (Select-String -Path remote-daemon-proto/src/main.rs -Pattern 'const BUILD_ID: &str = "([^"]+)"').Matches[0].Groups[1].Value
          foreach ($a in "x86_64","aarch64") {
            $id = (Get-Content "src-tauri/embedded-daemons/cc-monitor-remote-$a.build_id" -Raw).Trim()
            if ($id -ne $src) { Write-Error "清单（$a）=$id ≠ 源码 BUILD_ID=$src"; exit 1 }
            Write-Host "manifest $a = $id (匹配源码)"
          }

      - name: npm install
        run: npm ci

      # 防 v2.4.2 漂移事故复发：tag 与**四处**版本号（package.json / tauri.conf.json /
      # Cargo.toml / Cargo.lock 的 monitor 包）必须完全一致，否则 fail step。
      - name: Verify version consistency with tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          # Cargo.lock 里 monitor 包：`name = "monitor"` 紧跟的 version 行
          $lockRaw = Get-Content src-tauri/Cargo.lock -Raw
          $lock = if ($lockRaw -match '(?m)^name = "monitor"\r?\nversion = "([^"]+)"') { $Matches[1] } else { '<missing>' }
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag -or $lock -ne $tag) {
            Write-Error "Version drift: tag=$tag package.json=$pkg tauri.conf=$conf Cargo.toml=$cargo Cargo.lock(monitor)=$lock"
            exit 1
          }
          Write-Host "Version OK: $tag (package.json / tauri.conf / Cargo.toml / Cargo.lock all agree)"

      # F05b：**本机后端 sidecar**（C7「没有 daemonless，本机也要有后端进程」）。
      #
      # 与上面那批 embedded-daemons 是**两件事**：那些是远端 SFTP 部署用的 musl 二进制
      # （`build.rs` 用 `include_bytes!` 内嵌进 monitor）；这一份是**装在用户自己机器上**、
      # 由 monitor 起来看住的本机后端（Tauri `externalBin` 打包，装完落在 monitor.exe 旁边）。
      #
      # ⚠ 必须原生编：daemon 在 Windows 上真编得过（2026-08-04 真机实测 exit=0、
      # release 2.6 MB，且跑起来发完整 hello；tmux 那半诚实发 `observation:"unobservable"`）。
      # ⚠ 名字必须带 target triple —— Tauri 的 sidecar 约定是「构建期带 triple、打包时剥掉」，
      # 而消费侧 `local_backend::resolve_with` 正是先找带 triple 的、再找裸名。
      # `--locked` 的理由与 build-daemons 那步同源（同一份 `remote-daemon-proto/Cargo.lock`、
      # 同一个 yanked 的 `crypto-bigint 0.7.3`），逐字见那里的头注 —— 这里不抄第二份。
      - name: Build local backend sidecar (native)
        working-directory: remote-daemon-proto
        run: cargo build --release --locked
      - name: Stage sidecar for externalBin
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host:').Line.Split(' ')[1]
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item remote-daemon-proto/target/release/cc-monitor-remote.exe `
            "src-tauri/binaries/cc-monitor-remote-$triple.exe" -Force
          Get-ChildItem src-tauri/binaries | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }

      # ── K-R42：**同一份二进制再铺一处** —— 让**裸 `monitor.exe`** 也带得上本机后端 ──────
      #
      # 09-10 干净 win11 上现打：装出来那份 `cc-monitor-remote.exe` **2 个进程在跑**，
      # 裸 `monitor.exe` **0 个**。上面那一步（`binaries/` → Tauri `externalBin`）只服务
      # **安装包**：它把 sidecar 放进 msi/nsis，装完落在 exe 同目录。裸 exe 拿不到那个文件。
      #
      # ⚠ **这一步不动上面那一步**：安装包那条路 09-10 实测是好的（2 个进程），
      # `externalBin` 仍然只住 `tauri.sidecar.conf.json`、仍然只在下面 `tauri build` 那行
      # 用 `--config` 注入（进主配置会让 `cargo test` 也要求当前 target 的二进制存在，
      # 那是 C2 反面钉住的）。本步**只是把同一个产物再拷一份到 `embedded-daemons/`**，
      # 由 `src-tauri/build.rs::embed_native_daemon` `include_bytes!` 进 exe。
      #
      # ⚠ **落点刻意不是 `embedded-daemons/`**，理由住 `build.rs` 的 `NATIVE_DAEMON_DIR` 头注
      # （一句话：那个目录名是另一条判据认「谁会起真 daemon」用的来历串，
      #  消费侧那个**字面量** `include_bytes!` 写下它会误伤那条判据）。
      #
      # ⚠ 三个文件**缺一不可**，名字定死在 `build.rs::NATIVE_DAEMON_DIR`/`NATIVE_DAEMON_FILE`：
      #   · `cc-monitor-native`           字节本身
      #   · `cc-monitor-native.build_id`  它的身份（决定落到用户盘上叫什么名字）
      #   · `cc-monitor-native.target`    它是给哪个 triple 编的（名字里没有 triple ⇒ 只能靠它）
      # 三个里少任何一个，`build.rs` 要么打一条 `cargo:warning=没有本机内嵌 daemon（…）`
      # 而构建照常绿（二进制缺席），要么当场 panic（清单缺席/对不上）。
      # ⇒ 下面那几条 `Test-Path` 就是把前一种也变成硬失败。
      #
      # ⚠ **诚实边界**：本步买到的是「铺了 · 身份与 target 都对得上 · build.rs 没 panic」。
      # 它**买不到**「裸 exe 在真 Windows 上真的起得来一个本机后端」—— 那要真机跑一趟。
      - name: Stage native daemon for self-extract
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host:').Line.Split(' ')[1]
          $dir = "src-tauri/native-daemon"
          $dst = "$dir/cc-monitor-native"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item remote-daemon-proto/target/release/cc-monitor-remote.exe $dst -Force
          $id = (Select-String -Path remote-daemon-proto/src/main.rs -Pattern 'const BUILD_ID: &str = "([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path "$dst.build_id" -Value $id
          Set-Content -Path "$dst.target" -Value $triple
          foreach ($f in $dst, "$dst.build_id", "$dst.target") {
            if (-not (Test-Path $f)) { Write-Error "本机内嵌 daemon 没铺全（缺 $f）——裸 exe 会回到「0 个本机后端进程」那个读数"; exit 1 }
          }
          Write-Host ("native daemon staged: {0} ({1} bytes, build_id={2}, target={3})" -f $dst, (Get-Item $dst).Length, $id, $triple)

      # tauri build 会顺序：npm run build (vite) → cargo build --release → bundle (msi + nsis)
      #
      # ⚠ `--config src-tauri/tauri.sidecar.conf.json` 是 F05b 刻意选的形态：`externalBin`
      # **不进主配置** —— `tauri-build` 要求当前 target 的 sidecar 在**编译期**就存在，
      # 进主配置会让 `cargo test` 也需要一份 daemon 二进制（实测报错
      # `resource path binaries/cc-monitor-remote-<triple> doesn't exist`），
      # 那等于把两半在构建期绑死，正是 C2 反面禁的事。⇒ 只在发版这一步注入。
      - name: tauri build
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json --bundles nsis,msi

      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          $bundleDir = "src-tauri\target\release\bundle"
          Get-ChildItem -Path "$bundleDir\nsis\*-setup.exe", "$bundleDir\msi\*.msi", "src-tauri\target\release\monitor.exe" -ErrorAction SilentlyContinue |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/monitor.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt

  # ────────────────────────────────────────────────────────────────────────────
  # L4（local-as-remote）：**Linux 产物**。
  #
  # ⚠ **订正（2026-09-09 现打）**：原话「本 job 从未真正跑过」**今天不成立** ——
  # v3.6.0 那次 Release run（`30679669587`，2026-08-01）里 `Build Linux artifacts (deb)`
  # **成功跑完，5m36s**（02:27:39 → 02:33:15，读的是云端 jobs API）。
  #
  # ⚠ **仍然成立的那一半，别跟着一起删**：本 job 只在 tag 时触发 ⇒ **本地一步都验不了**。
  # 而且**真正一次都没在 tag 上跑过的**是 v3.6.0 之后加进来的那些 —— 那之后本文件被改过两次、
  # 期间**没有再发过版**：`ae18878`（08-02，裸二进制上传）与 `e39253e`（08-04，sidecar）。
  # 具体是：两个 job 里的 `Build local backend sidecar (native)` + `Stage sidecar for externalBin`
  # 共四步、两处 `tauri build` 上的 `--config tauri.sidecar.conf.json`、以及裸二进制那条上传。
  # ⇒ 下面每一处设计都是为了「万一它坏了，坏得可见且不伤及发版」：
  #
  # 1. `needs: [build-daemons, build-windows]` —— **串在 Windows 之后**，两个理由：
  #    ① Release 是 `build-windows` 创建的；两个 job 同时 `action-gh-release` 会竞争同一个
  #       release，串起来就没这个竞态。
  #    ② `build-windows` 里那道**四处版本号与 tag 一致**的检查因此**被继承**——版本漂了它
  #       先失败，本 job 根本不会起。**不重复实现那道检查**（重复 = 又一个会漂的副本）。
  # 2. 本 job 失败**不会**让 release 消失（Windows 那半已经建好并传完了），
  #    表现是「workflow 红 + release 里少了 .deb」——**可见的缺失，不是静默降级**。
  # 3. **格式选 deb 而不是 AppImage**。STATUS 里建议过 AppImage（单文件、不管发行版依赖），
  #    那个好处是真的；但 AppImage 打包要**下载 linuxdeploy** + 依赖 `libfuse2`
  #    （Ubuntu 24.04 已不默认提供）——在一个**没法在本地验证**的 job 上，
  #    那是两个额外的失败面。deb 用 Tauri 自带的纯 Rust 打包器，零外部工具。
  #    ⇒ **先把 deb 跑通，AppImage 留作后续**（已登记）。
  # 4. **不动 `src-tauri/tauri.conf.json` 的 `bundle.targets`**（那是 Windows 主路径共享的
  #    最高风险面）；格式在命令行上给。
  build-linux:
    name: Build Linux artifacts (deb)
    needs: [build-daemons, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 追加附件到已存在的 release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与 build-windows / ci.yml 对齐
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 同 ci.yml::linux-app-build 那四个（构建期必需，不是打包才要）。
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Download cross-compiled daemons
        uses: actions/download-artifact@v4
        with:
          name: embedded-daemons
          path: daemon-artifacts

      # 只做**放置**，不重做校验：`build-windows` 已经对**同一批 artifact** verify 过
      #（清单存在 + 清单内容 == 源码 BUILD_ID），而本 job `needs` 它 ⇒ 那道检查已经过了。
      # 重写一份 bash 版校验只会多一个会漂的副本。缺文件仍然 fail（`cp` 会失败）。
      - name: Place embedded daemons
        run: |
          set -euo pipefail
          mkdir -p src-tauri/embedded-daemons
          for a in x86_64 aarch64; do
            bin=$(find daemon-artifacts -name "cc-monitor-remote-$a" -type f | head -1)
            man=$(find daemon-artifacts -name "cc-monitor-remote-$a.build_id" -type f | head -1)
            [ -n "$bin" ] && [ -n "$man" ] || { echo "daemon artifact 或清单缺失（$a）"; exit 1; }
            cp "$bin" "src-tauri/embedded-daemons/cc-monitor-remote-$a"
            cp "$man" "src-tauri/embedded-daemons/cc-monitor-remote-$a.build_id"
            echo "embedded $a = $(cat "$man")"
          done

      - name: npm ci
        run: npm ci

      # F05b：本机后端 sidecar（理由同 build-windows 那两步，见那里的头注）。
      # ⚠ Linux 侧同样必须做 —— `externalBin` 一旦注入，`tauri build` 就要求**当前 target**
      # 的那份二进制存在；少了它这一步会以 `resource path ... doesn't exist` 直接失败。
      # `--locked` 同上：理由住 build-daemons 那步的头注，这里不抄第二份。
      - name: Build local backend sidecar (native)
        working-directory: remote-daemon-proto
        run: cargo build --release --locked
      - name: Stage sidecar for externalBin
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp remote-daemon-proto/target/release/cc-monitor-remote \
             "src-tauri/binaries/cc-monitor-remote-$triple"
          ls -l src-tauri/binaries

      - name: tauri build (deb)
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json --bundles deb

      - name: Compute SHA256 checksums (Linux)
        run: |
          set -euo pipefail
          : > SHA256SUMS-linux.txt
          # 二进制名是 cargo 包名 `monitor`（不是 productName `cc-monitor`）——
          # 与 build-windows 里的 `monitor.exe` 同源，本地 `target/debug/monitor` 已核实。
          for f in src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/monitor; do
            [ -f "$f" ] || continue
            # 只把**路径**收成 basename，别顺手把 hash 也剥了
            #（`sed 's#.*/##'` 是贪婪的，会把 "hash  path/to/" 整段吃掉）。
            sha256sum "$f" | awk '{n = split($2, p, "/"); print $1 "  " p[n]}' >> SHA256SUMS-linux.txt
          done
          cat SHA256SUMS-linux.txt

      # DN-8（aterm 2026-07-31 请求）：daemon 的 **musl 二进制也挂成 Release 资产**。
      # 此前它们只作为 CI artifact 传给 build-windows 内嵌 ⇒ 外部项目（aterm 走自部署）
      # 拿不到，只能自己装 zig 交叉编译一遍。
      #
      # **挂在本 job 而不是 build-daemons**：后者跑在 build-windows **之前**，在那里调
      # `action-gh-release` 会①抢先创建 release，正是本文件上面那段注释要避开的竞态；
      # ②**绕过** build-windows 里「四处版本号与 tag 一致」那道检查。本 job
      # `needs: [build-daemons, build-windows]`，两条都天然继承。artifact 也已经下载好了。
      #
      # 🔴 **`files: |` 里 `#` 不是注释**（2026-09-09 订正）：那是 YAML 字面块，
      # 整行会当成**文件 glob** 交给 `action-gh-release`。下面这三行原本就写在块里，
      # 靠 `fail_on_unmatched_files` 默认 `false` 才只打 warning 没炸。
      # ⚠ 它们与它们下面那条 `monitor` 一起是 `ae18878`（08-02）加的，而最后一次发版是
      # v3.6.0（08-01）⇒ **这一段一次都没在 tag 上跑过**，那三条 warning 也就从没人看见。搬出来。
      # U5-走查：**裸二进制此前算了 hash 却没上传** —— `SHA256SUMS-linux.txt` 里有它那一行，
      # 而 Release 页上没有那个文件，用户照校验和逐个核就会卡在这儿。
      # 补上传（与 Windows 侧 `monitor.exe` 对称：那边一直是「安装器 + 裸二进制」两样都给）。
      - name: Append Linux artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/monitor
            SHA256SUMS-linux.txt
            daemon-artifacts/cc-monitor-remote-x86_64
            daemon-artifacts/cc-monitor-remote-aarch64
            daemon-artifacts/cc-monitor-remote-x86_64.build_id
            daemon-artifacts/cc-monitor-remote-aarch64.build_id
