name: CI

on:
  push:
    branches: [main, next]
    tags: ['v*']
  pull_request:
    branches: [main]

# `next` 是候选分支（10-10 起）：合并树先强推到 `next`，这里跑与 main 同一套 job；全绿了才把 main 快进到同一个提交。
#   ⇒ main 只收 CI 绿过的提交。本文件因此不许按分支 / 事件分叉（不写 `if:` · `github.ref`），也不写仓、不打标签、不发版
#   （发版只走 release.yml 的标签触发）。判据：`shared_crate_registry_tests.rs::ci_runs_the_same_jobs_on_the_candidate_branch_and_never_releases_from_it`。

# Windows-only：cc-monitor v1 不支持 Linux/macOS（核心 Win32 调用）。
# 跨平台支持是 v2 计划，届时这里再加 matrix.os。

# 显式 bash：GitHub 对显式指定的 bash 注入 `-eo pipefail`（默认 shell 只有 -e）。
# 防未来某步加 `cargo test | tee` 这类管道时静默吞掉左侧失败（本仓踩过：裸管道
# 掩盖编译失败误报全绿）。与 job 级 working-directory 默认按属性合并,互不覆盖。
defaults:
  run:
    shell: bash

jobs:
  # ── 每个 job 一条 `timeout-minutes` ─────────────────────────────────────────
  #
  # 🔴 **本文件先前一条都没有**（`grep -c timeout-minutes` = **0**，8 个 job）
  #    ⇒ 挂住的那一个会一直跑到 **GitHub 的 6 小时默认上限**。
  #
  # ## 它 09-10 真的发生了一次，而且拦下的正是我们等着看的那个读数
  #
  # run `34462442459` @ `32d527c`：`cargo test` 这一步跑了 **27 分钟仍未完**，
  # 日志里只有一行有用的 ——
  #   `test cc_bus::tests::a_timed_out_local_read_does_not_leave_an_orphan_behind
  #    has been running for over 60 seconds`
  # 对照：**同一台 windows runner 上一趟只用 4 分 26 秒**（run `34452852951`）。
  # 最后是人去按的取消键。
  #
  # ★ 一条会**挂死**的测试比一条**红**的测试更坏：红的会说出哪里坏了，
  #   挂死的什么都不说，还把它后面的步骤全部拖成 `skipped`。
  #
  # ## 这几个数是量出来的，不是拍的
  #
  # 取 09-10 三趟（`34462442459` / `34452852951` / `34451929158`）各 job 的真实墙钟，
  # **取上界 × 约 4，下限 15 分钟**：
  #   Rust lint + test 满跑 **8m** ⇒ 35   ·  E2E tmux + Rust **6m** ⇒ 25
  #   Frontend **4–5m** ⇒ 20              ·  其余（backend · linux-app-build ·
  #   e2e-smoke · e2e-tmux · weak-net）**0–2m** ⇒ 15
  #
  # ⚠ **别把它读成「跑这么久就算慢」** —— 它是**挂死的止损闸**，不是性能预算。
  #   正常波动（缓存未命中、runner 排队）要留得下，所以倍数给到 4。
  #   真有一天正常跑到超时，那说明该重新量一遍，不是该悄悄把数字调大。
  #
  # ## 装 apt 包的那几步另有一道**步骤级**的闸（10-07 加）
  #
  # 上面这些数都是 **job 级**的。10-07 两回 runner 上 apt 挂住，`rust-linux` 与 `linux-app-build`
  # 都是整个 job 等满上限才被取消 —— 挂在装依赖上，后面的步骤一步没跑，等的那半个小时什么都没换来。
  # 实测（主线 2e9f26d1f）不是整个卡死，是从镜像下单个小包时停住（32 kB 的包前停了 625 秒）。
  # ⇒ 装 apt 包一律经 `tests/scripts/apt-install.sh`（apt 带 20 秒的连接 / 读超时与重试、每趟 update / install 套 `timeout`、
  #   一趟没成歇一下再来、最多 3 趟；重试的写法只住那一处）。
  # 10-08 又一回（主线 83f27b4bc）：不是停住，是镜像**很慢但在动**（约 125 KB/s），25.5 MB 的 webkit 包被每趟 200 秒的闸连杀三趟。
  # ⇒ 那份脚本改成一次调用一个总时限（20 分钟，照最慢实测装得完一个 job 最多约 123 MB；算法写在它的头注），
  #   装包那一步 `timeout-minutes: 21`，所在 job 的时限 = 原来的数 ＋ 20；
  #   并且下好的 .deb 用官方 `actions/cache@v4` 缓存：每个装包的 job 先一步 `apt-install.sh --cache-key $APT_PKGS` 算键、
  #   再一步 `actions/cache@v4` 放回 / 存下下载目录，命中时不再下载。包清单一个 job 一份（job 级 `env: APT_PKGS`），
  #   算键与装包读同一份，键跟着清单走。`release.yml` 的 `build-linux` 同一写法。
  #   判据：`shared_crate_registry_tests.rs::every_apt_install_in_ci_sits_in_a_step_with_its_own_timeout`
  #   （两份 workflow 里零处直写 `apt-get`、装包的每一步有自己的 `timeout-minutes`，比脚本总时限长、比 job 短）
  #   · `every_job_that_installs_apt_packages_restores_the_deb_cache_first`（装包的 job 前面都有算键与缓存那两步）。
  rust:
    name: Rust lint + test
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/frontend/shell
    steps:
      - uses: actions/checkout@v4
        # 🔴 `fetch-depth: 0` 在这个 job 上是**判据的输入**，不是习惯问题。
        # `scanning_guard_registry::the_pending_ratchet_never_turns_backwards` 有一格
        # 走 `git log --format=%h -- <path>` 数本文件的历史版本（地板 5，09-06 实测 9 份）。
        # checkout 默认 depth 1 ⇒ 只回得出 1 个 sha ⇒ 那一格红 —— 09-09 云端实测就是它，
        # 而它的诊断第一条自己就点名「浅克隆把历史截掉了（要 fetch-depth: 0）」。
        # ⚠ 判据自己明写「不许靠调低地板让今天好过」⇒ 要修的是这里，不是那个 5。
        # ⚠ 只加在本 job：另外两处 checkout 的 job 里没有读 git 历史的判据（09-09 现打），
        #    全仓加上去只是让每次 clone 更大而买不到东西。真有新的历史面判据落到别的 job，
        #    那一格会红并点名这一条，到时候再加。
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/shell

      # fmt 已经过项目历史校准，强制约束
      # G2（Phase G 代码工程审计）：这六个共享 crate 现在是**真 workspace member**
      # （`src/frontend/shell/Cargo.toml` 的 `[workspace]`）。收敛前它们只是 path 依赖 ——
      # `cargo metadata` 的 `workspace_members` 只有 `monitor` 一项，`-p` 能跑靠的是
      # cargo 允许选中依赖图里的非 member 包，**不是 workspace 机制**。
      # ⇒ 原来 ~17 条 `--manifest-path`/`-p` 收敛成下面三条。
      #
      # ⚠ 收敛前的教训留在这里，别当成历史：`branch-core` 曾**进了 test 门禁却没进
      # fmt/clippy**（当时正好有 3 处未格式化）；`usage-core`/`acct-core` 曾**一条 CI
      # 步骤都没有**，它们的 8+4 条测试在 CI 里等于不存在。根因就是没有 `[workspace]`
      # —— 每加一个 crate 都要人记得补三处。**现在补不补由 cargo 自己决定。**
      - name: cargo fmt --check（整个 workspace）
        run: cargo fmt --all --check

      - name: cargo clippy（整个 workspace）
        run: cargo clippy --workspace --all-targets

      - name: cargo test（整个 workspace）
        run: cargo test --workspace --no-fail-fast

      # C05（rust-ts-boundary）：**生成物必须最新**。上一步的 `cargo test --workspace` 会跑
      # `ts-rs` 的导出测试、把 `src/frontend/ui/generated/**` 重新写一遍；这里断言它与已提交的版本一致。
      #
      # **为什么这一半在这个 job、另一半在 frontend job**：这个性质要
      # 「先重新生成、再 tsc」，而**没有任何 job 同时有 Rust 和 node**
      # （给本 job 加 `npm ci` 是分钟级；给 frontend job 加整套 Tauri 编译是 CI 里最贵的东西）。
      # 所以拆成两半：本步保证「已提交的生成物 == 从 Rust 源生成的」，
      # frontend job 的 `tsc` 保证「TS 消费方 == 已提交的生成物」，**两者合起来**就是
      # 「TS 消费方 == Rust 源」。而 `git diff` 不需要 node ⇒ 这一半的代价 ≈ 一条 git 命令。
      #
      # 立项理由（C01 Phase D 审计变异实测）：serde-rename 一个字段而**不重新生成**
      # ⇒ cargo 绿 · tsc 绿 · 守卫绿 · npm 819 全绿，**而生产里 UI 标签会变空**。
      # 失效模式不是「没门禁」，是「所有现有门禁都保持绿色」。
      - name: 生成物必须最新（C05；改了 Rust 就得重新生成并提交）
        run: |
          git diff --exit-code -- ../src/frontend/ui/generated/ || {
            echo "::error::src/frontend/ui/generated/ 与 Rust 源不一致。改了带 #[derive(ts_rs::TS)] 的类型后，请跑 'npm run gen:types' 并把 src/frontend/ui/generated/ 一起提交。"
            git diff --stat -- ../src/frontend/ui/generated/
            exit 1
          }

  # ── Linux 那几个 job 一律**调本地门禁**（`GATE_ONLY=<格>`），命令只住 `tests/scripts/gate.sh` 一处 ──
  #
  # 门禁的格本来就能单跑；一个 job 点哪几格，这一行就是全部的登记（拼错一个格名门禁自己判红）。
  # 裁决行会是 `GATE: PARTIAL`（只跑了点到的那几格），退出码 0 = 点到的全绿。
  # Windows 那两个 job（`rust` · `frontend`）照旧自己写命令：门禁跑不了真 Windows。
  #
  # ⚠ `fetch-depth: 0` 与 `rust` job 同一条理由：几条判据拿 git 历史当权威，浅克隆下它们会红。
  # ⚠ apt 那几个包：monitor 是 Tauri app crate，`cargo test` 也得先把它编出来（缺 webkit2gtk 的 pkg-config 会红在走到我们代码之前）；
  #   起真窗口的那几条要 Xvfb / xdotool / CJK 字体。
  # ⚠ 门禁的 `cargo` 那一格带 `--lib`（不跑 doctest 与 bin 的测试档）；那两档由 `rust` job 在 Windows 上跑全量。
  rust-linux:
    name: Rust test (Linux, gate cells)
    runs-on: ubuntu-latest
    timeout-minutes: 55      # 35 ＋ 装 apt 包最坏 20 分钟；口径见 `rust` 那一格的头注末尾
    env:
      # 构建依赖（webkit2gtk 的 pkg-config 等）＋ 起真窗口要的 Xvfb · xdotool · CJK 字体，一份清单、一个缓存
      APT_PKGS: >-
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
        xvfb xdotool fonts-noto-cjk libxkbcommon-x11-0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/shell

      - name: apt 包缓存 · 算键
        id: apt-key
        run: bash tests/scripts/apt-install.sh --cache-key $APT_PKGS >> "$GITHUB_OUTPUT"

      - name: apt 包缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.restore }}

      - name: Install Linux build + test-time deps
        timeout-minutes: 21   # 装包的闸（步骤级）；口径见文件头 `timeout-minutes` 那段末尾
        run: bash tests/scripts/apt-install.sh $APT_PKGS

      - name: 门禁 · monitor 那棵树的测试
        env:
          GATE_ONLY: cargo comm-boundary test-tiers generated deadcode
        run: bash tests/scripts/gate.sh


  frontend:
    name: Frontend typecheck + build
    runs-on: windows-latest
    timeout-minutes: 20      # 实测 4–5m（09-10 三趟）；口径见 `rust` 那一格的头注
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # ≥22.18：内置 type-stripping，无需 ts-node 直接跑 .test.ts
          cache: 'npm'

      - run: npm ci

      # 供应链门禁：只审**生产依赖**（会打进 bundle 的，如 dompurify/marked/highlight.js/katex）
      # 的 high 漏洞；dev 依赖（vite/vitest/jsdom 等不进产物）不门禁，避免被它们的 advisory
      # 误伤发布。修复：本地 `npm audit fix` 后提交 package-lock.json。
      - name: npm audit (production deps, high)
        run: npm audit --omit=dev --audit-level=high

      - run: npx tsc --noEmit

      # F08b：ESLint（flat config + typescript-eslint）。基线清到 0 之后**改成会拦**：
      # 去掉原来的 `|| true`，有一条错就红（`tests/frontend/ui/eslint-baseline.vitest.ts` ③ 钉着这一步的写法）。
      # 此前它是顾问式（既有告警作基线、`|| true` 不红 CI），沿革见下。
      #
      # **E83（2026-08-01）：作用面从 `eslint src` 放开到 `eslint .`。** 本仓 `eslint.config.js`
      # 的 `ignores` 一直是**仓级**写法（逐条列 dist / node_modules / src/frontend/shell / …），
      # 而脚本只跑 `src` ⇒ 那份意图从没兑现，`tests/e2e/**/*.mjs` 里 39 个 `no-undef` 永远没人看得到，
      # 且它们一个真问题都不是（纯缺一段 node/browser globals）。补完 globals 后
      # **全仓实测当时仍是 7 项**，基线数字不变、覆盖面变大。那天剩三项：
      # `src/frontend/ui/settings/machine-aliases.ts` 那四处空 catch 随原「终端集成」记住上次选择的那段代码删了。
      # 那天剩两项：`src/frontend/ui/shell-quote.ts` 那处 `no-control-regex` 随 `isValidConfigDir` 删了。
      # 那天剩一项：写类工具口径的前端那份测试随被测对象（搬进后端）整份删了。
      # 〔发版后〕今天全仓 0 项：`render.ts` 那处 `no-control-regex` 随代码 stub 的哨兵换成非字符 `\uFDD0` 没了。
      - name: eslint (blocking, baseline 0)
        run: npm run lint

      # F08b：Stylelint（`src/**/*.css`）。**这一步本身仍是顾问式**（`|| true`，结构上不会红），
      # 不 --fix 避免全量 churn。
      #
      # **真正会红的不再是这一步**：`tests/frontend/ui/css-ledger.vitest.ts` 把报错与一张登记表做两向相等（`STYLELINT_KNOWN`；
      # `no-descending-specificity` 另由同一份 ④b 的例外表管），它跟着下面那步 `unit tests` 一起跑 ⇒ 阻断。
      # 留着本步的理由：它把逐条报错印在 CI 日志里。
      - name: stylelint (advisory, baseline)
        run: npm run lint:css || true

      # 全部前端单测：① 纯函数 node 测试（branching 主线折叠 #8/#22/#25/#26、diff 渲染 #14、
      # API 报错卡 #21、remote-health 节流、remote-launch 命令构造）；② tabs 生命周期 DOM 测试
      # （vitest+jsdom，守护 resume 复活 / 归档-only 关闭 / origin 门控等本轮 bug 高发区）。
      - name: unit tests (node pure-fn + vitest DOM)
        run: npm test

      # F08b：覆盖率**地板棘轮（阻断）**——阈值设在当前值下方（见 vitest.config.ts），只挡明显
      # 回归（新增大块无测代码），不追高。确定性套件 + 余量，正常不会误红。
      - name: coverage floor (vitest jsdom)
        run: npm run coverage

      # audit-0805 F17：**逐文件**地板 + 0% 文件递减棘轮。
      # 上一步那个阈值是**聚合值** —— 187 个文件里单个模块掉到 0%，总数只动零点几个点，
      # 而地板留着 2-3 点余量 ⇒ 门禁一声不响。`vitest.config.ts` 那段注释自己就写着
      # 「收紧留后续按核心 DOM 模块 per-file」，这一步就是那个「后续」。
      # ⚠ 同样**无 `|| true`**：它是真阻断，不是 advisory。
      - name: coverage per-file floors + zero-coverage ratchet
        run: node tests/scripts/assert-coverage-floors.mjs

      # vite build 验证产物可生成（不打包 exe，那个 5+ 分钟太慢；
      # 完整 tauri build 留给 tag 触发的 release 工作流）
      - name: vite build (dist/)
        run: npm run build

  # 远端后端是这套体系里**唯一以 Linux 为真实目标**的部分（inotify / aarch64），故单独跑在 ubuntu。
  # fmt / clippy / test 调门禁；跨 target 到 `x86_64-pc-windows-msvc` 的 check 门禁做不了（本机没有 MSVC 那一套），留在这里。
  backend:
    name: Remote backend (Linux) lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 实测 0–1m（09-10 三趟）；口径见 `rust` 那一格的头注
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # U4a：跨 target check 需要 Windows 的 std。**只 check 不链接**，
          # 所以在 ubuntu 上就能跑、不需要 Windows runner，成本近零。
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend


      # ★ 08-25（`K-H1` / `KU10` 走「甲」）：**给这个 ubuntu job 装一个能给 Windows 编 C 的交叉工具链。**
      #
      # 为什么突然要它：backend 引入 TLS（`rustls` → `ring`）之后，`ring` 的 build script 要**编 C**，
      # 而 cc-rs 在 Linux 上给 `*-pc-windows-msvc` 找不到 MSVC 的工具 ⇒ 下面那条跨 target check
      # **必红**（本机实测 exit 101，`error occurred in cc-rs: failed to find tool "lib.exe"`）。
      # ⚠ 那个红**不是**我们的代码坏了：失败输出里 `Checking cc-monitor-backend` 命中 **0**，
      #   它根本没走到我们这一行 ⇒ 「平台线的唯一真判据」当时等于**没了**。
      #
      # 为什么是 zig：它一个包同时给齐三样（本机逐条实测过）——
      #   ① `zig cc` = clang，`-target x86_64-windows-gnu` 能编出 **COFF** 目标文件；
      #   ② 自带 mingw-w64 的 libc 头（不需要下载微软 SDK，也就不需要 `xwin` 那一步下载）；
      #   ③ `zig lib` = LLVM 的 **lib.exe 驱动**，正是 cc-rs 缺的那个归档器。
      # ⚠ 只给归档器是**不够**的：实测把 `AR` 指向 GNU `ar` 或 `llvm-lib`，
      #   宿主 gcc 产的是 ELF，LIB 驱动当场 `not a COFF object` ⇒ 必须有一个真发 COFF 的编译器。
      #
      # ⚠ 版本与 `release.yml` 那步**刻意保持一致**（`mlugg/setup-zig@v1` + zig `0.14.0`）：
      # 那一步已经在本仓 CI 上跑过，少一个会自己变的量。
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      # ★ U4a（2026-08-01）
      # **位置**：排在门禁那一步之前 —— 它最便宜、最确定；排在后面会被最不稳的那步（cargo test 真起 tmux、真 spawn 进程）遮住。
      # 原注：**§1.1 第一条解耦线（平台线）的唯一真判据。**
      #
      # 计划自审 §0.5-3 打掉过一个安慰剂式的机检：「`platform/` 之外出现平台 cfg 就红」
      # **抓不到 `pidfd_open`** —— 它是**无条件编译**的 Linux-only 代码，一个 cfg 都没有。
      # 能证明「平台依赖真的被隔离了」的只有编译器。
      #
      # **必须 `--all-targets`**：不加的话只编生产段，而实测 12 个错里有 1 个在测试段
      # （`libc::getuid`）。少这个 flag 会让判据漏掉整个测试面。
      #
      # 这一步之前，backend 在 Windows 上 **RC=101 / 12 个错**，而 CI 从来不知道。
      - name: cargo check（跨 target：Windows 编得过 —— 平台线的真判据）
        working-directory: src/backend
        # ★ 08-25：这三个环境变量是上面那步 zig 的用法，**不改这条命令一个字符** ——
        # `shared_crate_registry::the_windows_cross_target_signal_covers_only_the_backend` 钉着下面这条 `run:`，
        # 换写法（如 `cargo xwin check …`）会把它打红。
        #
        # ★★ 逐字说清这一步今天证什么、**不**证什么（别让下一个人把它读大一格）：
        #   · **证**：我们自己的 Rust 代码（含中转与 TLS）在 `x86_64-pc-windows-msvc` 上
        #     `--all-targets` 全量类型检查通过。本机实测 exit **0**，`Checking cc-monitor-backend` 命中 **1**
        #     （⚠ 包名是 `cc-monitor-backend`，目录名才是 `src/backend` —— 拿目录名当 needle 会永远数出 0）。
        #   · **不证**：`ring` 的那点 C 在 **MSVC ABI** 下编得过。这里编的是 **windows-gnu ABI 的 COFF**，
        #     因为 zig 不带 MSVC 的 libc 头（实测 `-target x86_64-windows-msvc` 直接
        #     `'string.h' file not found`）。`cargo check` **不链接** ⇒ 那份 `.lib` 从头到尾没人用，
        #     它存在只是为了让 build script 走完、好让检查继续走到我们的代码。
        #   · 「`ring` 在真 Windows 上编得过」这一格由上游与真机负责：08-25 在一台真 Windows 上跑
        #     同一份代码 `cargo check --all-targets` ⇒ EXIT=0 / 0 error（读数住 `KU10`）。
        #   · ⇒ 这一步**没有**因此变弱：它守的一直是「我们的代码在 Windows 上编得过」，那一半一个字没动。
        env:
          CC_x86_64_pc_windows_msvc: zig cc
          CFLAGS_x86_64_pc_windows_msvc: --target=x86_64-windows-gnu
          AR_x86_64_pc_windows_msvc: zig lib
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

      - name: 门禁 · 后端 fmt / clippy / test
        env:
          GATE_ONLY: fmt-backend clippy-backend backend deadcode-backend
        run: bash tests/scripts/gate.sh

  # L4（local-as-remote）：**Linux 宿主上 app 能不能构建**的持续信号（`release.yml` 的 Linux 打包 job 只在 tag 时跑）。
  # 刻意只 build 不 bundle。`npm run build`（tsc ＋ vite）先产出 `dist/`，app crate 编译时要它。
  linux-app-build:
    name: Linux app build (no bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 35      # 实测 1–2m（09-10 三趟）⇒ 15，＋ 装 apt 包最坏 20 分钟；口径见 `rust` 那一格的头注
    env:
      APT_PKGS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与其余 job 对齐
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/shell

      - name: apt 包缓存 · 算键
        id: apt-key
        run: bash tests/scripts/apt-install.sh --cache-key $APT_PKGS >> "$GITHUB_OUTPUT"

      - name: apt 包缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.restore }}

      - name: Install Linux build deps
        timeout-minutes: 21   # 装包的闸（步骤级）；口径见文件头 `timeout-minutes` 那段末尾
        run: bash tests/scripts/apt-install.sh $APT_PKGS

      - run: npm ci

      - name: npm run build (tsc + vite)
        run: npm run build

      - name: 门禁 · 类型检查 ＋ 真编真链 app
        env:
          GATE_ONLY: tsc appbuild
        run: bash tests/scripts/gate.sh

  # 门禁里只读盘上文本的那几格（shellcheck · py 语法与可执行位 · hooks · 复制族 · 发版守卫 · 平台承诺 · 安装面）。
  static-gate:
    name: Gate static cells
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 全是读盘上文本的判据，本机以秒计；口径见 `rust` 那一格的头注
    steps:
      - uses: actions/checkout@v4

      - name: 门禁 · 静态那几格
        env:
          GATE_ONLY: hooks copy2 shellcheck e2e-smoke release-gate platform installface
        run: bash tests/scripts/gate.sh

  # 真机 e2e：每一套在门禁里一行 `run_e2e <套件>`；`GATE_ONLY=e2e` 点名全部套件（名单不在这里抄第二份）。
  # 门禁自己先编后端二进制（e2e 的被测对象），再逐套跑；判法是退出码 0 ＋ `合计 PASS=<n> FAIL=0` ＋ `n > 0`。
  e2e:
    name: E2E real-machine (tmux + backend, gate)
    runs-on: ubuntu-latest
    timeout-minutes: 50      # 旧 e2e-tmux-rust 实测 6m（09-10 三趟），这里多了几套 ⇒ 30，＋ 装 apt 包最坏 20 分钟；口径见 `rust` 那一格的头注
    env:
      APT_PKGS: >-
        tmux jq libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential
        curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: apt 包缓存 · 算键
        id: apt-key
        run: bash tests/scripts/apt-install.sh --cache-key $APT_PKGS >> "$GITHUB_OUTPUT"

      - name: apt 包缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.restore }}

      - name: install tmux + jq + build deps
        timeout-minutes: 21   # 同 rust-linux 那一步
        run: bash tests/scripts/apt-install.sh $APT_PKGS

      - name: 门禁 · 全部真机 e2e ＋ 会话环境不漏进门禁
        env:
          GATE_ONLY: e2e env-sandbox
        run: bash tests/scripts/gate.sh

  weak-net:
    name: E2E weak-net rig (docker + netem, gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 实测 0m（09-10 三趟）；口径见 `rust` 那一格的头注
    steps:
      - uses: actions/checkout@v4

      - name: 门禁 · 弱网台架
        env:
          GATE_ONLY: weak-net
        run: bash tests/scripts/gate.sh

# 注：曾加过一个 `cargo audit` 信息性 job，但对 Windows-only Tauri 应用而言它**永久红**——
# Cargo.lock 含大量 Tauri 的 Linux GTK 传递依赖（atk/gdk/gtk-rs，标记 unmaintained，且
# 在 Windows 根本不编译/不打包），淹没了信号。已移除；已知 Rust 依赖 advisory 残留记入
# SECURITY.md（rsa RUSTSEC-2023-0071 Marvin timing 侧信道——上游无修复版、本场景低风险；
# gtk-rs unmaintained）。前端供应链门禁仍保留（上面 `npm audit --omit=dev`，审生产依赖）。
# 需要时可本地 `cargo audit` 人工查（cargo install cargo-audit）。
