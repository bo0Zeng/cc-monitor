name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Windows-only：cc-monitor v1 不支持 Linux/macOS（核心 Win32 调用）。
# 跨平台支持是 v2 计划，届时这里再加 matrix.os。
jobs:
  rust:
    name: Rust lint + test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # fmt 已经过项目历史校准，强制约束
      - name: cargo fmt --check
        run: cargo fmt --check

      # clippy 仅警告，不强制（项目尚未做完整 lint 整治）
      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test --all

  frontend:
    name: Frontend typecheck + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # ≥22.18：内置 type-stripping，无需 ts-node 直接跑 .test.ts
          cache: 'npm'

      - run: npm ci

      # 供应链门禁：只审**生产依赖**（会打进 bundle 的，如 dompurify/marked/highlight.js/katex）
      # 的 high 漏洞；dev 依赖（vite/vitest/jsdom 等不进产物）不门禁，避免被它们的 advisory
      # 误伤发布。修复：本地 `npm audit fix` 后提交 package-lock.json。
      - name: npm audit (production deps, high)
        run: npm audit --omit=dev --audit-level=high

      - run: npx tsc --noEmit

      # 全部前端单测：① 纯函数 node 测试（branching 主线折叠 #8/#22/#25/#26、diff 渲染 #14、
      # API 报错卡 #21、remote-health 节流、remote-resume 命令）；② tabs 生命周期 DOM 测试
      # （vitest+jsdom，守护 resume 复活 / 归档-only 关闭 / origin 门控等本轮 bug 高发区）。
      - name: unit tests (node pure-fn + vitest DOM)
        run: npm test

      # vite build 验证产物可生成（不打包 exe，那个 5+ 分钟太慢；
      # 完整 tauri build 留给 tag 触发的 release 工作流）
      - name: vite build (dist/)
        run: npm run build

  # 远端 daemon 是这套体系里**唯一以 Linux 为真实目标**的部分（inotify / aarch64），
  # 故单独跑在 ubuntu。standalone crate（无 root workspace），不被上面 Windows job 触及。
  daemon:
    name: Remote daemon (Linux) lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-daemon-proto
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote-daemon-proto

      - name: cargo fmt --check
        run: cargo fmt --check

      # clippy 同后端 job：仅警告，不强制
      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test

  # Rust 依赖的 RUSTSEC 漏洞审计（russh / ring / crypto 等）。**信息性、不阻断**——
  # continue-on-error 让它出现 advisory 时单独红、但不挡 CI/发布；维护者据此人工评估
  #（如 primefield pre-release pin、上游未修的 transitive advisory）。两个独立 crate 各审其 lock。
  cargo-audit:
    name: Cargo advisory audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (src-tauri)
        run: cargo audit --file src-tauri/Cargo.lock
      - name: cargo audit (remote-daemon-proto)
        run: cargo audit --file remote-daemon-proto/Cargo.lock
