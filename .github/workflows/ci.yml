name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Windows-only：cc-monitor v1 不支持 Linux/macOS（核心 Win32 调用）。
# 跨平台支持是 v2 计划，届时这里再加 matrix.os。

# 显式 bash：GitHub 对显式指定的 bash 注入 `-eo pipefail`（默认 shell 只有 -e）。
# 防未来某步加 `cargo test | tee` 这类管道时静默吞掉左侧失败（本仓踩过：裸管道
# 掩盖编译失败误报全绿）。与 job 级 working-directory 默认按属性合并,互不覆盖。
defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust lint + test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # fmt 已经过项目历史校准，强制约束
      - name: cargo fmt --check
        run: cargo fmt --check

      # clippy 仅警告，不强制（项目尚未做完整 lint 整治）
      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test --all

      # C05（rust-ts-boundary）：**生成物必须最新**。上一步的 `cargo test --all` 会跑
      # `ts-rs` 的导出测试、把 `src/generated/**` 重新写一遍；这里断言它与已提交的版本一致。
      #
      # **为什么这一半在这个 job、另一半在 frontend job**：这个性质要
      # 「先重新生成、再 tsc」，而**没有任何 job 同时有 Rust 和 node**
      # （给本 job 加 `npm ci` 是分钟级；给 frontend job 加整套 Tauri 编译是 CI 里最贵的东西）。
      # 所以拆成两半：本步保证「已提交的生成物 == 从 Rust 源生成的」，
      # frontend job 的 `tsc` 保证「TS 消费方 == 已提交的生成物」，**两者合起来**就是
      # 「TS 消费方 == Rust 源」。而 `git diff` 不需要 node ⇒ 这一半的代价 ≈ 一条 git 命令。
      #
      # 立项理由（C01 Phase D 审计变异实测）：serde-rename 一个字段而**不重新生成**
      # ⇒ cargo 绿 · tsc 绿 · 守卫绿 · npm 819 全绿，**而生产里 UI 标签会变空**。
      # 失效模式不是「没门禁」，是「所有现有门禁都保持绿色」。
      - name: 生成物必须最新（C05；改了 Rust 就得重新生成并提交）
        run: |
          git diff --exit-code -- ../src/generated/ || {
            echo "::error::src/generated/ 与 Rust 源不一致。改了带 #[derive(ts_rs::TS)] 的类型后，请跑 'npm run gen:types' 并把 src/generated/ 一起提交。"
            git diff --stat -- ../src/generated/
            exit 1
          }

      # F09：vendor code-picture-core 是 path 依赖、**非** workspace 成员 → `--all` 测不到它。
      # 显式 `-p` 把它的 25 个测试跑起来（tree-sitter 符号索引 + git 锚点 + SQLite 内核）。
      # 不动 vendor crate 源码/Cargo.toml（红线：别误伤 vendor）。
      - name: cargo test (vendor code-picture-core)
        run: cargo test -p code-picture-core

      # G1（branch-anywhere）：`branch-core` 同理是 path 依赖、**非** workspace 成员
      # ⇒ `--all` 同样测不到它。它是分叉的记录变换，monitor 与远端 daemon **共用同一份**，
      # 里面那条 `branch_matches_native_fork_shape` 是「落盘格式 == 官方 /branch」的机检
      # —— 不显式跑，这条判据在 CI 里等于不存在。
      - name: cargo test (shared branch-core)
        run: cargo test -p branch-core

      # Phase G 审计：`branch-core` **进了 test 门禁却没进 fmt/clippy** —— 而它当时就是
      # 未格式化的（3 处 diff）。根因：全仓没有 `[workspace]` 表，上面那条
      # `cargo fmt --check` 跑在 `working-directory: src-tauri`，只覆盖 `monitor` 一个包。
      # **新增 path 依赖 crate 时三样都要补**（test / fmt / clippy），不是只补 test。
      - name: cargo fmt --check (shared branch-core)
        run: cargo fmt --check --manifest-path crates/branch-core/Cargo.toml

      - name: cargo clippy (shared branch-core)
        run: cargo clippy --manifest-path crates/branch-core/Cargo.toml --all-targets

      # ★ U8a-2a 补账：`usage-core`（U7-2）与 `acct-core`（U7-3）**当时一条 CI 步骤都没补** ——
      # 它们的 8 + 4 条测试在 CI 里等于不存在，而上面那段注释逐字写着「新增 path 依赖 crate
      # 时三样都要补」。是本轮加 `guard-core` 时照着这段注释走才发现的。
      # 这两个 crate 恰恰是「改内核一处 ⇒ 三侧同时红」那条验收标准的载体，漏跑等于把它关掉。
      - name: cargo test (shared usage-core / acct-core / guard-core)
        run: |
          cargo test -p usage-core
          cargo test -p acct-core
          cargo test -p guard-core

      - name: cargo fmt --check (shared usage-core / acct-core / guard-core)
        run: |
          cargo fmt --check --manifest-path crates/usage-core/Cargo.toml
          cargo fmt --check --manifest-path crates/acct-core/Cargo.toml
          cargo fmt --check --manifest-path crates/guard-core/Cargo.toml

      - name: cargo clippy (shared usage-core / acct-core / guard-core)
        run: |
          cargo clippy --manifest-path crates/usage-core/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/acct-core/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/guard-core/Cargo.toml --all-targets

  frontend:
    name: Frontend typecheck + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # ≥22.18：内置 type-stripping，无需 ts-node 直接跑 .test.ts
          cache: 'npm'

      - run: npm ci

      # 供应链门禁：只审**生产依赖**（会打进 bundle 的，如 dompurify/marked/highlight.js/katex）
      # 的 high 漏洞；dev 依赖（vite/vitest/jsdom 等不进产物）不门禁，避免被它们的 advisory
      # 误伤发布。修复：本地 `npm audit fix` 后提交 package-lock.json。
      - name: npm audit (production deps, high)
        run: npm audit --omit=dev --audit-level=high

      - run: npx tsc --noEmit

      # F08b：ESLint（flat config + typescript-eslint）。**顾问式/不阻断**——同 Rust job 的
      # clippy 仅报告不强制：既有告警作基线（**7 项**）、不追一次清零。`|| true`
      # 让告警可见但不红 CI；新代码作者本地 `npm run lint` 自查。
      #
      # **E83（2026-08-01）：作用面从 `eslint src` 放开到 `eslint .`。** 本仓 `eslint.config.js`
      # 的 `ignores` 一直是**仓级**写法（逐条列 dist / node_modules / src-tauri / …），
      # 而脚本只跑 `src` ⇒ 那份意图从没兑现，`e2e/**/*.mjs` 里 39 个 `no-undef` 永远没人看得到，
      # 且它们一个真问题都不是（纯缺一段 node/browser globals）。补完 globals 后
      # **全仓实测仍是 7 项**，基线数字不变、覆盖面变大。
      - name: eslint (advisory, baseline)
        run: npm run lint || true

      # F08b：Stylelint（styles.css 单文件）。同上顾问式，**50 项基线**（E82 订正：
      # 这里原写「57 项」，实测 50 —— 基线数字写下之后没人回来核，属本轮点名的那类病）。
      # 不 --fix 避免全量 churn。
      - name: stylelint (advisory, baseline)
        run: npm run lint:css || true

      # 全部前端单测：① 纯函数 node 测试（branching 主线折叠 #8/#22/#25/#26、diff 渲染 #14、
      # API 报错卡 #21、remote-health 节流、remote-launch 命令构造）；② tabs 生命周期 DOM 测试
      # （vitest+jsdom，守护 resume 复活 / 归档-only 关闭 / origin 门控等本轮 bug 高发区）。
      - name: unit tests (node pure-fn + vitest DOM)
        run: npm test

      # F08b：覆盖率**地板棘轮（阻断）**——阈值设在当前值下方（见 vitest.config.ts），只挡明显
      # 回归（新增大块无测代码），不追高。确定性套件 + 余量，正常不会误红。
      - name: coverage floor (vitest jsdom)
        run: npm run coverage

      # vite build 验证产物可生成（不打包 exe，那个 5+ 分钟太慢；
      # 完整 tauri build 留给 tag 触发的 release 工作流）
      - name: vite build (dist/)
        run: npm run build

  # 远端 daemon 是这套体系里**唯一以 Linux 为真实目标**的部分（inotify / aarch64），
  # 故单独跑在 ubuntu。standalone crate（无 root workspace），不被上面 Windows job 触及。
  daemon:
    name: Remote daemon (Linux) lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-daemon-proto
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # U4a：跨 target check 需要 Windows 的 std。**只 check 不链接**，
          # 所以在 ubuntu 上就能跑、不需要 Windows runner，成本近零。
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote-daemon-proto

      - name: cargo fmt --check
        run: cargo fmt --check

      # ★ U4a（2026-08-01）
      # **位置**：紧跟 fmt，排在 clippy/test 之前（Phase D 审计建议）——
      # 它是四步里最便宜、最确定的一步，前面任一步失败它就不执行。job 照样红、信号不丢，
      # 但「Windows 编得过」这条判据会被最不稳的那步（cargo test 真起 tmux、真 spawn 进程）遮住。
      # 原注：**§1.1 第一条解耦线（平台线）的唯一真判据。**
      #
      # 计划自审 §0.5-3 打掉过一个安慰剂式的机检：「`platform/` 之外出现平台 cfg 就红」
      # **抓不到 `pidfd_open`** —— 它是**无条件编译**的 Linux-only 代码，一个 cfg 都没有。
      # 能证明「平台依赖真的被隔离了」的只有编译器。
      #
      # **必须 `--all-targets`**：不加的话只编生产段，而实测 12 个错里有 1 个在测试段
      # （`libc::getuid`）。少这个 flag 会让判据漏掉整个测试面。
      #
      # 这一步之前，daemon 在 Windows 上 **RC=101 / 12 个错**，而 CI 从来不知道。
      - name: cargo check（跨 target：Windows 编得过 —— 平台线的真判据）
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

      # clippy 同后端 job：仅警告，不强制
      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test


  # L4（local-as-remote）：**Linux 宿主上 app 能不能构建**的持续信号。
  #
  # 为什么要它：L0 在开发机上实测过「三个 WebKitGTK pkg-config 依赖都在、`cargo build`
  # 完整 app 二进制 rc=0」，但那是**一台机器一次性的读数**。没有这个 job，Linux 侧的构建
  # 会在没人看的时候烂掉——而 `release.yml` 的 Linux 打包 job 只在 tag 时跑，
  # **等到发版才发现就晚了**。⇒ 这个 job 是那个发版 job 的**前置信号**。
  #
  # **刻意只 build 不 bundle**：bundle（deb）要多几分钟，而回归信号在「能不能编过」这一步
  # 就拿到了。打包本身留给 release（那里本来就要跑一次）。
  #
  # 装包说明：ubuntu runner 不预装 WebKitGTK 开发包。本仓 CI 里装系统包已有先例
  #（e2e job 装 tmux/jq），这里同理——**这与「本机不装软件包」那条纪律无关**，那条说的是
  # 开发者自己的机器。
  linux-app-build:
    name: Linux app build (no bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与其余 job 对齐
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 在 Linux 上的构建期依赖。**逐个都是编译 app 必需**（不是打包才要的）：
      # webkit2gtk-4.1 = WebView；gtk-3 = 窗口；ayatana-appindicator3 = 托盘；rsvg2 = 图标。
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm ci
        run: npm ci

      # 与 L0 本机实测的同一组命令：先前端，再 app 二进制。
      - name: npm run build (tsc + vite)
        run: npm run build

      - name: cargo build (full app binary, not --lib)
        working-directory: src-tauri
        run: cargo build

  # F09：e2e 脚本**健康冒烟**（非真 e2e）。真 e2e（Xvfb + tauri dev 全量 app + xdotool，见
  # e2e/README.md）需 Linux GUI runner + 5min+ app 构建，且 app 生产仅 Windows → 大投入低 ROI，
  # 留 v2/真机。这里只防脚本**腐烂**：shellcheck 只挡 error 级（忽略 info/style 噪音，f40-suite
  # 有意用 ls/eval 等）+ python 语法编译。ubuntu-latest 预装 shellcheck，零安装、秒级。
  e2e-smoke:
    name: E2E scripts health (shellcheck + py compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # B01 审计 I5：搬进来的 `shared/cc-bus/` 有 1107 行 shell，此前**零 lint 覆盖**——
      # 唯一门禁是下面那条 exec-bit 守卫。扩进来实测今天就是绿的（severity=error 零告警），
      # 零成本。`shared/ccm` 一并纳入：它被 `sftp.rs:538` include_str! 进二进制，是生产件。
      # **刻意不含 `shared/ccm-aliases.sh`**：那是个供 source 的片段、无 shebang，
      # SC2148 是它的构造性属性；而它会被写进用户 shell profile、并在 UI 面板里展示供手动复制，
      # 为过 lint 往里塞 `# shellcheck shell=bash` 等于往用户配置和界面文案里掺 lint 噪音。
      # G-B：vendored `cc-acct-iso` 的 1348 行 bash 纳入。同一条论证：它被
      # `acct_iso_deploy.rs` 的 `include_bytes!` 打进二进制、部署到远端执行，**是生产件**
      # ——与当初把 `shared/ccm` 纳入的理由一字不差。实测（2026-07-30）`--severity=error`
      # 零告警，连默认档（含 warning/info/style）也是零（脚本自带 `# shellcheck disable=` 指令）。
      #
      # **不要写成 `src-tauri/vendor/cc-acct-iso/scripts/**`**：不开 globstar 时 `**` 等价于 `*`，
      # 会把 `scripts/test`（目录）喂给 shellcheck ⇒ `openBinaryFile: inappropriate type` ⇒ 恒红。
      # 主计划账本原文就是那个 pattern，G-B 开工实测踩出来的。故显式列四个文件。
      #
      # **覆盖面地板**（本工作区在治的病：零断言/零覆盖也报绿）：文件数少一个就红。
      # 改名/挪走脚本时若不同步这里，shellcheck 会少扫几个文件而**照样绿**——地板挡的正是这个。
      - name: shellcheck (errors only)
        run: |
          set -euo pipefail
          FILES=$(printf '%s\n' e2e/*.sh shared/cc-bus/scripts/* shared/ccm \
            src-tauri/vendor/cc-acct-iso/scripts/cc-acct-iso \
            src-tauri/vendor/cc-acct-iso/scripts/lib.sh \
            src-tauri/vendor/cc-acct-iso/scripts/cc-acct-iso-install.sh \
            src-tauri/vendor/cc-acct-iso/scripts/test/run-tests.sh)
          N=$(printf '%s\n' "$FILES" | grep -c .)
          echo "shellcheck 覆盖 $N 个文件"
          # 地板：2026-07-30 实测 37（e2e 19 + cc-bus 13 + ccm 1 + vendored 4）；
          # **2026-08-01 E82 棘到 39** —— 实测同一表达式已是 39（e2e 21：G2 加了
          # `daemon-fork-session.sh` 与 `ccm-rbind-title.sh`，地板没跟 ⇒ 那段时间可以少扫
          # 2 个文件而不报警）。**地板的意义就是灵敏度**：写下之后不回来棘，等于慢慢把它交出去
          # （同 E81 的覆盖率棘轮）。棘的时候把**实测构成**一起写下，别只改数字。
          # **2026-08-02 U8a-2a 棘到 40** —— 实测 40（e2e 22：新增 `inbound-daemon-frames.sh`；
          # cc-bus 13 + ccm 1 + vendored 4 未变）。
          [ "$N" -ge 40 ] || { echo "覆盖面缩水：只有 $N 个文件（地板 40）"; exit 1; }
          # shellcheck disable=SC2086
          shellcheck --severity=error $FILES

      # G-B：**部署工具自己的 424 行测试**进 CI。此前它在 CI 与 `package.json` 里都不存在
      # ——`account-zero` 即将对那个工具做结构性改动（Z06 把散在 6 处的身份组成收成单点声明、
      # Z08 新增 isolate/share/migrate），**没有网不能改它**。
      # 全沙盒：`mktemp -d` 造假 `$HOME` + `export HOME=$SB` + cleanup trap + 假 launcher
      # `fakeclaude` ⇒ 零真机风险、不起真 claude。2026-07-30 首次运行：171/171 全绿。
      #
      # **断言条数地板**：脚本的退出码只看 `F`（失败数），`F=0` 就 exit 0 ⇒ **一条不跑也会绿**。
      # 地板放 CI 侧而不是脚本里（偏离主计划 §2 的「同源」原则），因为脚本是 **vendored** 的、
      # `VENDOR.md` SS-10 铁律「副本是上游的镜子，绝不在副本里改出自己的版本」——往副本加断言
      # 要走一次上游 lockstep + 重算 `.vendor_id`，而那属于「改那个工具」= G-B 要先建网再做的事。
      # 取舍已记进 `features/G-B-vendored-bash-gates.md` §3。
      - name: vendored cc-acct-iso self-tests (sandboxed, 294 assertions)
        run: |
          set -euo pipefail
          OUT=$(bash src-tauri/vendor/cc-acct-iso/scripts/test/run-tests.sh 2>&1) || {
            echo "$OUT"; exit 1; }
          echo "$OUT" | tail -3
          N=$(printf '%s' "$OUT" | grep -oE '全绿:[0-9]+' | grep -oE '[0-9]+' | tail -1)
          echo "断言条数 = ${N:-0}"
          # 地板 = 2026-07-30 实测值 291（Z08 +26 ⇒ 197；Z06 +18 ⇒ 215；Z07 +16 ⇒ 231；Z01 +37 ⇒ 268；Z04 +26 ⇒ 294）。
          # **Z08 起脚本自己也有一道地板**（`MIN_ASSERTS`，那才是 gate-integrity §2 说的「同源」）；
          # 这条 CI 侧的留作双保险——脚本被整体换掉时它还在。
          [ "${N:-0}" -ge 294 ] || { echo "断言条数缩水：${N:-0}（地板 294）"; exit 1; }

      - name: python syntax compile
        run: python3 -m py_compile e2e/*.py

      # B01：`shared/**` 里带 shebang 的文件在 **git 里**必须是 100755。
      # 本仓 `core.fileMode=false` → git 忽略文件系统的可执行位，于是"盘上 755 但 git 记 644"
      # 在本地**永远看不出来**（本地跑的是盘上那份），只有干净 checkout 才炸。已踩过两次：
      # R00 的 `shared/ccm`（CI 上 Permission denied，e2e 连红三轮）与 B01 的 13 个 cc-bus 脚本。
      # 直接 bash 调用：本 job 没有 setup-node 步骤，不该为一条纯 shell 检查引入 npm 依赖。
      # G-A **覆盖面地板**：16 套真机套件必须**每一套**都经 `assert-pass-floor.sh` 跑。
      # （U0 2026-08-01 订正：本行与下面 `:313` 原写「8」，是 E82 订正下方散文时漏跟的两处，
      #  与紧邻的步骤名和 `-ge N` 自相矛盾。真值以本步骤的 grep 计数为准。
      #  U8a-2a 2026-08-02：新增 inbound-frames ⇒ 15 → 16，三处一起改。）
      # 不加这条的失效模式是：有人把某一步改回裸 `npm run test:X`（或整步删掉），
      # 那套的断言数就再没人管了，而 CI **照样全绿** —— 与断言数缩水同一类病，只是换了一层。
      - name: G-A/G-C 覆盖面地板（16 套真机套件都必须带断言数地板）
        run: |
          set -euo pipefail
          # 只数**真正的调用行**（`run: bash e2e/…`）——本步骤自己那几行 grep 也含这个脚本名，
          # 用宽模式会把它们算进来（实测会数成比真值更大的数，那个数就成了假的）。
          N=$(grep -c 'run: bash e2e/assert-pass-floor\.sh' .github/workflows/ci.yml || true)
          echo "带地板的 e2e 步骤数 = ${N:-0}"
          [ "${N:-0}" -ge 16 ] || { echo "::error::只有 ${N:-0} 套带地板（应 >= 16）——有套件被改回裸 npm run 或被删掉"; exit 1; }
          # 反向自检：地板值必须**逐个**出现在调用行上，不能只有脚本名对了而地板被抹成 0。
          for pair in "tmux-target 26" "ccm-cli 44" "ccm-print-parity 12" "ccm-acceptance 19" \
                      "ccm-pretrust 13" "cc-spawn-uplift 21" "tmux-guarded 14" "usage-probe 9" \
                      "restart 24" "resume 17" "graylight-frames 12" "restart-frames 5" "resume-frames 7" \
                      "ccm-rbind-title 8" "daemon-fork 10" "inbound-frames 15"; do
            grep -q "assert-pass-floor.sh $pair\b" .github/workflows/ci.yml \
              || { echo "::error::找不到调用行 'assert-pass-floor.sh $pair' —— 套件或地板被改了"; exit 1; }
          done
          echo "16 套逐个对上（套件名 + 地板值）"

      - name: exec-bit guard (shared/** shebang files must be 100755 in git)
        run: bash e2e/exec-bit-guard.sh

  # R00③：**真机行为验收进 CI**。**E82（2026-08-01）订正这段散文里的数**：地板值本身一直是对的
  # （下面有逐个 grep 的反向自检兜着），只是这几行注释没跟 —— 实际调用行是
  # `ccm-acceptance 19` / `usage-probe 9`，不是 15 / 7；套数也从 8 长到了 15（跨两个 job）。
  # 原文（2026-07-29 实测**共 152 条**断言：tmux-target 26 · ccm-cli 44 · ccm-print-parity 12 ·
  # ccm-acceptance 15 · ccm-pretrust 13 · cc-spawn-uplift 21 · tmux-guarded 14 · usage-probe 7）
  # 此前既不在 CI 也不在 `npm test`，
  # 只靠开发者本地手动跑——而它们恰恰是本仓唯一能回答「这条命令在 tmux 上到底干了什么」的门禁
  # （§5.2 实证：cargo test 369 + npm test 全绿 + tsc 0，仍放行过一个让 send-keys 完全失效的改动，
  # 因为那些门禁只断言「我写出了打算写的字符串」）。
  #
  # 上面 e2e-smoke 的注释说真 e2e 需要 GUI runner + 5min app 构建——**那说的是 DOM e2e**
  # （Xvfb + tauri dev 全量 app + xdotool）。下面这一批只需要 tmux：全部在隔离 `-L` socket 上
  # 起自己的 tmux server，用假 launcher（`PROBE`/`CCMPROBE` 这类纯字母词）而**不是真 claude**
  # （真 claude 会重绘/清屏，把打进去的内容盖掉，让「兄弟会话未被污染」的 grep 假 PASS）。
  # 写用户配置的两套（ccm-acceptance / ccm-pretrust）经 CCM_CLAUDEJSON / CCM_CODEXTOML
  # 重定向到 mktemp 目录，不碰 runner 的 $HOME（F11 Phase D 审计发现并修的真实污染）。
  #
  # 按「要不要 Rust 工具链」拆两个 job：多数套件只要 tmux+node，秒级；只有 2 套要从真 builder
  # 取命令串（教训清单第 2 条：验收输入必须从真 builder 取，绝不手搓等价命令），
  # 它们得编译 src-tauri，而 src-tauri 依赖 tauri v2 → Linux 上需要 webkit2gtk 一套系统库。
  # 拆开的好处：快的那个先给信号，不被慢的 Linux Tauri 构建挡住。
  e2e-tmux:
    name: E2E real-machine (tmux, no Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # tmux 是这些套件的被测对象本身；jq 供 ccm-pretrust 读回写入结果做断言。
      # script(1)（util-linux，预装）供 tmux-target 的 pty attach 正例，缺了它那条自动 SKIP。
      - name: install tmux + jq
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - name: tmux 目标精确匹配（F01）
        run: bash e2e/assert-pass-floor.sh tmux-target 26

      - name: ccm CLI 契约（F02）
        run: bash e2e/assert-pass-floor.sh ccm-cli 44

      - name: ccm --print 平价预言机（F03）
        run: bash e2e/assert-pass-floor.sh ccm-print-parity 12

      - name: ccm 端到端验收（F02）
        run: bash e2e/assert-pass-floor.sh ccm-acceptance 19

      - name: ccm 预信任（F11）
        run: bash e2e/assert-pass-floor.sh ccm-pretrust 13

      # B02：`cc-spawn` 收编进 `ccm` 的行为等价验收。**本套件自带起飞前自检**——
      # 它经 PATH 上的 tmux shim 强制 `-L <隔离socket>`（cc-spawn/ccm/cc-register 内部都是
      # 裸调 tmux，塞不进 -L，只能这样拦），并断言 shim 看不到默认 socket 上的任何会话，
      # 不过就 exit 9 中止。开发机上有正在运行的 tmux 会话与真实 ~/.cc-bus/，
      # 这条自检是为了那里；CI 上是干净 runner，自检自然通过。
      - name: cc-spawn 收编等价（B02）
        run: bash e2e/assert-pass-floor.sh cc-spawn-uplift 21

      # G-C（解 E41）：这两套只要 node + tmux（经 tsx driver 驱真编排逻辑，不碰 daemon）。
      # 它们此前进不了 CI 的原因不是「需要什么」，而是**会踩开发者机器上的真实 tmux 会话**
      # ——现在每套都把自己钉在私有 socket 上（`unset TMUX` + 短 `TMUX_TMPDIR`），可以进来了。
      - name: 换号重启编排（F-E3）
        run: bash e2e/assert-pass-floor.sh restart 24

      - name: resume 编排 + 复用守卫（F-E2）
        run: bash e2e/assert-pass-floor.sh resume 17

      # Phase G 审计：G2 新增的这套**只有 npm 脚本、没进任何门禁**。它已具备入网条件
      # （打印 `合计 PASS=`、`unset TMUX` + 私有 `-L` socket 隔离、不碰真 `~/.claude`），
      # 只是当时忘了接线。对比 `graylight-suite` 的排除在 `e2e/README.md` 里是有论证的，
      # 这两套什么都没写 —— 那正是「新东西入网漏一拍」的形状。
      - name: ccm 拉前 marker 常驻（E68）
        run: bash e2e/assert-pass-floor.sh ccm-rbind-title 8

  e2e-tmux-rust:
    name: E2E real-machine (tmux + Rust builder emit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # **E67④（2026-08-01）订正**：原注释写着「这两套只从 Rust 侧取命令串、不跑前端，无需 node」
      # ——**不成立**。`resume-daemon-frames.sh` 第 3 步要跑 `npx tsx e2e/resume-cmd-driver.ts`
      # 拿**真源** resume 命令串，而那个 driver `import "../src/accounts.ts"`（第 25 行），
      # `accounts.ts` 顶层 `import { invoke } from "@tauri-apps/api/core"` ⇒ 没有 node_modules
      # 就是 `ERR_MODULE_NOT_FOUND`。
      #
      # **为什么以前没红**：这套件在第 2 步就死了（那行是裸赋值，`set -e` 直接退出、连 FAIL 都不打），
      # 根本走不到第 3 步 —— 一个 bug 把另一个 bug 挡在后面。前一个修好，这个才露出来。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # src-tauri 依赖 tauri v2；Linux 上编译它需要 webkit2gtk/soup 一套开发库
      # （Windows job 不需要，故只在这里装）。
      - name: install tmux + Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential \
            curl wget file libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - name: tmux 三道门 + 原子 verify+act（F04）
        run: bash e2e/assert-pass-floor.sh tmux-guarded 14

      - name: 用量探针（F10）
        run: bash e2e/assert-pass-floor.sh usage-probe 9

      # G-C：这三套要一个**真 daemon 二进制**（daemon-wrapper.sh 默认取
      # `remote-daemon-proto/target/debug/cc-monitor-remote`）。主计划把「怎么把 daemon 产物
      # 从 `daemon` job 传过来」记成 G-C 唯一的技术不确定性——**直接在本 job 里编就绕开了**：
      # 本 job 已有 Rust 工具链，而 daemon crate 比它已经在编的 src-tauri 轻得多。
      - name: build debug daemon（供 daemon-frames 三套）
        run: cargo build --manifest-path remote-daemon-proto/Cargo.toml

      # U8a-2a：入方向（控制通道）的真进程端到端。此前那条通道**从没有真进程验证过**——
      # daemon 侧全是单测夹具，monitor 侧一个字节都没发过。
      - name: 入方向 daemon 帧（U8a-2a）
        run: bash e2e/assert-pass-floor.sh inbound-frames 15

      - name: 灰灯 daemon 帧（F-E1）
        run: bash e2e/assert-pass-floor.sh graylight-frames 12

      - name: 换号 daemon 帧（F-E3）
        run: bash e2e/assert-pass-floor.sh restart-frames 5

      - name: resume daemon 帧（F-E2）
        run: bash e2e/assert-pass-floor.sh resume-frames 7

      # 同上（Phase G 审计）：G2 的 daemon 分叉 e2e 此前只有 npm 脚本。
      # 它要的 debug daemon 上面那步已经编好了。
      - name: daemon 分叉（G2 `--fork-session`）
        run: bash e2e/assert-pass-floor.sh daemon-fork 10

# 注：曾加过一个 `cargo audit` 信息性 job，但对 Windows-only Tauri 应用而言它**永久红**——
# Cargo.lock 含大量 Tauri 的 Linux GTK 传递依赖（atk/gdk/gtk-rs，标记 unmaintained，且
# 在 Windows 根本不编译/不打包），淹没了信号。已移除；已知 Rust 依赖 advisory 残留记入
# SECURITY.md（rsa RUSTSEC-2023-0071 Marvin timing 侧信道——上游无修复版、本场景低风险；
# gtk-rs unmaintained）。前端供应链门禁仍保留（上面 `npm audit --omit=dev`，审生产依赖）。
# 需要时可本地 `cargo audit` 人工查（cargo install cargo-audit）。
