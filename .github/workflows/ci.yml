          [ "${N:-0}" -ge 23 ] || { echo "::error::只有 ${N:-0} 套带地板（应 >= 23）——有套件被改回裸 npm run 或被删掉"; exit 1; }
          # 反向自检：地板值必须**逐个**出现在调用行上，不能只有脚本名对了而地板被抹成 0。
          for pair in "tmux-target 26" "ccm-cli 242" "ccm-print-parity 12" "ccm-acceptance 29" \
                      "ccm-pretrust 15" "cc-spawn-uplift 72" "tmux-guarded 14" "usage-probe 11" \
                      "restart 24" "resume 17" "graylight-frames 12" "restart-frames 5" "resume-frames 7" \
                      "ccm-rbind-title 8" "daemon-fork 10" "inbound-frames 32" \
                      "ccm-contract-parity 68" "daemon-gate2 36" "local-backend 14" \
                      "daemon-sessions-rewatch 5" "daemon-tmux-late-server 2" \
                      "cc-bus-queue-drain 43" "daemon-cc-bus 50"; do
            grep -q "assert-pass-floor.sh $pair\b" .github/workflows/ci.yml \
              || { echo "::error::找不到调用行 'assert-pass-floor.sh $pair' —— 套件或地板被改了"; exit 1; }
          done
          echo "23 套逐个对上（套件名 + 地板值）"

      - name: exec-bit guard (shared/** shebang files must be 100755 in git)
        run: bash e2e/exec-bit-guard.sh

  # R00③：**真机行为验收进 CI**。**E82（2026-08-01）订正这段散文里的数**：地板值本身一直是对的
  # （下面有逐个 grep 的反向自检兜着），只是这几行注释没跟 —— 实际调用行是
  # `ccm-acceptance 19` / `usage-probe 9`，不是 15 / 7；套数也从 8 长到了 15（跨两个 job）。
  # ⚠ **2026-08-24 订正：下面这几行散文里的数今天全是旧的**（保留是因为它们记着「哪一刀为什么棘」）。
  #   现值以**调用行**为准：`ccm-cli` **242** · `ccm-acceptance 29` · `ccm-contract-parity 68`
  #   （`ccm-cli` 那个数 09-03 `K-P2 D2` 从 126 棘到 203、`D3` 再棘到 242；反向自检清单已同拍改）。
  # ⚠ audit-0805 F14 第六刀把 ccm-cli 棘到 53（新增 7 条：身份 poller 的 sid 解析——
  #   抽取器自检 1 + 取值 4 + 「文件不存在 stderr 必须为空」1 + 「不残留上一次」1）。
  # ⚠ audit-0805 F10 把 ccm-cli 棘到 46（新增两条：I-11 的 resume×daemon×passthru 那一格，
  #   以及它的反向「不带 -- 时配方逐字不变」）。下面这段是 2026-07-29 的原文，数字已过期。
  # 原文（2026-07-29 实测**共 152 条**断言：tmux-target 26 · ccm-cli 44 · ccm-print-parity 12 ·
  # ccm-acceptance 15 · ccm-pretrust 13 · cc-spawn-uplift 21 · tmux-guarded 14 · usage-probe 7）
  # 此前既不在 CI 也不在 `npm test`，
  # 只靠开发者本地手动跑——而它们恰恰是本仓唯一能回答「这条命令在 tmux 上到底干了什么」的门禁
  # （§5.2 实证：cargo test 369 + npm test 全绿 + tsc 0，仍放行过一个让 send-keys 完全失效的改动，
  # 因为那些门禁只断言「我写出了打算写的字符串」）。
  #
  # 上面 e2e-smoke 的注释说真 e2e 需要 GUI runner + 5min app 构建——**那说的是 DOM e2e**
  # （Xvfb + tauri dev 全量 app + xdotool）。下面这一批只需要 tmux：全部在隔离 `-L` socket 上
  # 起自己的 tmux server，用假 launcher（`PROBE`/`CCMPROBE` 这类纯字母词）而**不是真 claude**
  # （真 claude 会重绘/清屏，把打进去的内容盖掉，让「兄弟会话未被污染」的 grep 假 PASS）。
  # 写用户配置的两套（ccm-acceptance / ccm-pretrust）经 CCM_CLAUDEJSON / CCM_CODEXTOML
  # 重定向到 mktemp 目录，不碰 runner 的 $HOME（F11 Phase D 审计发现并修的真实污染）。
  #
  # 按「要不要 Rust 工具链」拆两个 job：多数套件只要 tmux+node，秒级；只有 2 套要从真 builder
  # 取命令串（教训清单第 2 条：验收输入必须从真 builder 取，绝不手搓等价命令），
  # 它们得编译 src-tauri，而 src-tauri 依赖 tauri v2 → Linux 上需要 webkit2gtk 一套系统库。
  # 拆开的好处：快的那个先给信号，不被慢的 Linux Tauri 构建挡住。
  e2e-tmux:
    name: E2E real-machine (tmux, no Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # tmux 是这些套件的被测对象本身；jq 供 ccm-pretrust 读回写入结果做断言。
      # script(1)（util-linux，预装）供 tmux-target 的 pty attach 正例，缺了它那条自动 SKIP。
      - name: install tmux + jq
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - name: tmux 目标精确匹配（F01）
        run: bash e2e/assert-pass-floor.sh tmux-target 26

      - name: ccm CLI 契约（F02）
        run: bash e2e/assert-pass-floor.sh ccm-cli 242

      - name: ccm --print 平价预言机（F03）
        run: bash e2e/assert-pass-floor.sh ccm-print-parity 12

      - name: ccm 端到端验收（F02）
        run: bash e2e/assert-pass-floor.sh ccm-acceptance 29

      - name: ccm 预信任（F11）
        run: bash e2e/assert-pass-floor.sh ccm-pretrust 15

      # U9a：`--print` 说的 == 真跑做的（S10「保住清单」差分对拍）。
      # 与上面两套的分工：`ccm-cli` 只跑 `--print`（全 `env -u TMUX`）、`ccm-print-parity`
      # 验渲染器意图能被接住 —— **都不比对真 exec 路**，而那正是 U9b 搬决策时会漏的地方。
      - name: ccm 契约差分对拍（U9a · S10 保住清单）
        run: bash e2e/assert-pass-floor.sh ccm-contract-parity 68

      # B02：`cc-spawn` 收编进 `ccm` 的行为等价验收。**本套件自带起飞前自检**——
      # 它经 PATH 上的 tmux shim 强制 `-L <隔离socket>`（cc-spawn/ccm/cc-register 内部都是
      # 裸调 tmux，塞不进 -L，只能这样拦），并断言 shim 看不到默认 socket 上的任何会话，
      # 不过就 exit 9 中止。开发机上有正在运行的 tmux 会话与真实 ~/.cc-bus/，
      # 这条自检是为了那里；CI 上是干净 runner，自检自然通过。
      - name: cc-spawn 收编等价（B02）
        run: bash e2e/assert-pass-floor.sh cc-spawn-uplift 72

      # 08-13：`cc-send` 兜底路径的滞留队列补投。**本套件不用 tmux**（收发全走文件）——
      # 于是 `C7i` 那条红线在它身上天然不成立。它起的唯一进程是 `cc-busd` 自己，
      # 且 `HOME` 与 `CC_BUS_HOME` 双双落在 mktemp 沙箱里（第一版把 export 写进了命令替换、
      # 真的落到开发机的 ~/.cc-bus 上过，那道自检就是那次撞出来的）。
      - name: cc-send 滞留队列补投（cc-busd 死后消息不许没人管）
        run: bash e2e/assert-pass-floor.sh cc-bus-queue-drain 43
      - name: e2e - daemon sessions 重挂（P0b-Y2，#60 台架九拍的根因）
        run: bash e2e/assert-pass-floor.sh daemon-sessions-rewatch 5
      - name: e2e - daemon 迟到的 tmux server（P0b-Y2，#60 根因）
        run: bash e2e/assert-pass-floor.sh daemon-tmux-late-server 2
      # P4f：daemon 的 cc-bus 基础命令。**要 debug daemon 二进制**（同下面 daemon-frames 三套），
      # 但不要 tmux、不要真 claude —— 它跑的是一次性 CLI（`--bus-list` / `--bus-send`）。
      - name: e2e - daemon 的 cc-bus 基础命令（P4f）
        run: bash e2e/assert-pass-floor.sh daemon-cc-bus 50

      # G-C（解 E41）：这两套只要 node + tmux（经 tsx driver 驱真编排逻辑，不碰 daemon）。
      # 它们此前进不了 CI 的原因不是「需要什么」，而是**会踩开发者机器上的真实 tmux 会话**
      # ——现在每套都把自己钉在私有 socket 上（`unset TMUX` + 短 `TMUX_TMPDIR`），可以进来了。
      - name: 换号重启编排（F-E3）
        run: bash e2e/assert-pass-floor.sh restart 24

      - name: resume 编排 + 复用守卫（F-E2）
        run: bash e2e/assert-pass-floor.sh resume 17

      # Phase G 审计：G2 新增的这套**只有 npm 脚本、没进任何门禁**。它已具备入网条件
      # （打印 `合计 PASS=`、`unset TMUX` + 私有 `-L` socket 隔离、不碰真 `~/.claude`），
      # 只是当时忘了接线。对比 `graylight-suite` 的排除在 `e2e/README.md` 里是有论证的，
      # 这两套什么都没写 —— 那正是「新东西入网漏一拍」的形状。
      - name: ccm 拉前 marker 常驻（E68）
        run: bash e2e/assert-pass-floor.sh ccm-rbind-title 8

  e2e-tmux-rust:
    name: E2E real-machine (tmux + Rust builder emit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # **E67④（2026-08-01）订正**：原注释写着「这两套只从 Rust 侧取命令串、不跑前端，无需 node」
      # ——**不成立**。`resume-daemon-frames.sh` 第 3 步要跑 `npx tsx e2e/resume-cmd-driver.ts`
      # 拿**真源** resume 命令串，而那个 driver `import "../src/accounts.ts"`（第 25 行），
      # `accounts.ts` 顶层 `import { invoke } from "@tauri-apps/api/core"` ⇒ 没有 node_modules
      # 就是 `ERR_MODULE_NOT_FOUND`。
      #
      # **为什么以前没红**：这套件在第 2 步就死了（那行是裸赋值，`set -e` 直接退出、连 FAIL 都不打），
      # 根本走不到第 3 步 —— 一个 bug 把另一个 bug 挡在后面。前一个修好，这个才露出来。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # src-tauri 依赖 tauri v2；Linux 上编译它需要 webkit2gtk/soup 一套开发库
      # （Windows job 不需要，故只在这里装）。
      - name: install tmux + Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential \
            curl wget file libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - name: tmux 三道门 + 原子 verify+act（F04）
        run: bash e2e/assert-pass-floor.sh tmux-guarded 14

      - name: 用量探针（F10）
        run: bash e2e/assert-pass-floor.sh usage-probe 11

      # G-C：这三套要一个**真 daemon 二进制**（daemon-wrapper.sh 默认取
      # `remote-daemon-proto/target/debug/cc-monitor-remote`）。主计划把「怎么把 daemon 产物
      # 从 `daemon` job 传过来」记成 G-C 唯一的技术不确定性——**直接在本 job 里编就绕开了**：
      # 本 job 已有 Rust 工具链，而 daemon crate 比它已经在编的 src-tauri 轻得多。
      - name: build debug daemon（供 daemon-frames 三套）
        run: cargo build --manifest-path remote-daemon-proto/Cargo.toml

      # U8a-2a：入方向（控制通道）的真进程端到端。此前那条通道**从没有真进程验证过**——
      # daemon 侧全是单测夹具，monitor 侧一个字节都没发过。
      - name: 入方向 daemon 帧（U8a-2a）
        run: bash e2e/assert-pass-floor.sh inbound-frames 32

      # F03：§34 Gate 2 在 daemon 侧的真机验收。用例逐行来自那张唯一的判定表
      # `src-tauri/src/backend/control/fixtures/gate2-golden.tsv`（三条轨道同一份）。
      - name: Gate 2 daemon 真机验收（F03）
        run: bash e2e/assert-pass-floor.sh daemon-gate2 36

      # F05a：本机后端监护的真进程验收（起-杀-自愈 / 必崩即判死 / 缺 sidecar 诚实降级）。
      # 数字地板**只在这一行**（定框 §4：同一个数不许两侧各写一份）；脚本里只有导出式自检。
      # ★★ `K-P1` 08-26：**7 → 14**。多出来的 7 条是常驻那条路的真进程判据
      #    （`KPY2` 认已有实例 5 条含一条**非空对照** · `KPY3` 不留僵尸 2 条），
      #    它们住 `src-tauri/src/local_daemon.rs`，由本套件**第二趟** `--ignored` 拉起。
      #    ⚠ 不棘的话那 7 条明天能被整族删掉而 CI 照样绿 —— 那正是
      #    `assert-pass-floor.sh` 头注写的失效模式：**不是变红，是静默缩水**。
      - name: 本机后端监护真进程验收（F05a + K-P1 常驻）
        run: bash e2e/assert-pass-floor.sh local-backend 14

      - name: 灰灯 daemon 帧（F-E1）
        run: bash e2e/assert-pass-floor.sh graylight-frames 12

      - name: 换号 daemon 帧（F-E3）
        run: bash e2e/assert-pass-floor.sh restart-frames 5

      - name: resume daemon 帧（F-E2）
        run: bash e2e/assert-pass-floor.sh resume-frames 7

      # 同上（Phase G 审计）：G2 的 daemon 分叉 e2e 此前只有 npm 脚本。
      # 它要的 debug daemon 上面那步已经编好了。
      - name: daemon 分叉（G2 `--fork-session`）
        run: bash e2e/assert-pass-floor.sh daemon-fork 10

# 注：曾加过一个 `cargo audit` 信息性 job，但对 Windows-only Tauri 应用而言它**永久红**——
# Cargo.lock 含大量 Tauri 的 Linux GTK 传递依赖（atk/gdk/gtk-rs，标记 unmaintained，且
# 在 Windows 根本不编译/不打包），淹没了信号。已移除；已知 Rust 依赖 advisory 残留记入
# SECURITY.md（rsa RUSTSEC-2023-0071 Marvin timing 侧信道——上游无修复版、本场景低风险；
# gtk-rs unmaintained）。前端供应链门禁仍保留（上面 `npm audit --omit=dev`，审生产依赖）。
# 需要时可本地 `cargo audit` 人工查（cargo install cargo-audit）。
