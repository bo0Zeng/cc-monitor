name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Windows-only：cc-monitor v1 不支持 Linux/macOS（核心 Win32 调用）。
# 跨平台支持是 v2 计划，届时这里再加 matrix.os。

# 显式 bash：GitHub 对显式指定的 bash 注入 `-eo pipefail`（默认 shell 只有 -e）。
# 防未来某步加 `cargo test | tee` 这类管道时静默吞掉左侧失败（本仓踩过：裸管道
# 掩盖编译失败误报全绿）。与 job 级 working-directory 默认按属性合并,互不覆盖。
defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust lint + test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # fmt 已经过项目历史校准，强制约束
      # G2（Phase G 代码工程审计）：这六个共享 crate 现在是**真 workspace member**
      # （`src-tauri/Cargo.toml` 的 `[workspace]`）。收敛前它们只是 path 依赖 ——
      # `cargo metadata` 的 `workspace_members` 只有 `monitor` 一项，`-p` 能跑靠的是
      # cargo 允许选中依赖图里的非 member 包，**不是 workspace 机制**。
      # ⇒ 原来 ~17 条 `--manifest-path`/`-p` 收敛成下面三条。
      #
      # ⚠ 收敛前的教训留在这里，别当成历史：`branch-core` 曾**进了 test 门禁却没进
      # fmt/clippy**（当时正好有 3 处未格式化）；`usage-core`/`acct-core` 曾**一条 CI
      # 步骤都没有**，它们的 8+4 条测试在 CI 里等于不存在。根因就是没有 `[workspace]`
      # —— 每加一个 crate 都要人记得补三处。**现在补不补由 cargo 自己决定。**
      #
      # ⚠ `--exclude code-picture-core`：vendor 那个 crate 是成员的 path 依赖，
      # cargo 会把它也算成 workspace 成员（`[workspace] exclude` 对 path 依赖**不生效**，
      # 实测）。这里显式排除 ⇒ **不动 vendor 一个字节**（红线），它自己那 25 条测试
      # 仍由下面那条独立步骤跑。
      - name: cargo fmt --check（整个 workspace）
        run: cargo fmt --all --check

      - name: cargo clippy（整个 workspace，vendor 除外）
        run: cargo clippy --workspace --exclude code-picture-core --all-targets

      - name: cargo test（整个 workspace，vendor 除外）
        run: cargo test --workspace --exclude code-picture-core

      # C05（rust-ts-boundary）：**生成物必须最新**。上一步的 `cargo test --workspace` 会跑
      # `ts-rs` 的导出测试、把 `src/generated/**` 重新写一遍；这里断言它与已提交的版本一致。
      #
      # **为什么这一半在这个 job、另一半在 frontend job**：这个性质要
      # 「先重新生成、再 tsc」，而**没有任何 job 同时有 Rust 和 node**
      # （给本 job 加 `npm ci` 是分钟级；给 frontend job 加整套 Tauri 编译是 CI 里最贵的东西）。
      # 所以拆成两半：本步保证「已提交的生成物 == 从 Rust 源生成的」，
      # frontend job 的 `tsc` 保证「TS 消费方 == 已提交的生成物」，**两者合起来**就是
      # 「TS 消费方 == Rust 源」。而 `git diff` 不需要 node ⇒ 这一半的代价 ≈ 一条 git 命令。
      #
      # 立项理由（C01 Phase D 审计变异实测）：serde-rename 一个字段而**不重新生成**
      # ⇒ cargo 绿 · tsc 绿 · 守卫绿 · npm 819 全绿，**而生产里 UI 标签会变空**。
      # 失效模式不是「没门禁」，是「所有现有门禁都保持绿色」。
      - name: 生成物必须最新（C05；改了 Rust 就得重新生成并提交）
        run: |
          git diff --exit-code -- ../src/generated/ || {
            echo "::error::src/generated/ 与 Rust 源不一致。改了带 #[derive(ts_rs::TS)] 的类型后，请跑 'npm run gen:types' 并把 src/generated/ 一起提交。"
            git diff --stat -- ../src/generated/
            exit 1
          }

      # F09：vendor code-picture-core 是 path 依赖、**非** workspace 成员 → `--all` 测不到它。
      # 显式 `-p` 把它的 25 个测试跑起来（tree-sitter 符号索引 + git 锚点 + SQLite 内核）。
      # 不动 vendor crate 源码/Cargo.toml（红线：别误伤 vendor）。
      - name: cargo test (vendor code-picture-core)
        run: cargo test -p code-picture-core

  frontend:
    name: Frontend typecheck + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # ≥22.18：内置 type-stripping，无需 ts-node 直接跑 .test.ts
          cache: 'npm'

      - run: npm ci

      # 供应链门禁：只审**生产依赖**（会打进 bundle 的，如 dompurify/marked/highlight.js/katex）
      # 的 high 漏洞；dev 依赖（vite/vitest/jsdom 等不进产物）不门禁，避免被它们的 advisory
      # 误伤发布。修复：本地 `npm audit fix` 后提交 package-lock.json。
      - name: npm audit (production deps, high)
        run: npm audit --omit=dev --audit-level=high

      - run: npx tsc --noEmit

      # F08b：ESLint（flat config + typescript-eslint）。**顾问式/不阻断**——同 Rust job 的
      # clippy 仅报告不强制：既有告警作基线（**7 项**）、不追一次清零。`|| true`
      # 让告警可见但不红 CI；新代码作者本地 `npm run lint` 自查。
      #
      # **E83（2026-08-01）：作用面从 `eslint src` 放开到 `eslint .`。** 本仓 `eslint.config.js`
      # 的 `ignores` 一直是**仓级**写法（逐条列 dist / node_modules / src-tauri / …），
      # 而脚本只跑 `src` ⇒ 那份意图从没兑现，`e2e/**/*.mjs` 里 39 个 `no-undef` 永远没人看得到，
      # 且它们一个真问题都不是（纯缺一段 node/browser globals）。补完 globals 后
      # **全仓实测仍是 7 项**，基线数字不变、覆盖面变大。
      - name: eslint (advisory, baseline)
        run: npm run lint || true

      # F08b：Stylelint（styles.css 单文件）。同上顾问式，**50 项基线**（E82 订正：
      # 这里原写「57 项」，实测 50 —— 基线数字写下之后没人回来核，属本轮点名的那类病）。
      # 不 --fix 避免全量 churn。
      - name: stylelint (advisory, baseline)
        run: npm run lint:css || true

      # 全部前端单测：① 纯函数 node 测试（branching 主线折叠 #8/#22/#25/#26、diff 渲染 #14、
      # API 报错卡 #21、remote-health 节流、remote-launch 命令构造）；② tabs 生命周期 DOM 测试
      # （vitest+jsdom，守护 resume 复活 / 归档-only 关闭 / origin 门控等本轮 bug 高发区）。
      - name: unit tests (node pure-fn + vitest DOM)
        run: npm test

      # F08b：覆盖率**地板棘轮（阻断）**——阈值设在当前值下方（见 vitest.config.ts），只挡明显
      # 回归（新增大块无测代码），不追高。确定性套件 + 余量，正常不会误红。
      - name: coverage floor (vitest jsdom)
        run: npm run coverage

      # audit-0805 F17：**逐文件**地板 + 0% 文件递减棘轮。
      # 上一步那个阈值是**聚合值** —— 187 个文件里单个模块掉到 0%，总数只动零点几个点，
      # 而地板留着 2-3 点余量 ⇒ 门禁一声不响。`vitest.config.ts` 那段注释自己就写着
      # 「收紧留后续按核心 DOM 模块 per-file」，这一步就是那个「后续」。
      # ⚠ 同样**无 `|| true`**：它是真阻断，不是 advisory。
      - name: coverage per-file floors + zero-coverage ratchet
        run: node scripts/assert-coverage-floors.mjs

      # vite build 验证产物可生成（不打包 exe，那个 5+ 分钟太慢；
      # 完整 tauri build 留给 tag 触发的 release 工作流）
      - name: vite build (dist/)
        run: npm run build

  # 远端 daemon 是这套体系里**唯一以 Linux 为真实目标**的部分（inotify / aarch64），
  # 故单独跑在 ubuntu。standalone crate（无 root workspace），不被上面 Windows job 触及。
  daemon:
    name: Remote daemon (Linux) lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-daemon-proto
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # U4a：跨 target check 需要 Windows 的 std。**只 check 不链接**，
          # 所以在 ubuntu 上就能跑、不需要 Windows runner，成本近零。
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote-daemon-proto

      # ★ 08-25（`K-H1` / `KU10` 走「甲」）：**给这个 ubuntu job 装一个能给 Windows 编 C 的交叉工具链。**
      #
      # 为什么突然要它：daemon 引入 TLS（`rustls` → `ring`）之后，`ring` 的 build script 要**编 C**，
      # 而 cc-rs 在 Linux 上给 `*-pc-windows-msvc` 找不到 MSVC 的工具 ⇒ 下面那条跨 target check
      # **必红**（本机实测 exit 101，`error occurred in cc-rs: failed to find tool "lib.exe"`）。
      # ⚠ 那个红**不是**我们的代码坏了：失败输出里 `Checking cc-monitor-remote` 命中 **0**，
      #   它根本没走到我们这一行 ⇒ 「平台线的唯一真判据」当时等于**没了**。
      #
      # 为什么是 zig：它一个包同时给齐三样（本机逐条实测过）——
      #   ① `zig cc` = clang，`-target x86_64-windows-gnu` 能编出 **COFF** 目标文件；
      #   ② 自带 mingw-w64 的 libc 头（不需要下载微软 SDK，也就不需要 `xwin` 那一步下载）；
      #   ③ `zig lib` = LLVM 的 **lib.exe 驱动**，正是 cc-rs 缺的那个归档器。
      # ⚠ 只给归档器是**不够**的：实测把 `AR` 指向 GNU `ar` 或 `llvm-lib`，
      #   宿主 gcc 产的是 ELF，LIB 驱动当场 `not a COFF object` ⇒ 必须有一个真发 COFF 的编译器。
      #
      # ⚠ 为什么用 `uses:` 装而不是加一步 `run:`：`shared_crate_registry::
      # every_ci_run_step_is_classified_as_local_or_unrunnable` 要求本文件里**每一条 `run:` 步骤**
      # 都在 `src-tauri/src/shared_crate_registry.rs` 的 `STEPS` 表里登记过；`uses:` 步骤不进那个人群。
      # ⚠ 版本与 `release.yml` 那步**刻意保持一致**（`mlugg/setup-zig@v1` + zig `0.14.0`）：
      # 那一步已经在本仓 CI 上跑过，少一个会自己变的量。
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: cargo fmt --check
        run: cargo fmt --check

      # ★ U4a（2026-08-01）
      # **位置**：紧跟 fmt，排在 clippy/test 之前（Phase D 审计建议）——
      # 它是四步里最便宜、最确定的一步，前面任一步失败它就不执行。job 照样红、信号不丢，
      # 但「Windows 编得过」这条判据会被最不稳的那步（cargo test 真起 tmux、真 spawn 进程）遮住。
      # 原注：**§1.1 第一条解耦线（平台线）的唯一真判据。**
      #
      # 计划自审 §0.5-3 打掉过一个安慰剂式的机检：「`platform/` 之外出现平台 cfg 就红」
      # **抓不到 `pidfd_open`** —— 它是**无条件编译**的 Linux-only 代码，一个 cfg 都没有。
      # 能证明「平台依赖真的被隔离了」的只有编译器。
      #
      # **必须 `--all-targets`**：不加的话只编生产段，而实测 12 个错里有 1 个在测试段
      # （`libc::getuid`）。少这个 flag 会让判据漏掉整个测试面。
      #
      # 这一步之前，daemon 在 Windows 上 **RC=101 / 12 个错**，而 CI 从来不知道。
      - name: cargo check（跨 target：Windows 编得过 —— 平台线的真判据）
        # ★ 08-25：这三个环境变量是上面那步 zig 的用法，**不改这条命令一个字符** ——
        # `shared_crate_registry::ci_actually_runs_the_daemon_four_steps` 对下面这条 `run:` 是
        # **整行全等**匹配（不是子串），所以 `cargo xwin check …` 那种写法会直接把它打红。
        #
        # ★★ 逐字说清这一步今天证什么、**不**证什么（别让下一个人把它读大一格）：
        #   · **证**：我们自己的 Rust 代码（含中转与 TLS）在 `x86_64-pc-windows-msvc` 上
        #     `--all-targets` 全量类型检查通过。本机实测 exit **0**，`Checking cc-monitor-remote` 命中 **1**
        #     （⚠ 包名是 `cc-monitor-remote`，目录名才是 `remote-daemon-proto` —— 拿目录名当 needle 会永远数出 0）。
        #   · **不证**：`ring` 的那点 C 在 **MSVC ABI** 下编得过。这里编的是 **windows-gnu ABI 的 COFF**，
        #     因为 zig 不带 MSVC 的 libc 头（实测 `-target x86_64-windows-msvc` 直接
        #     `'string.h' file not found`）。`cargo check` **不链接** ⇒ 那份 `.lib` 从头到尾没人用，
        #     它存在只是为了让 build script 走完、好让检查继续走到我们的代码。
        #   · 「`ring` 在真 Windows 上编得过」这一格由上游与真机负责：08-25 在一台真 Windows 上跑
        #     同一份代码 `cargo check --all-targets` ⇒ EXIT=0 / 0 error（读数住 `ROADMAP` `KU10`）。
        #   · ⇒ 这一步**没有**因此变弱：它守的一直是「我们的代码在 Windows 上编得过」，那一半一个字没动。
        env:
          CC_x86_64_pc_windows_msvc: zig cc
          CFLAGS_x86_64_pc_windows_msvc: --target=x86_64-windows-gnu
          AR_x86_64_pc_windows_msvc: zig lib
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

      # clippy 同后端 job：仅警告，不强制
      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test


  # L4（local-as-remote）：**Linux 宿主上 app 能不能构建**的持续信号。
  #
  # 为什么要它：L0 在开发机上实测过「三个 WebKitGTK pkg-config 依赖都在、`cargo build`
  # 完整 app 二进制 rc=0」，但那是**一台机器一次性的读数**。没有这个 job，Linux 侧的构建
  # 会在没人看的时候烂掉——而 `release.yml` 的 Linux 打包 job 只在 tag 时跑，
  # **等到发版才发现就晚了**。⇒ 这个 job 是那个发版 job 的**前置信号**。
  #
  # **刻意只 build 不 bundle**：bundle（deb）要多几分钟，而回归信号在「能不能编过」这一步
  # 就拿到了。打包本身留给 release（那里本来就要跑一次）。
  #
  # 装包说明：ubuntu runner 不预装 WebKitGTK 开发包。本仓 CI 里装系统包已有先例
  #（e2e job 装 tmux/jq），这里同理——**这与「本机不装软件包」那条纪律无关**，那条说的是
  # 开发者自己的机器。
  linux-app-build:
    name: Linux app build (no bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与其余 job 对齐
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 在 Linux 上的构建期依赖。**逐个都是编译 app 必需**（不是打包才要的）：
      # webkit2gtk-4.1 = WebView；gtk-3 = 窗口；ayatana-appindicator3 = 托盘；rsvg2 = 图标。
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm ci
        run: npm ci

      # 与 L0 本机实测的同一组命令：先前端，再 app 二进制。
      - name: npm run build (tsc + vite)
        run: npm run build

      - name: cargo build (full app binary, not --lib)
        working-directory: src-tauri
        run: cargo build

  # F09：e2e 脚本**健康冒烟**（非真 e2e）。真 e2e（Xvfb + tauri dev 全量 app + xdotool，见
  # e2e/README.md）需 Linux GUI runner + 5min+ app 构建，且 app 生产仅 Windows → 大投入低 ROI，
  # 留 v2/真机。这里只防脚本**腐烂**：shellcheck 只挡 error 级（忽略 info/style 噪音，f40-suite
  # 有意用 ls/eval 等）+ python 语法编译。ubuntu-latest 预装 shellcheck，零安装、秒级。
  e2e-smoke:
    name: E2E scripts health (shellcheck + py compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # B01 审计 I5：搬进来的 `shared/cc-bus/` 有 1107 行 shell，此前**零 lint 覆盖**——
      # 唯一门禁是下面那条 exec-bit 守卫。扩进来实测今天就是绿的（severity=error 零告警），
      # 零成本。`shared/ccm` 一并纳入：它被 `sftp.rs:538` include_str! 进二进制，是生产件。
      # **刻意不含 `shared/ccm-aliases.sh`**：那是个供 source 的片段、无 shebang，
      # SC2148 是它的构造性属性；而它会被写进用户 shell profile、并在 UI 面板里展示供手动复制，
      # 为过 lint 往里塞 `# shellcheck shell=bash` 等于往用户配置和界面文案里掺 lint 噪音。
      # G-B：vendored `cc-acct-iso` 的 1348 行 bash 纳入。同一条论证：它被
      # `acct_iso_deploy.rs` 的 `include_bytes!` 打进二进制、部署到远端执行，**是生产件**
      # ——与当初把 `shared/ccm` 纳入的理由一字不差。实测（2026-07-30）`--severity=error`
      # 零告警，连默认档（含 warning/info/style）也是零（脚本自带 `# shellcheck disable=` 指令）。
      #
      # **不要写成 `src-tauri/vendor/cc-acct-iso/scripts/**`**：不开 globstar 时 `**` 等价于 `*`，
      # 会把 `scripts/test`（目录）喂给 shellcheck ⇒ `openBinaryFile: inappropriate type` ⇒ 恒红。
      # 主计划账本原文就是那个 pattern，G-B 开工实测踩出来的。故显式列四个文件。
      #
      # **覆盖面地板**（本工作区在治的病：零断言/零覆盖也报绿）：文件数少一个就红。
      # 改名/挪走脚本时若不同步这里，shellcheck 会少扫几个文件而**照样绿**——地板挡的正是这个。
      # 08-13 棘 52 → 53：新增 `e2e/cc-bus-queue-drain.sh`（cc-send 滞留队列补投）。
      # 实测构成（本机 `shopt -s nullglob` 后逐组数）：
      #   e2e/*.sh 31 + shared/cc-bus/scripts/* 14 + shared/ccm 1 + e2e/fake-claude 1
      #   + scripts/*.sh 2 + vendor/cc-acct-iso 那 4 个 = **53**。
      # 08-13 再棘 53 → 54：新增 `e2e/daemon-cc-bus.sh`（P4f）⇒ e2e/*.sh 变 32。
      # ⚠ 我第一版把构成写成「e2e/*.sh 37 + …」——**那是凑出 53 的假账**，
      #   总数对得上不等于构成对得上。数字要逐组数出来，别倒推。
      - name: shellcheck (errors only)
        run: |
          set -euo pipefail
          # ⚠ `nullglob`：不开的话，某一组 glob 一个都不匹配时 bash 会**留下字面量**
