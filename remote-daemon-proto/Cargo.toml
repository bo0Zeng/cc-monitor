[package]
name = "cc-monitor-remote"
version = "0.0.0"
edition = "2021"

# Standalone crate, intentionally NOT part of a workspace. There is no root
# Cargo.toml: a workspace would pull this Linux-only daemon into the Windows
# CI `cargo test --all` and break the build. Build this natively on the target.
#
# F20（2026-08-04）：「standalone」到底 standalone 到什么程度 —— 实测答案，别再猜：
#   · `cargo build`  **真的独立**。把两条 daemon→monitor 的 `include_str!` 路径打断，
#     `cargo build` 仍然 exit=0 / 0 error ⇒ 目标机原生构建**不需要**旁边那棵 `src-tauri/`。
#   · `cargo test`   **不独立**。它需要 `../src-tauri/` 在 —— 两条判据要跨轨对拍
#     （`control/gate.rs` 读 Gate 2 的黄金夹具 · `control/launch.rs` 读 monitor 的
#     `tmux.rs` 断言 `format!("={target}:")` 两侧同形）。打断后 `cargo test --no-run`
#     exit=101，两条都被逐字点名。
# 这两条边**刻意保留**：跨轨对拍是「两侧不许偷偷漂开」的唯一保障，而它只在判据里，
# 不影响部署。由 monitor 侧 `cross_half_edge_registry` 逐条登记 + 钉住
# 「一条都不许长到生产段」（真长过去，上面那句 standalone 就变假了）。

[[bin]]
name = "cc-monitor-remote"
path = "src/main.rs"

[dependencies]
# Versions pinned to whatever ../src-tauri/Cargo.lock already resolved so the
# local cargo cache serves these offline (serde 1.0.228 / serde_json 1.0.x,
# tokio 1.52.x, notify 6.1.x, notify-debouncer-mini 0.4.x, walkdir 2.5.x,
# tracing 0.1.x). Keep this list minimal.
#
# ⚠ 订正〔回修轮 08-25，承接 D1 `重要-4` / `漂-2`〕：**上面这句话只管它点名的那几条。**
# `rustls` / `webpki-roots`（K-H1 加的，见本表末尾）**不在** `../src-tauri/Cargo.lock` 里 ——
# 同一把尺子 `grep -c '^name = "rustls"$' ../src-tauri/Cargo.lock` ⇒ **0**，`webpki-roots` ⇒ **0**
# （而上面点名的 serde / serde_json / tokio / notify / notify-debouncer-mini / walkdir /
#  tracing / tracing-subscriber / libc 逐个量都是 1）。
# ⇒ 这两条**没有**被 pin 到 monitor 那份 lock，**也不能**靠「monitor 早就下过」变成离线可用。
# 准确说法：**一台从没下过 `rustls` 的机器，daemon 第一次构建必须联网**；下过之后本机缓存才服务得了它。
# 这正是 `裁-1` 代价② 认下的那条 —— 代价认了，而这段块头注先前一个字没跟着改，于是它自己变成了假话。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# G1：分叉的记录变换与 monitor 共用同一份（单向 path 依赖；不会把本 crate 拖进 monitor 的 workspace）。
branch-core = { path = "../src-tauri/crates/branch-core" }
usage-core = { path = "../src-tauri/crates/usage-core" }
acct-core = { path = "../src-tauri/crates/acct-core" }
# K-H2a：第三方 API key 的唯一住址（装它的类型 / 落盘格式 / 权限判断）。
# ★★ **刻意不开 `harden`**：那个 feature 才带「把文件收窄」的平台原语，而
# `K-H2a` 裁四逐字定死 daemon **只许读那份文件，不许写** ——
# `readonly_guard.rs` 扫本 crate 生产段（剥掉 `#[cfg(test)]` 之后）断言不含任何
# 文件系统变更调用，白名单**恰好一个模块** `control/fork_write.rs`。
# ⇒ 不开 feature ⇒ `creds_core::perm::make_private` 在本 crate 里**根本不存在**，
#   写不出来比事后检测更强（`scanning_guard_registry` 头注逐字：「让它写不出来，而不是再检测一遍」）。
# ⚠ 代价如实记：不开 `harden` ⇒ Windows 上 `perm::probe` 读不了 DACL，返回 `Undetermined`。
#   那**不是**绿灯（`judge` 把它判成要出声），但确实是「查不出来」。daemon 今天的运行目标是 Linux。
creds-core = { path = "../src-tauri/crates/creds-core" }
# U8c-2b-0：POSIX 单引号 quote 的唯一实现（账本 S5 收口）。
# 本 crate 只用它一处（`control/tmux_hook::sq`）；U8c-2c 起载荷渲染也走它。
shell-quote-core = { path = "../src-tauri/crates/shell-quote-core" }
# F03：§34 Gate 2 的唯一实现。**生产依赖**——这道门要在 `control/` 的生产段真的执行，
# 不是只在测试里比对（那样就成了「门在测试里、路在生产里」）。
gate-core = { path = "../src-tauri/crates/gate-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    # io-std gates tokio::io::stdout(); io-util alone is not enough.
    "io-std",
    # K-P1：常驻监听口（回环 TCP）。**只加 feature，不加依赖条目** ——
    # `net` 带进来的 `socket2` **是纯 Rust**（本 crate 的 lock 现打 `socket2 0.6.3`，
    # 它的 `dependencies` 只有 `libc` 与 `windows-sys` ⇒ 纯 FFI 绑定，没有 `cc` 构建脚本，
    # **不新增一棵 C 构建树**），`mio` 本 crate 的 lock 里早就有（`signal`/`io-std` 都在用它）。
    # ⚠ **这句话先前撑在一条已经作废的框架上，别再照抄**〔`K-R34` 09-06 换掉〕：
    #   原文逐字「`net` 带进来的 `socket2` 是纯 Rust（`C18`「依赖树零 C」**不受影响**）」——
    #   **事实那一半是真的、留着**；换掉的是括号里那条框架：
    #   盘上逐字「~~**C18** daemon 不引 C 生态链~~ **已被推翻（08-29）**」
    #   （住址 backend-consolidation 的 `MASTERPLAN.md:58`；现行版本是 `K30`
    #    ——「装到任意 agent 机器就能跑」＝静态 musl · 两个架构都出得来 · 体积在预算内，
    #    **不是**「零 C」）。
    #   ⇒ 今天这一格要说的是「**多这一个 feature 不新增 C 构建树**」，
    #     **不是**「零 C 没被破坏」—— 本 crate 的「零 C」本来就早不成立，
    #     逐字同结论写在本表末尾 `russh` 那段的 `①`，两处说的是同一件事。
    # ⚠ 为什么不沿用 `relay/` 那份 `std::net::TcpListener`（blocking）：
    # 常驻这条路要把 socket 的读写两半**原样喂给今天 stdin/stdout 的位置**
    # （`inbound::spawn<R: AsyncRead>` · `writer_task<W: AsyncWrite>` 本来就是泛型），
    # 而 `std` 的 socket 变不成 `AsyncRead`/`AsyncWrite`。
    "net",
    "sync",
    "signal",
    "fs",
    "time",
] }
# P2（zero-poll-liveness）：pidfd_open + poll。**已是 tokio 在 unix 上的传递依赖**
# （本 crate Cargo.lock 里 libc 0.2.186 早已解析）⇒ 声明它不动 lock、离线可用。
# 只用 SYS_pidfd_open / poll / pollfd 三样，不引入任何 feature。
libc = "0.2"
# K-H1〔裁-1，08-25〕：**daemon 侧第一条加密依赖**，也是**本仓第一条 TLS（X.509 + 根证书链）依赖**。
#
# ⚠ 口径订正〔回修轮 08-25，承接 D1 `重要-4`〕：先前这里逐字写的是「**本仓**第一条加密依赖」，
# 而下面两行同时写着「`ring` 已经在」—— **同一段注释自相矛盾**，且前半句是假的。
# 根子是两个词混着用了，分清楚：
#   · **依赖图**（谁的 Cargo.lock / cargo tree 里有它）：`ring 0.17.14` 在本件**之前**就已在
#     monitor 的依赖图里 —— `git show c3cf193:src-tauri/Cargo.lock | grep -c '^name = "ring"$'` ⇒ **1**，
#     `cargo tree -i ring --manifest-path ../src-tauri/Cargo.toml` ⇒ `ring └── russh └── monitor`。
#     同一把尺子量 **daemon 自己**那份 lock 的同一个尖 ⇒ **0** —— 所以「**daemon 侧**第一条」是真话。
#   · **本机 cargo 缓存**（`~/.cargo/registry/cache/` 里有没有那个 `.crate` 文件）：**只说这台机器**，
#     与依赖图是两件事。缓存里有不等于依赖图里有，反过来也一样。
#   ⇒ 下面「少下一棵 C 构建树」这条好处**两个口径都成立**，但它买到的是**构建时间**，不是「本仓第一条」。
#
# **只准 TLS**，`K8` 那条「不引 HTTP 框架」的白名单一个字没松 —— HTTP/1.1 的请求解析与
# chunked 写出仍是手写的（见 src/relay/）。
# 选 `rustls` 而不是 `ureq`/`hyper`：后两者是 HTTP 客户端/框架，会把「一个块」变成一层框架。
# crypto provider 钉 `ring`（不是默认的 aws-lc-rs）：`ring` 是 monitor 侧 `russh` 已经在用的那一棵，
# 复用它省掉 aws-lc-rs 那棵**另外**要现下载现编的 C 构建树。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# ── `K-P6b`（候选 E）：`--dial` 那条代理臂的 SSH 客户端 ──────────────────────
#
# 🔴 **它只服务 `src/dial/`那一份**（`dial_locality` 那条判据把「谁许 `use russh`」钉在文件维上）。
# 版本与 feature 集**逐字照抄** `../src-tauri/Cargo.toml`（`0.61.1` · `default-features = false`
# · `["ring", "flate2", "rsa"]`）—— 理由不是省事：**两侧握出来的必须是同一套算法集**，
# 一侧多开一个 feature 就意味着「界面拨得通、代理拨不通」这种只在某台远端上才现形的分叉。
# `primefield` 那条 `=` 钉同理，逐字理由住 `../src-tauri/Cargo.toml`（p256/p521 的 rc.9/rc.10 不兼容）。
#
# ⚠⚠ **两条如实登记的代价，别读成「没问题」**：
#   ① **`C18`「依赖树零 C」这条本 crate 早就不成立**（`rustls`/`ring` 08-25 就进来了，
#      `KG1` 成功标准② 已因此重写成「静态 musl 二进制」）。russh 走的是**同一棵 `ring`**
#      ⇒ 它**不新增**一棵 C 构建树；但这句话是「不新增」，**不是**「零 C」。
#      ⚠ 补一句〔`K-R34` 09-06〕：**那条框架本身后来也没了** —— 盘上逐字
#      「~~**C18** daemon 不引 C 生态链~~ **已被推翻（08-29）**」（住址 backend-consolidation 的
#      `MASTERPLAN.md:58`；现行版本是 `K30`）⇒ 今天**不是**「本 crate 破了一条还活着的规矩」，
#      是**那条规矩已经不在了**。上面 tokio 那条 `net` feature 的注释同源同结论，
#      **这份文件里关于 `C18` 的两处话从此不再打架**。
#   ② 🔴 **musl 交叉编译本轮没验**。CI（`.github/workflows/release.yml` 的 `build-daemons`）
#      要把本 crate `cargo zigbuild` 到 `x86_64-unknown-linux-musl` 与 `aarch64-unknown-linux-musl`，
#      **而沙箱门禁只做本机 gnu 构建、不做交叉编译** ⇒ **门禁全绿也证不出这两个 target 编得过**。
#      `ring` 在 musl 上要 `cc` 编汇编，zig 作 linker 这条路本 crate 已经走通过（`rustls` 那次），
#      但**那次的依赖树里没有 russh**。**这一格是「没验」，不是「验过没事」。**
#
# ⚠⚠ **第三条如实登记：这一条今天离线解析不动，靠的是 lock 已经先播过种。**
# `russh 0.61.1` 无条件依赖 `crypto-bigint ^0.7.1`，而现打：`crypto-bigint` 的
# `0.7.0 … 0.7.4` **在 crates.io 上全部 yanked**（只有 `0.7.5` 没被 yank），
# 而门禁那个断网沙箱的 crate 缓存里**只有** `crypto-bigint-0.7.3.crate` 一份
# ⇒ `--offline` 把候选集限成「已下载的那几份」⇒ 唯一候选是 yanked 的那份
# ⇒ **`cargo` 在解析这一步拒绝选它**（`=0.7.3` 硬钉也照拒），实打退 101。
# `cargo` 只在**解析**时拒 yanked，不在「lock 里已经写着」时拒 ——
# `../src-tauri/Cargo.lock` 今天就锁着 `crypto-bigint 0.7.3`（在 yank 之前锁进去的），
# monitor 侧因此断网构建得动。⇒ 本 crate 的 lock 由 `evidence/K-P6b-r3-lock-prime.py`
# 把 monitor 那份里 `russh` 可达的包块搬过来，处境与 monitor 侧对齐。
# 🔴 **代价写明**：本 crate 从此也钉在一个 **yanked** 的 `crypto-bigint 0.7.3` 上
# （与 monitor 侧同一份）。哪天 `russh` 升到能用 `0.7.5` 的版本，两侧一起挪。
#
# ── 🔴 **今天的状态与后果**〔`K-R34` 09-06 补〕 ───────────────────────────────
# 上面那三段讲的是 `K-P6b` **当时怎么绕过去的**（拿 monitor 那份 lock 播种）。这一段讲**今天**。
#
# ① **今天钉着哪个版本 —— 本轮现打**（09-06，量于 `97a4714`，两份 lock 各一把同样的尺子
#    `grep -c '^name = "crypto-bigint"$' <lock>`）：`remote-daemon-proto/Cargo.lock` ⇒ **1** 处、
#    版本 **`0.7.3`**；`../src-tauri/Cargo.lock` ⇒ **1** 处、版本也是 **`0.7.3`**。**两侧同一份。**
#
# ② 🔴 **后果一句话：「今天编得过」不等于「明天还编得过」。**
#    今天编得过，**是因为 lock 里已经写着** —— `cargo` 只在**解析**那一步挡 yanked。
#    凡是让 cargo **重走解析**的事：`cargo update` · 删掉 / 换掉 lock · 换一台没有这份 crate
#    缓存的机器 · 加或改任何一条依赖 —— **都会撞上同一堵墙**。
#    ⇒ 这**不是**「今天编不过」，是「**哪天要重解析就编不过**」。别把绿门禁读成这件事没了。
#
# ③ ⚠ **「那几个版本到底有没有被 yank」—— `K-R34` 本轮没核，判不了。**
#    上面「`0.7.0 … 0.7.4` 全部 yanked」那句是 `K-P6b` 那一轮写下的，当时的依据是
#    **解析期报错**（住址就在上面同一段）—— 那是**转述，不是本轮的读数**。
#    要核它得**联网**查 crates.io，而门禁沙箱一律断网（`DEVBOX_NET=none`）
#    ⇒ 本文件里关于 yank 的每一句（含上面「代价写明」那两行），读的时候都要带上这个口径。
#
# ④ 🔴 **两条出路 —— 这里只写「谁来决定」，不写「怎么做」；`K-R34` 不做决定**：
#    · **升到 `crypto-bigint 0.7.5`**：它是跟着 `russh` 走的，而两侧的版本与 feature 集
#      **必须同版同 feature**（理由见上面那段：一侧多开一个 feature 就是「界面拨得通、
#      代理拨不通」）⇒ **本 crate 单方面决定不了**，是**一件同时动 monitor 与 daemon 两侧的活**。
#      **谁来决定：PM 立件、用户拍板。**
#    · **砍掉 `rsa` feature**（`crypto-bigint` 就是它拉进来的）：要**先量**
#      「有没有只认 RSA host key 的远端」—— 那是一次对**真实远端**的摸底，**今天没人量过**。
#      **谁来决定：用户**（只有他知道要连哪些机器）。
#    ⚠ 这两条都压着 ③ 那一问（**要联网**）。
#
# ⑤ ⚠ **别把这一段读成「已知问题、可接受」—— 没有人裁过那句话。**
#    它今天的状态是「**登记在案、等着谁来决定**」，不是「批过了」。
# ─────────────────────────────────────────────────────────────────────────
russh = { version = "0.61.1", default-features = false, features = ["ring", "flate2", "rsa"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# U8a-2a：源码扫描型守卫的「只留生产段」剥法，与 monitor 共用同一份（守卫全在 cfg(test)，
# 故是 dev-dependency —— 不进发布二进制）。
guard-core = { path = "../src-tauri/crates/guard-core" }
